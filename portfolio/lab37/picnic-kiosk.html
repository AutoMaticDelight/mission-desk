<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bowl-O-Matic 5000 - Kiosk</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
/* KIOSK / REGISTER. The public ordering screen in a store — a 14×24-inch landscape touch panel with the Bowl-O-Matic behind the
   glass. Layout and spacing from the Square Register Favorites grid (refs/square-pos-favorites.jpg): a thin left rail, tabs on
   top, a grid of photo tiles with a column of solid category tiles, and a running ticket with subtotal · tax · total and one big
   Pay bar on the right. Apple-card language from PANEL-DESIGN.md. Light. Scaled for a standing customer. */
:root{--bg:#f4f4f2;--tile:#e9e9e6;--card:#fff;--ink:#1c1c1e;--dim:#6e6e73;--line:#e0e0dc;--rail:#fbfbfa;--cat:#d9963e;--cat-ink:#fff;--hot:#c8f000;--dock:#1c1c1e;--ok:#34c759}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:600;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none;display:grid;grid-template-columns:150px minmax(0,1fr) 520px;height:100vh;overflow:hidden;font-size:22px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
b{font-weight:800}.num{font-variant-numeric:tabular-nums}

/* LEFT RAIL */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:22px 12px;gap:8px}
.rail .mark{display:grid;place-items:center;margin:0 0 18px}
.rail .mark svg{width:60px;height:60px}
.rail button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 6px;border-radius:14px;font-size:17px;font-weight:700;color:var(--ink)}
.rail button i{font-style:normal;font-size:30px;line-height:1}
.rail button.on{background:#e6e6e2}
.rail .spacer{flex:1}
.rail .clock{text-align:center;font-size:18px;color:var(--dim);font-weight:600}

/* GRID */
.center{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.tabs{display:flex;align-items:center;gap:36px;padding:22px 36px 0;border-bottom:1px solid var(--line);font-size:24px;font-weight:700}
.tabs button{padding:12px 2px 18px;border-bottom:4px solid transparent;color:var(--dim)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .tools{margin-left:auto;display:flex;gap:10px}
.tabs .tools button{width:56px;height:56px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;font-size:24px;padding:0;border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:14px;padding:22px 36px 30px;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.tile{position:relative;background:var(--tile);border-radius:16px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);text-align:left;min-height:0;transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .n{padding:14px 16px 0;font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.01em;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n small{display:block;font-size:16px;color:var(--dim);font-weight:600;margin-top:2px}
.tile img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;background:#e3e3df;padding:8% 12% 6%;mix-blend-mode:multiply}
.tile .pr{position:absolute;right:14px;top:14px;font-size:18px;font-weight:800;background:#fff;border-radius:9px;padding:5px 9px;z-index:1}
.tile.cat{background:var(--cat);color:var(--cat-ink);grid-template-rows:1fr}
.tile.cat .n{padding:16px 16px;white-space:normal;font-size:22px}
.tile.cat.dark{background:var(--dock)}
.tile.cat.lime{background:var(--hot);color:#111}

/* TICKET */
.ticket{background:var(--card);border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:0}
.ticket .head{display:flex;align-items:center;justify-content:space-between;padding:26px 28px 14px;font-size:26px;font-weight:800}
.ticket .head span{font-size:20px;color:var(--dim);font-weight:600}
.lines{overflow-y:auto;overscroll-behavior:contain;padding:0 28px;min-height:0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.line b{display:block;font-size:22px}
.line small{display:block;font-size:18px;color:var(--dim);font-weight:600;line-height:1.3;margin-top:3px}
.line .amt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.line .rm{grid-column:1/-1;justify-self:start;font-size:17px;color:var(--dim);padding:6px 0 0}
.empty{padding:40px 0;color:var(--dim);font-size:20px;line-height:1.4}
.sums{padding:16px 28px 8px;display:grid;gap:8px;font-size:20px;color:var(--dim)}
.sums div{display:flex;justify-content:space-between}
.sums .tot{font-size:26px;color:var(--ink);font-weight:800;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.pay{margin:12px 28px 28px;height:96px;border-radius:999px;background:var(--dock);color:#fff;font-size:30px;font-weight:800;letter-spacing:-.01em;display:grid;place-items:center}
.pay[disabled]{background:#d6d6d2;color:#fff;cursor:default}
.pay:active{transform:translateY(2px)}
.build{margin:0 28px;display:flex;align-items:center;gap:12px;background:#f2f2f0;border-radius:14px;padding:12px 14px;font-size:17px;color:var(--dim)}
.build svg{width:32px;height:32px;flex:none}
.build b{color:var(--ink)}

/* BUILDER SHEET (a bowl's options) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10;padding:40px}
.overlay.show{display:flex}
.sheet{background:#fff;border-radius:26px;width:min(1180px,100%);max-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}
.sheet .sh{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px 28px;border-bottom:1px solid var(--line)}
.sheet .sh img{width:120px;height:120px;border-radius:16px;object-fit:cover;background:#e3e3df}
.sheet .sh h2{margin:0;font-size:30px;letter-spacing:-.01em}
.sheet .sh p{margin:6px 0 0;font-size:19px;color:var(--dim);font-weight:600;line-height:1.35}
.sheet .sh .x{width:64px;height:64px;border-radius:50%;background:#f0f0ee;display:grid;place-items:center;font-size:30px}
.sheet .body{overflow-y:auto;padding:12px 28px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
.grp h3{margin:16px 0 8px;font-size:15px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.grp h3 span{letter-spacing:0;text-transform:none;font-weight:700;color:var(--ink)}
.grp h3 span.done{color:#1f8a3c}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:60px;padding:0 18px;border-radius:14px;background:#f0f0ee;font-size:20px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.opt small{font-weight:600;color:var(--dim);font-size:16px}
.opt.on{background:var(--hot);color:#111}
.opt.on small{color:#3a4a00}
.opt.dis{opacity:.35}
.sheet .sf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px 28px 24px;border-top:1px solid var(--line)}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:64px;height:64px;border-radius:14px;background:#f0f0ee;font-size:32px;display:grid;place-items:center}
.qty b{min-width:52px;text-align:center;font-size:26px}
.addb{height:76px;border-radius:999px;background:var(--dock);color:#fff;font-size:24px;font-weight:800;display:grid;place-items:center}
.addb[disabled]{background:#d6d6d2}

/* PAID */
.done{position:fixed;inset:0;background:#fff;display:none;place-items:center;text-align:center;z-index:20}
.done.show{display:grid}
.done .num{font-size:260px;line-height:1;font-weight:900;letter-spacing:-.05em}
.done h1{margin:6px 0 10px;font-size:52px;letter-spacing:-.02em}
.done p{margin:0 auto;max-width:760px;font-size:26px;color:var(--dim);line-height:1.4;font-weight:600}
.done .watch{margin:36px auto 0;display:inline-flex;align-items:center;gap:16px;background:var(--dock);color:#fff;border-radius:20px;padding:22px 30px;font-size:24px}
.done .watch span{color:var(--hot)}
.done .again{display:block;margin:34px auto 0;font-size:22px;font-weight:700;padding:20px 36px;border-radius:999px;background:#f0f0ee}
.pay{width:calc(100% - 56px);display:flex;align-items:center;justify-content:center}
.tile .n{white-space:normal;overflow:visible;padding-right:86px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .n small{white-space:nowrap}
</style></head>
<body>
<nav class="rail">
  <div class="mark"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#c8f000"/><g transform="translate(20 20.6) scale(.62) translate(-20 -21)"><circle cx="20" cy="11.5" r="6.5" fill="#0b120e"/><path d="M4.5 21.5h31a1.5 1.5 0 0 1 1.5 1.6C36.2 30.6 29 36.5 20 36.5S3.8 30.6 3 23.1a1.5 1.5 0 0 1 1.5-1.6z" fill="#0b120e"/></g></svg></div>
  <button class="on"><i>▦</i>Order</button>
  <button><i>⇄</i>Pickup</button>
  <button><i>♡</i>Rewards</button>
  <button><i>≡</i>More</button>
  <div class="spacer"></div>
  <div class="clock" id="clock">12:18</div>
</nav>

<section class="center">
  <div class="tabs" id="tabs"><button class="on" data-t="fav">Favorites</button><button data-t="bowls">Bowls</button><button data-t="sides">Sides</button><button data-t="drinks">Drinks</button>
    <div class="tools"><button>⌕</button><button>✎</button></div></div>
  <div class="grid" id="grid"></div>
</section>

<aside class="ticket">
  <div class="head"><span id="count">0 items</span><b id="tname">New order</b></div>
  <div class="lines" id="lines"></div>
  <div class="sums"><div><span>Subtotal</span><b class="num" id="sub">$0.00</b></div><div><span>Tax</span><b class="num" id="tax">$0.00</b></div><div class="tot"><span>Total</span><span class="num" id="tot">$0.00</span></div></div>
  <div>
    <div class="build"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#c8f000"/><g transform="translate(20 20.6) scale(.62) translate(-20 -21)"><circle cx="20" cy="11.5" r="6.5" fill="#0b120e"/><path d="M4.5 21.5h31a1.5 1.5 0 0 1 1.5 1.6C36.2 30.6 29 36.5 20 36.5S3.8 30.6 3 23.1a1.5 1.5 0 0 1 1.5-1.6z" fill="#0b120e"/></g></svg><div>Built to order by the <b>Bowl-O-Matic</b> behind the glass · <b id="eta">ready in 4 min</b></div></div>
    <button class="pay" id="pay" onclick="pay()" disabled>Pay</button>
  </div>
</aside>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="done" id="done"><div><div class="num" id="onum">47</div><h1>Your bowl is building</h1><p>Watch the Bowl-O-Matic through the glass. We'll call your number at the counter.</p><div class="watch">Bowl 01 · <span id="seq">1 of 7 steps</span> · in queue behind 2</div><button class="again" onclick="reset()">Start another order</button></div></div>

<script>
const C=k=>`https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(k)}?width=500`;
const im=(key,c)=>`<img alt="" src="img/${key}.jpg" onerror="this.onerror=null;this.src='${C(c)}'">`;
// favorites grid: 4 photo columns + a column of solid category tiles, as on the reference
const ITEMS=[
 {id:'fc',n:'Fried Chicken Bowl',sub:'36g protein',p:17,key:'fried-chicken',c:'Karaage_001.jpg',bowl:1,tab:'bowls'},
 {id:'st',n:'Steak Bowl',sub:'42g protein',p:18.5,key:'bbq-steak',c:'Bulgogi.jpg',bowl:1,tab:'bowls'},
 {id:'bc',n:'BBQ Chicken Bowl',sub:'46g protein',p:16.5,key:'bbq-chicken',c:'Grilled_Chicken_Breasts_(28905381261).jpg',bowl:1,tab:'bowls'},
 {id:'cf',n:'Cauliflower Bowl',sub:'vegan',p:15,key:'cauliflower',c:'Cauliflower_wings.jpg',bowl:1,tab:'bowls'},
 {id:'tf',n:'Tofu Bowl',sub:'vegan · 22g',p:15,key:'tofu',c:'Tofu_4.jpg',bowl:1,tab:'bowls'},
 {id:'ss',n:'Steak Salad',sub:'greens base',p:18.5,key:'greek-salad',c:'Greek_Salad.jpg',bowl:1,tab:'bowls'},
 {id:'hb',n:'Half & Half Bowl',sub:'½ chicken · ½ steak',p:18,key:'half',c:'Bulgogi.jpg',bowl:1,tab:'bowls'},
 {id:'kb',n:'Kids Bowl',sub:'chicken · rice',p:9,key:'white-rice',c:'Bowl_of_white_rice_02.jpg',tab:'bowls'},
 {id:'fr',n:'FG Fries',sub:'garlic aioli',p:8,key:'fries',c:'Pommes-1.jpg',tab:'sides'},
 {id:'ng',n:'Chicken Nuggets',sub:'6 pc',p:8,key:'nuggets',c:'Chicken_nuggets.jpg',tab:'sides'},
 {id:'cw',n:'Cauliflower Wings',sub:'with dip',p:14,key:'cauliflower',c:'Cauliflower_wings.jpg',tab:'sides'},
 {id:'eg',n:'Jammy Egg',sub:'side',p:2,key:'jammy-egg',c:'Soft_boiled_egg.jpg',tab:'sides'},
 {id:'gj',n:'Green Juice',sub:'16 oz',p:7.5,key:'green-juice',c:'Green_smoothie.jpg',tab:'drinks'},
 {id:'ic',n:'Iced Coffee',sub:'16 oz',p:5,key:'iced-coffee',c:'Iced_coffee.jpg',tab:'drinks'},
 {id:'sm',n:'Smoothie',sub:'strawberry',p:7.5,key:'smoothie',c:'Strawberry_smoothie.jpg',tab:'drinks'},
 {id:'wt',n:'Sparkling Water',sub:'can',p:3,key:'water',c:'Sparkling_water.jpg',tab:'drinks'},
];
const CATS=[['Bowls','bowls','cat'],['Sides','sides','cat'],['Drinks','drinks','cat'],['Group order','group','cat dark'],['Build your own','byo','cat lime']];
const GROUPS=[
 {id:'base',h:'Base',min:1,max:1,opts:[['White rice',0],['Power grains',0],['Cauliflower rice',2.5],['Mixed greens',1]]},
 {id:'sides',h:'3 sides',min:3,max:3,opts:[['Jammy egg',1.5],['Avocado',1.5],['Tzatziki',1.5],['Hummus',1.5],['Broccoli',0],['Sweet potato',0],['Mushrooms',0],['Kale slaw',0],['Kimchi',2],['Pickled onion',0],['Greek salad',0],['Black beans',0]]},
 {id:'sauce',h:'Sauce',min:1,max:1,opts:[['BBQ',0],['Ranch',0],['Spicy mayo',0],['Tzatziki',0],['Garlic white',0],['Hot sauce',0],['Tahini',0]]},
 {id:'extra',h:'Extras',min:0,max:3,opts:[['Extra protein',6],['Extra egg',2],['Extra avocado',2.25],['Extra sauce',1.5]]},
];
const TAX=.0925;
let TAB='fav', TICKET=[], CUR=null, SEL={}, Q=1, ORDER=46;
const money=v=>'$'+v.toFixed(2);
function renderGrid(){
  const g=document.getElementById('grid');
  const list=TAB==='fav'?ITEMS.slice(0,16):ITEMS.filter(i=>i.tab===TAB);
  let html='';
  list.forEach((it,i)=>{
    html+=`<button class="tile" onclick="tap('${it.id}')"><span class="n">${it.n}<small>${it.sub}</small></span><span class="pr num">${money(it.p).replace('.00','')}</span>${im(it.key,it.c)}</button>`;
    if(TAB==='fav'&&(i%4===3)&&CATS[(i-3)/4]){const c=CATS[(i-3)/4];html+=`<button class="tile ${c[2]}" onclick="cat('${c[1]}')"><span class="n">${c[0]}</span></button>`;}
  });
  g.innerHTML=html;
  document.querySelectorAll('#tabs button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
}
function setTab(t){TAB=t;renderGrid();}
document.querySelectorAll('#tabs button[data-t]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.t)));
function cat(k){if(k==='group')location.href='picnic.html';else if(k==='byo')tap('fc');else setTab(k);}
function tap(id){const it=ITEMS.find(i=>i.id===id);if(it.bowl){CUR=it;SEL={};Q=1;GROUPS.forEach(g=>SEL[g.id]=new Set());renderSheet();document.getElementById('overlay').classList.add('show');}else{add(it,[],1);}}
function pick(gid,i){const g=GROUPS.find(g=>g.id===gid),s=SEL[gid];if(g.max===1){s.clear();s.add(i);}else if(s.has(i))s.delete(i);else if(s.size<g.max)s.add(i);renderSheet();}
function ready(){return GROUPS.every(g=>SEL[g.id].size>=g.min);}
function sheetTotal(){let t=CUR.p;GROUPS.forEach(g=>SEL[g.id].forEach(i=>t+=g.opts[i][1]));return t;}
function renderSheet(){
  document.getElementById('sheet').innerHTML=`<div class="sh">${im(CUR.key,CUR.c)}<div><h2>${CUR.n}</h2><p>${CUR.sub} · pick a base, three sides and a sauce · built to order behind the glass</p></div><button class="x" onclick="closeSheet()">×</button></div>
    <div class="body">${GROUPS.map(g=>{const s=SEL[g.id];return `<div class="grp"><h3>${g.h}<span class="${s.size>=g.min&&g.min?'done':''}">${g.min?s.size+' / '+g.min:(s.size?s.size+' / '+g.max:'optional')}</span></h3><div class="opts">${g.opts.map((o,i)=>`<button class="opt ${s.has(i)?'on':''} ${!s.has(i)&&g.max>1&&s.size>=g.max?'dis':''}" onclick="pick('${g.id}',${i})">${o[0]}${o[1]?`<small>+${money(o[1]).replace('.00','')}</small>`:''}</button>`).join('')}</div></div>`;}).join('')}</div>
    <div class="sf"><div class="qty"><button onclick="Q=Math.max(1,Q-1);renderSheet()">−</button><b class="num">${Q}</b><button onclick="Q=Math.min(9,Q+1);renderSheet()">+</button></div><button class="addb" ${ready()?'':'disabled'} onclick="addCur()">Add to order · ${money(sheetTotal()*Q)}</button></div>`;
}
function closeSheet(){document.getElementById('overlay').classList.remove('show');}
function addCur(){if(!ready())return;const mods=GROUPS.flatMap(g=>[...SEL[g.id]].map(i=>g.opts[i][0]));add(CUR,mods,Q,sheetTotal());closeSheet();}
function add(it,mods,q,unit){TICKET.push({n:it.n,mods,q,unit:unit??it.p,bowl:!!it.bowl});renderTicket();}
function rm(i){TICKET.splice(i,1);renderTicket();}
function renderTicket(){
  const L=document.getElementById('lines');
  L.innerHTML=TICKET.length?TICKET.map((t,i)=>`<div class="line"><div><b>${t.q>1?t.q+' × ':''}${t.n}</b>${t.mods.length?`<small>${t.mods.join(' · ')}</small>`:''}</div><span class="amt num">${money(t.unit*t.q)}</span><button class="rm" onclick="rm(${i})">Remove</button></div>`).join(''):`<div class="empty">Tap a tile to start. Bowls open a quick builder: base, three sides, a sauce.</div>`;
  const n=TICKET.reduce((a,t)=>a+t.q,0), sub=TICKET.reduce((a,t)=>a+t.unit*t.q,0), tax=sub*TAX;
  document.getElementById('count').textContent=`${n} item${n===1?'':'s'}`;
  document.getElementById('sub').textContent=money(sub);document.getElementById('tax').textContent=money(tax);document.getElementById('tot').textContent=money(sub+tax);
  const bowls=TICKET.filter(t=>t.bowl).reduce((a,t)=>a+t.q,0);
  document.getElementById('eta').textContent=bowls?`ready in ${3+bowls} min`:'ready in 4 min';
  const pay=document.getElementById('pay');pay.disabled=!TICKET.length;pay.textContent=TICKET.length?`Pay ${money(sub+tax)}`:'Pay';
}
function pay(){if(!TICKET.length)return;ORDER++;document.getElementById('onum').textContent=ORDER;document.getElementById('done').classList.add('show');let s=1;const t=setInterval(()=>{s=Math.min(7,s+1);document.getElementById('seq').textContent=s+' of 7 steps';if(s===7)clearInterval(t);},1800);}
function reset(){document.getElementById('done').classList.remove('show');TICKET=[];renderTicket();setTab('fav');}
renderGrid();renderTicket();
let NOW=12*60+18,SEC=0;setInterval(()=>{SEC+=6;if(SEC>=60){SEC-=60;NOW++;const h=Math.floor(NOW/60),m=NOW%60;document.getElementById('clock').textContent=(h>12?h-12:h)+':'+String(m).padStart(2,'0');}},1000);
</script>
</body></html>
