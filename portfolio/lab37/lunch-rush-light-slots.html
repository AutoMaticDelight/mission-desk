<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bowl-O-Matic 5000 - Lunch Rush · Light · Slots</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
/* USER PANEL. Not a web page. One iPad screen, portrait or landscape, no scroll.
   High contrast, readable from across the room, no training to operate: color is the state, the number is the detail, buttons are verbs. */
:root{--bg:#0b120e;--panel:#17231c;--track:#3d4a42;--line:#2c3a31;--ink:#ffffff;--dim:#c7d1ca;
  --ok:#1fa36a;--low:#f0a000;--now:#e5401a;--held:#6b7a70;--lime:#cfff3e;--orange:#ff7a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:800;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto auto;gap:16px;padding:20px;height:100vh;overflow:hidden;
  padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
b,strong{font-weight:950}

/* TOP BAND: where, when, speed, to go */
.band{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:20px;align-items:center;background:var(--panel);border-radius:18px;padding:14px 24px;min-height:72px;min-width:0;overflow:hidden}
.band>*{min-width:0}
.band .where{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em;white-space:nowrap}
.band .where span{color:var(--lime);margin-left:10px}
.band .when{font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .when span{margin-left:12px;color:var(--ink)}
.stat{display:flex;align-items:baseline;gap:8px;white-space:nowrap;border-left:2px solid var(--line);padding-left:20px}
.stat b{font-size:clamp(32px,3.4vw,44px);letter-spacing:-.06em;line-height:.9}
.stat span{font-size:17px;letter-spacing:.6px;color:var(--dim)}
.stat i{font-style:normal;color:var(--ok);font-size:clamp(18px,2.2vh,22px)}

/* HOPPERS: the bar is the message */
.hoppers{display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);gap:14px;min-height:0}
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;min-height:0}
.tops{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px;min-height:0}
.bar{position:relative;overflow:hidden;border-radius:18px;background:var(--track);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;min-height:0;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);transition:width .6s}
.bar.low i{background:var(--low)}.bar.now i{background:var(--now)}.bar.held{background:var(--held)}.bar.held i{display:none}
.bar.now{outline:4px solid var(--now);outline-offset:-4px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{outline-color:#ffb39e}}
.bar>*{position:relative;z-index:1}
.big .bar .n{font-size:clamp(22px,3.2vh,34px);letter-spacing:-.02em;text-transform:uppercase;flex:0 1 auto;min-width:0}
.big .bar .m{text-align:right;line-height:.85;flex:0 0 auto}
.big .bar .m b{display:block;font-size:clamp(52px,9vh,96px);letter-spacing:-.07em}
.big .bar .m span{display:block;font-size:clamp(17px,2.2vh,20px);letter-spacing:.4px;margin-top:8px;white-space:nowrap}
.tops .bar{padding:0 16px;border-radius:12px}
.tops .bar .n{font-size:clamp(18px,2.4vh,22px);text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tops .bar .v{font-size:clamp(18px,2.4vh,24px);letter-spacing:-.02em;flex:0 0 auto}

/* ALERT: what, numbers, one button */
.alert{background:var(--panel);border:2px solid rgba(255,122,26,.55);border-radius:18px;padding:18px 24px 20px;display:grid;gap:14px}
.ahead{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:14px;row-gap:4px;font-size:clamp(26px,3.8vh,42px);letter-spacing:-.03em;line-height:1.05}
.ahead small{grid-column:2;font-size:clamp(17px,2.2vh,20px);color:var(--dim);letter-spacing:.3px;font-weight:800}
.ahead i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--now);box-shadow:0 0 0 7px rgba(229,64,26,.28)}
.ahead em{font-style:normal;color:var(--orange)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.num{background:var(--bg);border-radius:14px;padding:12px 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.num b{font-size:clamp(40px,6.5vh,72px);letter-spacing:-.06em;line-height:.9}
.num span{font-size:17px;letter-spacing:.5px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.go{border:0;border-radius:18px;background:var(--lime);color:#0b120e;min-height:clamp(84px,12vh,120px);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;cursor:pointer;box-shadow:0 8px 0 #8caf20;font:inherit}
.go:active{transform:translateY(6px);box-shadow:0 2px 0 #8caf20}
.go .t{font-size:clamp(28px,4.4vh,44px);letter-spacing:-.04em;line-height:1;font-weight:950}
.go .s{font-size:clamp(18px,2.4vh,22px);margin-top:6px;font-weight:800}
.go .a{font-size:clamp(40px,6vh,64px);line-height:1}

/* MORE: three verbs */
.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.more button{border:2px solid var(--track);background:var(--panel);color:#fff;border-radius:14px;min-height:clamp(64px,9vh,84px);font:inherit;font-size:clamp(19px,2.6vh,24px);font-weight:900;letter-spacing:-.01em;cursor:pointer;padding:8px 14px;text-align:center}
.more button:active{background:var(--track)}

/* orientation */
@media(orientation:portrait){
  .band{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;row-gap:6px;min-height:0}
  .band .when{grid-column:1/-1;font-size:18px}
  .stat{border-left:0;padding-left:0}.stat:last-child{justify-content:flex-end}
  .hoppers{grid-template-rows:minmax(0,1fr) minmax(0,1.1fr)}
  .big .bar{flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:16px 20px}
  .big .bar .m{text-align:left}.big .bar .m b{font-size:clamp(56px,8vh,84px)}.big .bar .m span{white-space:normal;margin-top:4px}
  .tops{grid-template-columns:repeat(3,minmax(0,1fr))}
  .num{flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px}.num b{font-size:clamp(40px,5vh,60px)}.num span{white-space:normal}
  .band .where{font-size:24px}
}
@media(max-width:600px){body{height:auto;overflow:auto}.big{grid-template-columns:1fr}.big .bar{min-height:84px}.tops{grid-template-columns:1fr 1fr}.tops .bar{min-height:48px}.more{grid-template-columns:1fr}}

/* sheet base (glove.css turns it into the full-screen hold-to-confirm panel) */
.overlay{position:fixed;inset:0;background:rgba(6,12,8,.63);display:none;align-items:flex-end;justify-content:center;padding:20px;z-index:10}
.overlay.show{display:flex}
.sheet{background:#f8faf7;color:#18231c;width:min(800px,100%);border-radius:21px;padding:25px}
.handle{display:none}.sheet .eyebrow{font-size:16px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:#6b7b70}
.sheet h2{font-size:42px;line-height:.98;letter-spacing:-.06em;margin:8px 0 11px}.sheet p{margin:0;color:#617067;font-size:18px;line-height:1.4}
.effects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.effect{border:1px solid #d5ddd5;background:#fff;border-radius:11px;padding:13px}
.effect b{font-size:16px;display:block}.effect span{display:block;color:#68756c;font-size:16px;margin-top:3px}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end}.sheet button{border-radius:11px;padding:15px 18px;font-weight:900;font-size:16px}
.back{background:#fff;border:1px solid #cbd5cd;color:#324239}.confirm{background:var(--lime);border:0;color:#142217}
.toast{position:fixed;left:0;right:0;top:0;transform:none;z-index:20;background:#0f5a3a;color:#fff;padding:18px 24px;display:none;text-align:center;border-bottom:4px solid var(--lime)}
.toast.show{display:block}.toast b{display:block;font-size:24px}.toast span{font-size:18px;display:block;margin-top:4px}

/* NEXT UP: what is coming for the worker, from the same forecast. First one is live. */
.next{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:16px;align-items:center;background:var(--panel);border-radius:18px;padding:12px 24px;min-width:0}
.next .lbl{font-size:17px;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;white-space:nowrap;padding-right:8px;border-right:2px solid var(--line)}
.task{display:flex;align-items:baseline;gap:10px;min-width:0}
.task b{font-size:clamp(24px,3.2vh,32px);letter-spacing:-.04em;line-height:1;flex:0 0 auto}
.task span{font-size:clamp(17px,2.2vh,20px);text-transform:uppercase;letter-spacing:.3px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.now b{color:#ff8d6a}.task.now span{color:#fff}
.task.low b{color:var(--low)}
@media(orientation:landscape){.tops{grid-template-columns:repeat(4,minmax(0,1fr))}.band .when .peak{display:none}}
@media(orientation:portrait){.next{grid-template-columns:1fr 1fr;row-gap:10px}.next .lbl{grid-column:1/-1;border-right:0;padding:0}}

/* MACHINES AT A GLANCE: one tile per machine. Color is the state. One number each. */
.machines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mach{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--panel);border-radius:18px;padding:10px 18px 10px 12px;min-height:clamp(68px,9vh,84px);min-width:0}
.mach .st{align-self:stretch;display:grid;place-items:center;border-radius:12px;padding:0 14px;font-size:clamp(15px,2vh,18px);letter-spacing:.8px;text-transform:uppercase;background:var(--ok);color:#fff;white-space:nowrap}
.mach.held .st{background:var(--now)}.mach.clean .st{background:var(--low);color:#1a1200}
.mach .nm{font-size:clamp(19px,2.6vh,24px);letter-spacing:-.02em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mach .nm small{display:block;font-size:17px;color:var(--dim);letter-spacing:.3px;font-weight:800;text-transform:none}
@media(orientation:landscape){.mach .nm{font-size:20px}.mach{gap:10px;padding:10px 16px}.mach .k b{font-size:clamp(28px,4vh,40px)}}
.mach .k{text-align:right;white-space:nowrap}
.mach .k b{font-size:clamp(30px,4.2vh,44px);letter-spacing:-.06em;line-height:.9}
.mach .k span{display:block;font-size:16px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
/* verbs inside the alert: smaller, one row */
.alert .more{margin-top:2px}
.alert .more button{min-height:clamp(52px,7vh,64px);font-size:clamp(17px,2.3vh,20px);border-radius:12px;background:var(--bg)}
/* tighter vertical budget in landscape */
@media(orientation:landscape){
  body{gap:12px;padding:16px}
  .band{min-height:64px;padding:10px 22px}
  .tops{grid-template-columns:repeat(6,minmax(0,1fr))}.tops .bar{padding:0 12px}.tops .bar .n,.tops .bar .v{font-size:17px}
  .alert{padding:14px 20px 16px;gap:10px}.num{padding:8px 16px}.num b{font-size:clamp(36px,5.5vh,56px)}
  .go{min-height:clamp(72px,10vh,92px)}
  .next{padding:10px 20px;grid-template-columns:auto repeat(3,minmax(0,1fr))}.next .task:nth-child(5){display:none}
}
@media(orientation:portrait){
  body{gap:12px}
  .band{padding:10px 20px;min-height:0}
  .hoppers{min-height:30vh;overflow:hidden}
  .hoppers{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .machines{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .mach{grid-template-columns:1fr auto;grid-template-rows:auto auto;padding:8px 12px 10px;min-height:0;gap:6px 10px}
  .mach .st{grid-column:1/-1;align-self:auto;padding:6px 10px;font-size:15px}
  .mach .nm{font-size:19px}.mach .nm small{display:none}
  .mach .k b{font-size:30px}.mach .k span{font-size:14px}
  .alert{padding:12px 16px 14px;gap:10px}.ahead{font-size:clamp(26px,3.4vh,36px)}.num{padding:8px 14px;flex-direction:row;align-items:baseline;gap:8px}.num b{font-size:clamp(32px,4vh,44px)}.num span{white-space:nowrap;font-size:15px}
  .nums{grid-template-columns:repeat(3,minmax(0,1fr))}
  .go{min-height:clamp(72px,8.5vh,88px)}.go .t{font-size:clamp(26px,3.8vh,36px)}
  .alert .more button{min-height:50px;font-size:16px}
  .next{padding:8px 16px}.task b{font-size:26px}
  .big .bar .m b{font-size:clamp(48px,6.5vh,72px)}
  .next{padding:10px 18px}
}

/* CALM: dark green = running / fine. Dark red = issue. The bright alert red is only for what needs attention NOW. */
.bar i{background:#0f5a3a}
.bar.low i{background:#b87a00}
.bar.now i{background:var(--now)}
.bar.now{outline:none;animation:none}
.stat i{color:#5bd39a}
.mach{background:#0f5a3a;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
.mach.held{background:#8a2410}.mach.clean{background:#7a5200}
.mach .st{display:none}
.mach .nm{font-size:clamp(20px,2.8vh,26px)}
.mach .nm small{color:rgba(255,255,255,.85)}.mach .nm small b{color:#fff;font-size:1.15em}
.mach .k span{color:rgba(255,255,255,.85)}
@media(orientation:landscape){.mach{grid-template-columns:minmax(0,1fr) auto;padding:10px 16px}.mach .nm small{display:block;font-size:17px}}
@media(orientation:portrait){.mach{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto;padding:8px 10px;gap:4px 8px}.mach .nm{font-size:17px}.mach .nm small{display:block;font-size:14px;white-space:nowrap}.mach .nm small b{font-size:1.05em}.mach .k b{font-size:26px}.mach .k span{font-size:12px}}

/* CALMER: top three at half height; alert box is quiet, one action */
.hoppers{grid-template-rows:auto minmax(0,1fr)}
.big{min-height:0}.big .bar{min-height:clamp(64px,9vh,88px);max-height:96px;padding:0 20px}
.big .bar .n{font-size:clamp(18px,2.4vh,24px)}
.big .bar .m b{font-size:clamp(34px,5vh,48px)}
.big .bar .m span{font-size:16px;margin-top:4px}
.tops .bar{min-height:34px}
.alert{border:1px solid var(--line);background:#141d18;gap:12px}
.ahead{font-size:clamp(24px,3.2vh,34px);letter-spacing:-.02em}
.ahead em{color:#fff}
.ahead i{width:14px;height:14px;box-shadow:0 0 0 5px rgba(229,64,26,.22)}
.ahead small{color:var(--dim)}
.nums{display:flex;gap:0;background:var(--bg);border-radius:14px;padding:10px 18px;align-items:baseline;flex-wrap:wrap}
.num{background:none;padding:0;border-radius:0;gap:8px;flex:1 1 auto;justify-content:flex-start}
.num b{font-size:clamp(28px,3.8vh,40px)}
.num span{font-size:16px;text-transform:none;letter-spacing:0;color:var(--dim)}
.go{box-shadow:0 5px 0 #8caf20;min-height:clamp(72px,9.5vh,92px)}
.go .t{font-size:clamp(24px,3.6vh,36px)}.go .s{font-size:17px;color:#2d3d10}
.alert .more{gap:0;display:flex;justify-content:space-between}
.alert .more button{background:none;border:0;min-height:44px;font-size:17px;color:var(--dim);text-transform:none;letter-spacing:0;font-weight:800;padding:6px 8px;text-align:center}
.alert .more button:active{color:#fff}
@media(orientation:portrait){
  .hoppers{min-height:0;grid-template-rows:auto minmax(0,1fr)}
  .big .bar{flex-direction:row;align-items:center;justify-content:space-between;padding:0 16px;min-height:clamp(64px,7vh,80px)}
  .big .bar .m{text-align:right}.big .bar .m b{font-size:clamp(34px,4.6vh,44px)}.big .bar .m span{white-space:nowrap;margin-top:2px}
  .tops .bar{min-height:40px}
  .nums{padding:8px 14px}.num{flex-direction:row;align-items:baseline}.num b{font-size:clamp(26px,3.4vh,36px)}.num span{white-space:nowrap}
  .alert .more{flex-wrap:wrap}.alert .more button{flex:1 1 30%}
}

/* toppings: name on top, number under it */
.tops .bar{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:6px 14px;min-height:56px}
.tops .bar .n{font-size:clamp(19px,2.6vh,24px);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tops .bar .v{font-size:clamp(18px,2.4vh,22px);color:rgba(255,255,255,.9)}
/* refill moment: a worker just filled it */
.bar.just{outline:4px solid var(--lime);outline-offset:-4px}
.bar.just .v,.bar.just .m span{color:var(--lime)}
.bar{cursor:pointer}
@media(orientation:portrait){.tops .bar{min-height:52px;padding:4px 12px}.tops .bar .n{font-size:19px}.tops .bar .v{font-size:18px}}
@media(orientation:landscape){.tops .bar{min-height:54px}}

/* ALERT: info left, one big button right */
.alert{display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,30%,380px);gap:16px;align-items:stretch;padding:14px 16px 14px 20px}
.aleft{display:grid;gap:10px;align-content:center;min-width:0}
.ahead{font-size:clamp(22px,3vh,30px)}
.ahead small{font-size:16px}
.nums{background:none;padding:0;gap:22px;justify-content:flex-start}
.num{flex:0 0 auto}
.num b{font-size:clamp(26px,3.4vh,34px)}
.num span{font-size:16px}
.alert .more{display:flex;gap:4px;justify-content:flex-start;flex-wrap:wrap;margin:0}
.alert .more button{padding:4px 12px 4px 0;min-height:32px;font-size:16px;text-align:left}
.alert .more button:not(:last-child){border-right:2px solid var(--line);padding-right:14px;border-radius:0}
.go{min-height:0;height:100%;display:grid;grid-template-rows:auto auto;align-content:center;justify-items:center;text-align:center;padding:14px 18px;gap:6px;position:relative}
.go .t{font-size:clamp(26px,3.6vh,36px);line-height:.95}
.go .s{font-size:16px;color:#2d3d10;margin:0}
.go .a{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:clamp(30px,4vh,40px)}
@media(orientation:portrait){
  .alert{grid-template-columns:minmax(0,1fr);gap:12px;padding:14px 16px}
  .go{height:auto;min-height:clamp(84px,9vh,100px);grid-template-columns:minmax(0,1fr);justify-items:start;text-align:left;padding:12px 60px 12px 18px}
  .go .t br{display:none}
  .nums{gap:16px}.num b{font-size:clamp(24px,3vh,30px)}.num span{white-space:nowrap}
}

/* alert: words | numbers | button */
.alert{grid-template-columns:minmax(0,1.2fr) max-content clamp(260px,30%,380px);gap:0 28px}
.nums{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:12px;row-gap:4px;align-content:center;align-items:baseline;justify-self:start;padding:0 0 0 28px;border-left:2px solid var(--line);align-self:stretch}
.num{display:contents}
.num b{font-size:clamp(26px,3.4vh,34px);text-align:right;font-variant-numeric:tabular-nums}
.num span{font-size:16px;white-space:nowrap}
@media(orientation:portrait){
  .alert{grid-template-columns:minmax(0,1fr);gap:12px}
  .nums{display:flex;gap:16px;padding:0;border-left:0;justify-self:stretch}
  .num{display:flex;align-items:baseline;gap:8px}
}

/* alert: give the words the width */
.alert{grid-template-columns:minmax(0,1fr) max-content clamp(240px,26%,320px);gap:0 22px;padding:12px 14px 12px 20px}
.ahead{font-size:clamp(22px,2.8vh,26px)}
.ahead small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aleft{gap:8px}
.alert .more{flex-wrap:nowrap}
.alert .more button{white-space:nowrap}
.nums{padding:0 0 0 22px;column-gap:10px}
.go{padding:12px 44px 12px 14px}
.go .a{right:12px}
@media(orientation:portrait){
  .aleft{display:contents}
  .ahead{order:1}.nums{order:2}.alert .more{order:3}.go{order:4}
  .alert .more{flex-wrap:wrap}
}

/* final alert sizing; portrait declared last so it wins */
.alert{grid-template-columns:minmax(0,1fr) max-content clamp(220px,24%,300px)}
.ahead{font-size:clamp(21px,2.6vh,24px)}
@media(orientation:portrait){

.go{background:var(--hot);color:#111;box-shadow:0 3px 0 #8fb000}.go .s{color:rgba(0,0,0,.72)}

/* the alert's status dot is blue, so it does not compete with the lime edge and button */

.alert.task .ahead i{background:#0a84ff;box-shadow:0 0 0 5px rgba(10,132,255,.25)}

/* LOW / NOW boxes: dark background, bright yellow numbers, like the Actions card */
.bar.low,.bar.now{background:#1c1c1e;color:#fff;box-shadow:none}
.bar.low .n,.bar.now .n{color:#fff}
.bar.low .m b,.bar.low .v,.bar.now .m b,.bar.now .v{color:var(--hot)}
.bar.low .m span,.bar.now .m span,.bar.low .v small,.bar.now .v small{color:#e6e6e6}
.bar.low i,.bar.now i{background:var(--hot)}

/* the alert's status dot is hot orange */
.ahead i,.alert.task .ahead i{background:#ff7a1a;box-shadow:0 0 0 6px rgba(255,122,26,.28)}

/* big boxes: more breathing room between the photo and the title */
.big .bar{padding-left:calc(var(--phw) + 26px)}

/* secondary actions are real glove buttons: tall, outlined, one tap opens the hold-to-confirm sheet */

.alert .more button{flex:1 1 0;min-height:56px;padding:0 16px;border:2px solid rgba(255,255,255,.45);border-radius:14px;background:rgba(255,255,255,.06);color:#fff;font-size:18px;font-weight:800;text-align:center;white-space:nowrap;text-transform:none;letter-spacing:0}
.alert .more button:not(:last-child){border-right:2px solid rgba(255,255,255,.45);padding-right:16px;border-radius:14px}
.alert .more button:active{background:rgba(255,255,255,.18)}
@media(orientation:portrait){.alert .more{flex-wrap:wrap}.alert .more button{flex:1 1 45%;min-height:60px;font-size:19px}}

/* machine status line sits right under the title bar */
.band{order:0}.sys{order:1}.hoppers{order:2}.actions{order:3}

/* TOP LOCKUP: title bar and machine line are one status block */
.top{order:0;display:grid;gap:0;border-radius:18px;overflow:hidden;background:var(--panel);min-height:0}
.top .band{border-radius:0;box-shadow:none}
.top .sys{border-radius:0;margin:0;box-shadow:none;border-top:2px solid var(--line)}

@media(orientation:landscape){.top .si{padding:0 8px;gap:5px;font-size:15px}.top .sys{padding:0 2px}}

@media(orientation:landscape){.top .sys{flex-wrap:wrap;row-gap:0;padding:2px;min-height:0}.top .si{min-height:42px}}

/* FINESSE PASS: craft details only, no layout changes */
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
/* numbers that tick must not jitter */
#clock,#speedv,#expv,.big .bar .m b,.tops .bar .v,.num b,.next .t,.si span{font-variant-numeric:tabular-nums}
/* uppercase names breathe; no negative tracking on caps */
.big .bar .n,.tops .bar .n{letter-spacing:.01em}
/* one hierarchy for labels: section labels lead, group labels follow */
.sec{font-size:16px;letter-spacing:2.2px;color:var(--ink)}
.sec::after{opacity:.6}
.glabel{font-size:14px;letter-spacing:1.6px;font-weight:700;opacity:.85}
/* the refill time is the second thought in a small bar */
.tops .bar .v small{opacity:.78;font-weight:600}
.big .bar .m span{opacity:.9}
/* the clock never truncates in the title bar */
.band .when{overflow:visible;text-overflow:clip;flex:0 0 auto}
@media(orientation:landscape){.band .when{font-size:17px}}
/* photo edge: a hairline between picture and panel; photos are never smeared */
.ph{background-repeat:no-repeat;box-shadow:inset -1px 0 0 rgba(0,0,0,.12)}
/* state changes ease instead of snapping */
.bar{transition:background-color .35s ease,box-shadow .35s ease,color .35s ease}
.bar i{transition:width .6s cubic-bezier(.2,.7,.2,1),background-color .35s ease}
/* touch feedback on every tappable surface */
.bar,.go,.alert .more button,.si{transition-property:transform,background-color,box-shadow,color;transition-duration:.12s,.35s,.35s,.35s}
.bar:active{transform:scale(.985)}
.go:active{transform:translateY(2px)}
.go{transition:transform .08s ease,box-shadow .08s ease}
/* even rhythm: same gap inside groups as between the two hopper rows */
.big{gap:12px}.tops{gap:10px}
html[data-photo="0"] .big .bar .m span br{display:none}

/* light: the dark machine strip needs no line above it; hairlines stay hairlines */
.top .sys{border-top:0}
.bar{box-shadow:0 1px 2px rgba(0,0,0,.05),0 0 0 1px rgba(0,0,0,.05)}
.bar.low,.bar.now{box-shadow:none}.bar.now{box-shadow:inset 0 0 0 3px var(--hot)}
.top{box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.04)}
.ph{box-shadow:inset -1px 0 0 rgba(0,0,0,.08)}

/* landscape: the clock stands alone (day lives in the peak note); machine line tightens on smaller iPads */
@media(orientation:landscape){.band .when .day{display:none}.band .when{min-width:0}}
@media(orientation:landscape) and (max-width:1200px){.top .si{font-size:14px;padding:0 7px;gap:5px}}

/* title never runs into the clock: it shrinks first */
@media(orientation:landscape){.band .where{flex:0 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.band .when{flex:0 0 auto;margin-left:auto}.band .stat{flex:0 0 auto}}

@media(orientation:landscape){.band{grid-template-columns:minmax(0,1fr) max-content max-content max-content}}

/* Actions locks to the bottom edge; spare height opens between Status and Actions */
body{grid-template-rows:auto auto minmax(0,1fr);align-content:stretch}
.actions{align-self:end}

/* a little more air above the Status label */
.hoppers{margin-top:10px}
@media(orientation:portrait){.hoppers{margin-top:8px}}

/* short landscape screens (9.7-inch iPad): boxes give back a little height so Status never meets Actions */
@media(orientation:landscape) and (max-height:800px){
  .big .bar{height:13vh}
  .tops .bar{height:9vh}
  .hoppers{margin-top:4px}

}

/* ALERT NUMBERS: the minutes-until-late is the hero, centered on top; the other two sit below it */
.nums{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:auto;justify-items:center;align-content:center;column-gap:22px;row-gap:4px;text-align:center;justify-self:stretch;padding:0 18px}
.num{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.num b{text-align:center;line-height:1}
.num span{white-space:nowrap}

.num:nth-child(2) span{font-size:17px}
.num:not(:nth-child(2)) b{font-size:clamp(24px,3.2vh,30px)}
.num:not(:nth-child(2)) span{font-size:15px}

@media(orientation:portrait){

@media(orientation:portrait){.hoppers{padding:12px 14px 14px;margin-top:8px}}

body{padding-bottom:20px}
@media(orientation:portrait){body{padding-bottom:12px}}

.bar.held{background:#ededf0;box-shadow:0 0 0 1px rgba(0,0,0,.05)}

body{background:#ececf1}

/* boxes pure white; the status card a slight gray-green */
body{background:#f2f2f7}
.hoppers{background:#eef2ee;box-shadow:0 0 0 1px rgba(20,60,30,.08)}
.hoppers .sec{color:#1d2b21}.hoppers .sec::after{background:#d6dfd8}
.glabel{color:#5b6b60}

   one left-justified row per size tier down to small squeeze/garnish, then Open. Width AND
   height scale by tier. Same shape in landscape and portrait; never a different diagram per screen. */
.slots{display:grid;gap:14px;min-height:0}

/* Full-width header bar, same row it labels — the tier name, its live used/total count and

.rheader{display:flex;align-items:baseline;gap:10px;padding:0 2px}

/* Every card in a row is flex:1 — the row always fills the full width, edge to edge, same as
   every other row. Size hierarchy still reads clearly (fewer Large cards share that same width,
   so each is wider; height is set per tier below too) without ever leaving a ragged trailing gap. */
.rcards{flex:1;display:flex;gap:16px;min-width:0;min-height:0}
/* APPLE CARD: title centered on top, the live quantity centered right below it, then a real
   progress track sitting flush against the photo — touching it, no gap — and the full-bleed photo
   itself. Nothing overlaid on the image; every fact gets its own centered band. Corner radius
   18px (inherited from the base .bar rule), same anatomy in every card, every tier. */
/* Every card is the same height, in every row — only width varies (from the row's own bay
   count, above). A 4-bay row and an 8-bay row still read as one consistent grid this way. */
.slots .bar{flex:1 1 0;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:0;padding:0;min-width:0;min-height:0;height:9.5vh}
/* Name padding is symmetric — the bin badge lives outside this box entirely (a sibling,
   positioned against the whole card, not the name) so it never pulls the title off-center. */
.slots .bar .n{flex:0 0 auto;text-align:center;font-size:14px;font-weight:800;letter-spacing:-.01em;line-height:1.2;padding:19px 8px 1px;white-space:normal;overflow-wrap:break-word}
.slots .bar .head{position:absolute;top:6px;right:6px;z-index:2;display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.2px;opacity:.6}
.slots .bar .head .temp{color:var(--tc,#8e8e93)}
.slots .bar.hot .head .temp{--tc:#c67600}
.slots .bar.cold .head .temp{--tc:#0a6cd4}
.slots .bar .v{flex:0 0 auto;text-align:center;font-size:12px;font-weight:800;padding:0 6px 5px;color:var(--dim)}
.slots .bar .v small{opacity:.8;font-weight:700}
.slots .bar .track{flex:0 0 4px;position:relative;background:rgba(0,0,0,.08)}
.slots .bar .track>i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--l,0)*1%);background:var(--ok)}
.slots .bar .photo{position:relative;flex:1 1 auto;min-height:0;background:#dfe3e8;overflow:hidden}
.slots .bar .ph{width:100%;height:100%;object-fit:cover;display:block}
.slots .bar .rc-tag{top:5px;left:5px;font-size:10px;padding:2px 5px}
.slots .bar.open{background:#fff;box-shadow:inset 0 0 0 2px var(--line);opacity:.6;align-items:stretch}
.slots .bar.open .n{flex:1;display:flex;align-items:center;justify-content:center;padding:6px;color:var(--dim);font-weight:800}
.slots .bar.open .head{opacity:.4}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--dim);font-weight:600;padding:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

<script>
/* hoppers: level % and burn %/min at this pace. Forecast walks the Thursday lunch curve (peak 12:30-12:50) to the 15% refill mark. */
/* Simulated clock: 1 real second = 6 seconds on the line, so a minute passes every 10 seconds and the numbers visibly click down. */
let NOW=12*60+18, SEC=0;
const PEAK=[12*60+30,12*60+50];
// sz: dispenser hardware size — L large hopper (auger/steam-table), M medium bin (scoop), S small squeeze/garnish
// t: the bin's live dispensing temperature. Hot-held range 140–165°F, cold-held 34–41°F; outside it the bin alerts.
// crit / low: the percent at which THIS item goes critical (hot lime) or low (amber). Differs per item: fast burners alert earlier than slow garnish.
const H=[{n:'Chicken',g:'prot',sz:'L',l:64,b:2.1,t:152,crit:30,low:50,src:'reach-in 1'},{n:'Beef',g:'prot',sz:'L',l:17,b:2.8,t:148,crit:30,low:50,src:'walk-in'},{n:'Rice',g:'base',sz:'L',l:41,b:2.9,t:161,crit:25,low:45,src:'cooker 2'},{n:'Quinoa',g:'base',sz:'L',l:0,b:1.2,t:131,crit:25,low:40,held:1,src:'dry store'}];
const C=[{n:'Beans',g:'veg',sz:'M',l:70,b:1.5,t:37,crit:20,low:35},{n:'Corn',g:'veg',sz:'M',l:35,b:1.6,t:38,crit:20,low:40},{n:'Pico',g:'veg',sz:'M',l:22,b:1.9,t:36,crit:25,low:40},{n:'Lettuce',g:'veg',sz:'M',l:48,b:1.3,t:35,crit:20,low:35},{n:'Cilantro',g:'veg',sz:'M',l:52,b:.8,t:37,crit:15,low:30},{n:'Lime',g:'veg',sz:'S',l:90,b:.5,t:39,crit:10,low:20},{n:'Guac',g:'sau',sz:'S',l:15,b:1.7,t:36,crit:25,low:40},{n:'Verde',g:'sau',sz:'S',l:73,b:.9,t:38,crit:15,low:30},{n:'Chipotle',g:'sau',sz:'S',l:30,b:1.1,t:40,crit:15,low:35},{n:'Roja',g:'sau',sz:'S',l:66,b:1,t:37,crit:15,low:30},{n:'Cheese',g:'dai',sz:'M',l:80,b:1.4,t:36,crit:20,low:35},{n:'Sour Cream',g:'dai',sz:'S',l:58,b:1.2,t:38,crit:20,low:35}];
const ALL=[...H,...C];
const pace=t=> t<PEAK[0]?1.0 : t<PEAK[1]?1.35 : t<13*60+10?1.0 : 0.6;
const clock=t=>{const h=Math.floor(t/60),m=t%60;return (h>12?h-12:h)+':'+String(m).padStart(2,'0');};
function refillMin(x){ let lvl=x.l, t=NOW; while(lvl>15 && t<NOW+240){ lvl-=x.b*pace(t); t++; } return t-NOW; }
function refillClock(x){ if(x.held) return null; const m=refillMin(x); return m>=240?'AFTER 4 PM':clock(NOW+m); }
// WEIGHT, not volume — a load cell under the bin, not a level sensor. x.l stays 0-100 internally
// (the sim math and the fill-bar width are unaffected) but everything shown to a human is the
// actual weight: FULL is the tier's full weight in lb, and below ~25% of it the last bit can't be
// cleanly auger'd/pumped out anymore — a worker has to squeegee/scrape it, and what's left after
// that gets thrown away. That physical floor is what drives "now," not a minutes-left guess.
const FULL={L:20,M:8,S:2};
const lbs=x=>+(x.l/100*FULL[x.sz]).toFixed(1);
const mn=x=>Math.max(0,Math.round(x.l/x.b)), st=x=>x.held?'held':x.l<(x.crit??25)?'now':x.l<(x.low??40)?'low':'ok';
function nextUp(){const all=ALL.filter(x=>!x.held).map(x=>({x,t:refillClock(x),z:st(x),m:refillMin(x)})).sort((a,b)=>a.m-b.m).slice(0,4);document.getElementById('next').innerHTML='<div class="lbl">Next up</div>'+all.map(a=>`<div class="task ${a.z}"><b>${a.t}</b><span>${a.x.n}${a.x.src?' · '+a.x.src:''}</span></div>`).join('');}
const M=[{n:'Bowl 01',s:'run',st:'Running',k:'14',l:'in queue',hr:134,sec:27},{n:'Bowl 02',s:'held',st:'Held',k:'7',l:'rerouting',hr:0,sec:0,sub:'HELD · quinoa'},{n:'Chicken 2',s:'run',st:'Running',k:'12',l:'slots open',hr:150,sec:24}];
function machines(){
  const st=m=>m.s==='run'?'':m.s==='held'?'bad':m.s==='clean'?'warn':'off';
  const word=m=>m.s==='run'?(m.k+(m.l==='in queue'?' queued':m.l==='slots open'?' open':' '+m.l)):m.s==='held'?((m.sub||'HELD').startsWith('DOOR')?'door open':'held'):m.s==='clean'?(m.k+' min clean'):'off';
  const q=ALL.find(x=>x.n==='Quinoa'); const disp=q&&q.held?['warn','17/18']:['',''];
  const items=M.map(m=>[st(m),m.n,word(m)]).concat([['','Conveyor',''],[disp[0],'Dispensers',disp[1]],['','Sealer',''],['','Pickup',''],['','Payments',''],['','Network','']]);
  document.getElementById('machines').innerHTML='<span class="lbl">System</span>'+items.map(a=>`<span class="si ${a[0]}"><i></i><b>${a[1]}</b>${a[2]?`<span>${a[2]}</span>`:''}</span>`).join('');
}
machines();

/* ---------- RECIPE: the job the line is running. One customer, N bowls, a due time, a fixed set of hoppers. ---------- */
const RECIPE={id:'SF-0912',who:'Salesforce',where:'Salesforce Tower · 45F',when:'Wed 09-12-26 · 12:30 meeting',due:12*60+30,n:50,done:31,acc:0,
  items:['Chicken','Rice','Beans','Corn','Guac','Pico','Cheese','Lime'],veg:{n:12,base:'Quinoa'},
  next:[{who:'À la carte',n:9,note:'walk-in queue'},{who:'Stripe',n:24,note:'due 1:15'}]};
const inRecipe=x=>RECIPE.items.includes(x.n)||x.n===RECIPE.veg.base;
function recipeRow(){
  const el=document.getElementById('recipe'); if(!el) return;
  const rank={now:0,held:1,low:2,ok:3}; const all=RECIPE.items.concat([RECIPE.veg.base]).map(n=>{const x=ALL.find(y=>y.n===n);return {n,s:x?st(x):'ok'};}).sort((a,b)=>rank[a.s]-rank[b.s]);
  const chips=all.slice(0,4).map(({n,s})=>`<span class="rc-chip ${s}"><i></i>${n}${n===RECIPE.veg.base?' <small>×'+RECIPE.veg.n+' veg</small>':''}</span>`).join('')+(all.length>4?`<span class="rc-chip more">+${all.length-4}</span>`:'');
  const left=RECIPE.n-RECIPE.done, mins=Math.max(0,RECIPE.due-NOW), pct=Math.round(RECIPE.done/RECIPE.n*100);
  const nx=RECIPE.next[0];
  el.innerHTML=`<span class="rc-lbl">Recipe</span>
    <span class="rc-who"><b>${RECIPE.who}</b><span class="rc-id">${RECIPE.id}</span></span>
    <span class="rc-meta"><b>${RECIPE.n} bowls</b> · ${RECIPE.where} · ${RECIPE.when}</span>
    <span class="rc-prog"><i style="--p:${pct}%"></i><b>${RECIPE.done}</b><span>/ ${RECIPE.n}</span><em>${left} left · ${mins} min</em></span>
    <span class="rc-items">${chips}</span>
    <span class="rc-next">Next <b>${nx.who}</b> ×${nx.n}<small> · ${nx.note}</small></span>`;
}
function render(){
  nextUp(); recipeRow();
  // PHOTOS: Wikimedia Commons, hotlinked via Special:FilePath (browser loads them). ?photo=25|50|0
  const IMG={"chicken": "Grilled_Chicken_Breasts_(28905381261).jpg", "beef": "Shredded_Steak_with_Peppers,_Onions_and_Tomatoes_(Ropa_Vieja).jpg", "rice": "Bowl_of_white_rice_02.jpg", "quinoa": "Quinoa_cuit.JPG", "beans": "Black_bean,_frijol_negro,_feijão_preto_1.jpg", "corn": "Up_close_image_of_corn.jpg", "pico": "Mmm..._Pico_de_Gallo_(5923456035).jpg", "lettuce": "Romaine_lettuce.jpg", "cilantro": "Coriander_01.jpg", "lime": "Lime_-_whole_and_halved.jpg", "guac": ["Guacamole_IMGP1303.jpg", "Guacamole.jpg", "Guacamole_bowl.jpg"], "verde": "SALSA_VERDE.jpg", "chipotle": "Chipotlesenadobo.jpg", "roja": "Bowl_of_salsa.jpg", "sour cream": "Sour_Cream.jpg", "cheese": "Fine_Microplane_Grating_Hard_Cheese.jpg"};
  // an entry can be a list of Commons file names: the browser walks it until one loads
  const cands=x=>[].concat(IMG[x.n.toLowerCase()]||[]).map(f=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(f)+'?width=400');
  const img=x=>cands(x)[0]||'';
  const key=x=>x.n.toLowerCase().replace(/\s+/g,'-');
  // PHOTO STASH: img/<key>.jpg in this folder wins; if it is missing the browser falls back to the Commons photo
  window.SRC=window.SRC||{}; window.CANDS=window.CANDS||{};
  window.phFail=function(el,k){const list=CANDS[k]||[]; const i=list.indexOf(el.getAttribute('src'))+1; const next=list[i]; if(!next){el.onerror=null;return;} SRC[k]=next; el.src=next;};
  const ph=x=>{const k=key(x); CANDS[k]=cands(x); const src=SRC[k]||`img/${k}.jpg`; return `<img class="ph" alt="" decoding="sync" src="${src}" ${SRC[k]&&SRC[k]===CANDS[k][CANDS[k].length-1]?'':`onerror="phFail(this,'${k}')"`}>`;};
  {const p=new URLSearchParams(location.search).get('photo'); const w=p===null?25:(parseInt(p,10)||0); document.documentElement.style.setProperty('--phw',w+'%'); document.documentElement.dataset.photo=w; const lk=new URLSearchParams(location.search).get('look'); if(lk) document.documentElement.dataset.look=lk;}
  // SLOT MAP: same #1-18 numbering as recipe-development.html's machine rack, sized by real
  // dispenser hardware (PANEL-DESIGN.md "Machine layout"). Row 1 is the 4 mains; then one
  // left-justified row per size tier; then Open.
  const temp=x=>(x.g==='prot'||x.g==='base')?'hot':'cold';
  const RANGE={hot:[140,165],cold:[34,41]}; // hot-hold floor / cold-hold ceiling — real numbers, not placeholders
  const tempOK=x=>{const r=RANGE[temp(x)];return x.t>=r[0]&&x.t<=r[1];};
  ALL.forEach((x,i)=>{x._slot=i+1});
  // APPLE CARD: name band on top (the one glanceable fact), full-bleed photo below, captioned.
  const slotBar=x=>{
    const bin=`<span class="bin">#${x._slot}</span>`;
    if(x.open) return `<div class="bar slot sz-${x.sz} open">${bin}<div class="n">+ Add</div></div>`;
    const tOK=tempOK(x);
    const badge=`<span class="head"><span class="temp">${x.t}°F${tOK?'':'<small>ALERT</small>'}</span></span>`;
    const z=st(x);
    return `<div class="bar slot sz-${x.sz} ${temp(x)} ${z} ${tOK?'':'talert'} ${x.just?'just':''}" ${x.held?'':`onclick="openSheet('refill:${x.n}')"`}>
      ${bin}
      <div class="n">${x.n}</div>
      <div class="meter"><i style="--l:${x.held?0:x.l}"></i>${x.held?'<b class="pct">HELD</b><small class="note">not dispensing</small>':`<b class="pct">${Math.round(x.l)}%</b>${x.just?'<small class="note">REFILLED</small>':z==='now'?'<small class="note">SCRAPE IT</small>':''}`}</div>
      <div class="photo">${ph(x)}${badge}${inRecipe(x)?'<em class="rc-tag">SF</em>':''}</div>
    </div>`;
  };
  // DISPLAY: reordered by size tier (L, then M, then S — the 2 open bays live inside the S row,
  // not a separate row: they're Sauce Dispenser bays, physically). Array order no longer matches
  // ALL's category order, so build the render sequence once and reuse it for the fast-path --l
  // update below, or the two would drift out of sync.
  const OPEN=[{open:1,sz:'S',_slot:17},{open:1,sz:'S',_slot:18}];
  const DISPLAY=[...ALL.filter(x=>x.sz==='L'),...ALL.filter(x=>x.sz==='M'),...ALL.filter(x=>x.sz==='S'),...OPEN];
  // capacity is per dispenser (one hopper/bin/bottle), not per row. Counts are fixed hardware —
  // Hot Grain Hopper and Loose-Scoop Bin are always full; only Sauce Dispenser has open bays.
  const ROWS=[['L','Hot Grain Hopper','≈ 2.5 gal'],['M','Loose-Scoop Bin','≈ 175 in³'],['S','Sauce Dispenser','≈ 32 oz']];
  window.LAST=window.LAST||{};
  const html=ROWS.map(([tier,label,cap])=>{
    const row=tier==='S'?[...DISPLAY.filter(x=>x.sz==='S'&&!x.open),...OPEN]:DISPLAY.filter(x=>x.sz===tier);
    const used=row.filter(x=>!x.open).length, full=used===row.length;
    return `<div class="srow"><div class="rheader"><b>${label}</b><span class="${full?'full':''}">${used}/${row.length}${full?' · full':''}</span><span>Holds ${cap}</span></div><div class="rcards">${row.map(slotBar).join('')}</div></div>`;
  }).join('');
  const slotsKey=html.replace(/--l:[0-9.]+/g,'--l:0');
  const el=document.getElementById('g-all');
  if(LAST['g-all']!==slotsKey){el.innerHTML=html; LAST['g-all']=slotsKey;} else {const bars=el.querySelectorAll('.bar i'); DISPLAY.forEach((x,i)=>{if(bars[i]&&!x.open) bars[i].style.setProperty('--l',x.held?0:x.l);});}
  document.getElementById('clock').textContent=clock(NOW);
}
render();
function refill(x,who){ x.l=100; x.just=who; render(); setTimeout(()=>{x.just=null;render();},6000); toastTitle.textContent=`${x.n} refilled by ${who} · ${clock(NOW)}`; toastText.textContent='Marked full at the hopper. Next up is updated.'; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),3500); }
/* the worker on hoppers refills whatever hits the mark, about a minute after it does */
const CREW=['Maya','Maya','Jordan'];
setInterval(()=>{
  SEC+=6; if(SEC>=60){SEC-=60; NOW+=1;}
  ALL.forEach(x=>{ if(!x.held && !x.just){ x.l=Math.max(0,+(x.l-x.b*pace(NOW)/10).toFixed(2)); if(x.l<=12 && !x.due){ x.due=NOW+1; } if(x.due && NOW>=x.due){ x.due=null; refill(x,CREW[Math.floor(Math.random()*CREW.length)]); } } });
  render(); popCheck(); if(cleanUntil&&NOW>=cleanUntil){cleanUntil=null;M[0].s='run';M[0].st='Running';M[0].k='9';M[0].l='in queue';M[0].hr=134;M[0].sub=null;machines();note('Bowl 01 back from cleaning');} if(SEC<6&&STEP==='clear') renderAlert(false);
  const sp=Math.round(38*pace(NOW))+Math.round(Math.sin(SEC/9)*2);document.getElementById('speedv').textContent=sp;document.getElementById('expv').textContent=Math.max(0,214-Math.floor((NOW-(12*60+18))*sp/10));
  if(RECIPE.done<RECIPE.n){RECIPE.acc+=sp/100; if(RECIPE.acc>=1){RECIPE.done+=1;RECIPE.acc-=1;}} recipeRow();
},1000);
/* ---------- SCENE: the shift, one step at a time ---------- */
const Q=()=>ALL.find(x=>x.n==='Quinoa');
const SCENE={
 reroute:{kind:'',head:'Quinoa under-dispensing',sub:'Bowl 02 · held 12:16 · rest running',nums:[['7','orders waiting'],['4 MIN','until late'],['12','slots open at Bowl 2']],btn:'TAP TO START REROUTE',bs:'7 orders → Chicken 2',verbs:[['tech','Send tech'],['engineering','Log + alert Eng.']],
   sheet:{label:'Reroute',title:'Move 7 orders to Chicken Bowl 2?',text:'Chicken Bowl 2 has 12 open slots. Every affected order lands in the same service window.',effects:[['Guests','All 7 orders stay on time'],['Bowl 02','Quinoa stays held. Other recipes keep running']],button:'START REROUTE'},

   done:()=>{ M[0].s='clean';M[0].st='Cleaning';M[0].k='6';M[0].l='min left';M[0].hr=0;M[0].sub='CLEANING · back '+clock(NOW+6);M[1].k='25';machines(); cleanUntil=NOW+6; note('Bowl 01 cleaning · queue moved to Bowl 02'); go('clear'); }},
 chicken:{kind:'',head:'Chicken runs out in 4 min',sub:'Reach-in 1 · 2 hotel pans ready',nums:()=>[[String(mn(H[0])),'min at this pace'],[lbs(H[0])+' lb','in the hopper'],['2','pans in reach-in']],btn:'TAP TO START CHICKEN REFILL',bs:'Hopper keeps dispensing during the swap',verbs:[['engineering','Log a note']],
   sheet:{label:'Refill',title:'Refill chicken now?',text:'Two pans in reach-in 1. Confirm at the hopper when the swap is done.',effects:[['Chicken','Back to 100%'],['Service','Keeps dispensing during the swap']],button:'REFILLED'},
   done:()=>{ refill(H[0],'you'); go('clear'); }},
};
let STEP='reroute', cleanUntil=null, fired={};
function go(k){ STEP=k; renderAlert(true); }
function note(t){ toastTitle.textContent=t; toastText.textContent=clock(NOW); toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),3500); }
function renderAlert(popIn){
  const st=SCENE[STEP]; const nums=typeof st.nums==='function'?st.nums():st.nums; const bs=typeof st.bs==='function'?st.bs():st.bs; const btn=typeof st.btn==='function'?st.btn():st.btn;
  const el=document.getElementById('alert'); el.className='alert '+st.kind+(popIn?' pop':'');
  el.innerHTML=`<div class="aleft"><div class="ahead"><i></i><span>${st.head}</span><small>${st.sub}</small></div><div class="more">${st.verbs.map(v=>`<button onclick="openSheet('${v[0]}')">${v[1]}</button>`).join('')}</div></div>
  <div class="nums">${nums.map(n=>`<div class="num"><b>${n[0]}</b><span>${n[1]}</span></div>`).join('')}</div>
  <button class="go" onclick="openSheet('scene')"><div class="t">${btn}</div><div class="s">${bs}</div><div class="a">→</div></button>`;
  if(window.gloveBind) gloveBind();
}
renderAlert(false);
/* ?autoplay: the shift runs itself, a step every 8 s. For a kiosk loop or a demo with no hands. */
if(location.search.includes('autoplay')) setInterval(()=>{ if(STEP!=='clear') SCENE[STEP].done(); },8000);
/* pops on the clock, only when the board is clear */
function popCheck(){
  if(STEP!=='clear') return;
  if(!fired.door && NOW>=12*60+22){ fired.door=1; M[2].s='held';M[2].st='Held';M[2].sub='DOOR OPEN';M[2].k='5';M[2].l='waiting';machines(); go('door'); return; }
  if(!fired.clean && NOW>=12*60+26){ fired.clean=1; go('clean'); return; }
  if(!fired.chicken && H[0].l<22){ fired.chicken=1; go('chicken'); return; }
}
/* sheets */
let selected='';const data={
 tech:{label:'Service task',title:'Send tech to Bowl 02?',text:'The task carries the machine state, recipe, and evidence automatically.',effects:[['Task','Recalibrate quinoa dispenser'],['Timing','Before the next lunch rush']],button:'SEND TECH',done:'Tech dispatched',sub:'The calibration task is ready with the right context.'},
 engineering:{label:'Fleet learning',title:'Log it and alert Engineering?',text:'This event joins the fleet pattern without slowing service.',effects:[['Pattern','14 similar incidents across 4 sites'],['Context','Today’s event is attached automatically']],button:'LOG + ALERT',done:'Logged. Engineering alerted',sub:'This incident is now part of the fleet reliability signal.'}};
function openSheet(k){selected=k;
  if(k.startsWith('refill:')){const x=ALL.find(a=>a.n===k.slice(7));sheetLabel.textContent='Refill';sheetTitle.textContent=`Mark ${x.n} refilled?`;sheetText.textContent=`${lbs(x)} lb now. Hold to confirm at the hopper. Next up updates on its own.`;effects.innerHTML='<div class="effect"><b>Hopper</b><span>'+x.n+' back to '+FULL[x.sz]+' lb</span></div><div class="effect"><b>Service</b><span>Dispensing keeps running during the swap</span></div>';document.getElementById('confirm').textContent='REFILLED';overlay.classList.add('show');return;}
  const x=k==='scene'?SCENE[STEP].sheet:data[k];sheetLabel.textContent=x.label;sheetTitle.textContent=x.title;sheetText.textContent=x.text;effects.innerHTML=x.effects.map(a=>'<div class="effect"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>').join('');document.getElementById('confirm').textContent=x.button;overlay.classList.add('show')}
function closeSheet(){overlay.classList.remove('show')}
function commit(){
  if(selected.startsWith('refill:')){closeSheet();refill(ALL.find(a=>a.n===selected.slice(7)),'you');return;}
  if(selected==='scene'){closeSheet();SCENE[STEP].done();return;}
  const x=data[selected];closeSheet();toastTitle.textContent=x.done;toastText.textContent=x.sub;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),4300)}
</script>
