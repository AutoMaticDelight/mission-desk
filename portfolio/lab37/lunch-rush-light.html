<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bowl Maker 5000 - Lunch Rush · Light</title>
<style>
/* USER PANEL. Not a web page. One iPad screen, portrait or landscape, no scroll.
   High contrast, readable from across the room, no training to operate: color is the state, the number is the detail, buttons are verbs. */
:root{--bg:#0b120e;--panel:#17231c;--track:#3d4a42;--line:#2c3a31;--ink:#ffffff;--dim:#c7d1ca;
  --ok:#1fa36a;--low:#f0a000;--now:#e5401a;--held:#6b7a70;--lime:#cfff3e;--orange:#ff7a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:800;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto auto;gap:16px;padding:20px;height:100vh;overflow:hidden;
  padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
b,strong{font-weight:950}

/* TOP BAND: where, when, speed, to go */
.band{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:20px;align-items:center;background:var(--panel);border-radius:18px;padding:14px 24px;min-height:72px;min-width:0;overflow:hidden}
.band>*{min-width:0}
.band .where{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em;white-space:nowrap}
.band .where span{color:var(--lime);margin-left:10px}
.band .when{font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .when span{margin-left:12px;color:var(--ink)}
.stat{display:flex;align-items:baseline;gap:8px;white-space:nowrap;border-left:2px solid var(--line);padding-left:20px}
.stat b{font-size:clamp(32px,3.4vw,44px);letter-spacing:-.06em;line-height:.9}
.stat span{font-size:17px;letter-spacing:.6px;color:var(--dim)}
.stat i{font-style:normal;color:var(--ok);font-size:clamp(18px,2.2vh,22px)}

/* HOPPERS: the bar is the message */
.hoppers{display:grid;grid-template-rows:minmax(0,1.15fr) minmax(0,1fr);gap:14px;min-height:0}
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;min-height:0}
.tops{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px;min-height:0}
.bar{position:relative;overflow:hidden;border-radius:18px;background:var(--track);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;min-height:0;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);transition:width .6s}
.bar.low i{background:var(--low)}.bar.now i{background:var(--now)}.bar.held{background:var(--held)}.bar.held i{display:none}
.bar.now{outline:4px solid var(--now);outline-offset:-4px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{outline-color:#ffb39e}}
.bar>*{position:relative;z-index:1}
.big .bar .n{font-size:clamp(22px,3.2vh,34px);letter-spacing:-.02em;text-transform:uppercase;flex:0 1 auto;min-width:0}
.big .bar .m{text-align:right;line-height:.85;flex:0 0 auto}
.big .bar .m b{display:block;font-size:clamp(52px,9vh,96px);letter-spacing:-.07em}
.big .bar .m span{display:block;font-size:clamp(17px,2.2vh,20px);letter-spacing:.4px;margin-top:8px;white-space:nowrap}
.tops .bar{padding:0 16px;border-radius:12px}
.tops .bar .n{font-size:clamp(18px,2.4vh,22px);text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tops .bar .v{font-size:clamp(18px,2.4vh,24px);letter-spacing:-.02em;flex:0 0 auto}

/* ALERT: what, numbers, one button */
.alert{background:var(--panel);border:2px solid rgba(255,122,26,.55);border-radius:18px;padding:18px 24px 20px;display:grid;gap:14px}
.ahead{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:14px;row-gap:4px;font-size:clamp(26px,3.8vh,42px);letter-spacing:-.03em;line-height:1.05}
.ahead small{grid-column:2;font-size:clamp(17px,2.2vh,20px);color:var(--dim);letter-spacing:.3px;font-weight:800}
.ahead i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--now);box-shadow:0 0 0 7px rgba(229,64,26,.28)}
.ahead em{font-style:normal;color:var(--orange)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.num{background:var(--bg);border-radius:14px;padding:12px 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.num b{font-size:clamp(40px,6.5vh,72px);letter-spacing:-.06em;line-height:.9}
.num span{font-size:17px;letter-spacing:.5px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.go{border:0;border-radius:18px;background:var(--lime);color:#0b120e;min-height:clamp(84px,12vh,120px);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;cursor:pointer;box-shadow:0 8px 0 #8caf20;font:inherit}
.go:active{transform:translateY(6px);box-shadow:0 2px 0 #8caf20}
.go .t{font-size:clamp(28px,4.4vh,44px);letter-spacing:-.04em;line-height:1;font-weight:950}
.go .s{font-size:clamp(18px,2.4vh,22px);margin-top:6px;font-weight:800}
.go .a{font-size:clamp(40px,6vh,64px);line-height:1}

/* MORE: three verbs */
.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.more button{border:2px solid var(--track);background:var(--panel);color:#fff;border-radius:14px;min-height:clamp(64px,9vh,84px);font:inherit;font-size:clamp(19px,2.6vh,24px);font-weight:900;letter-spacing:-.01em;cursor:pointer;padding:8px 14px;text-align:center}
.more button:active{background:var(--track)}

/* orientation */
@media(orientation:portrait){
  .band{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;row-gap:6px;min-height:0}
  .band .when{grid-column:1/-1;font-size:18px}
  .stat{border-left:0;padding-left:0}.stat:last-child{justify-content:flex-end}
  .hoppers{grid-template-rows:minmax(0,1fr) minmax(0,1.1fr)}
  .big .bar{flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:16px 20px}
  .big .bar .m{text-align:left}.big .bar .m b{font-size:clamp(56px,8vh,84px)}.big .bar .m span{white-space:normal;margin-top:4px}
  .tops{grid-template-columns:repeat(3,minmax(0,1fr))}
  .num{flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px}.num b{font-size:clamp(40px,5vh,60px)}.num span{white-space:normal}
  .band .where{font-size:24px}
}
@media(max-width:600px){body{height:auto;overflow:auto}.big{grid-template-columns:1fr}.big .bar{min-height:84px}.tops{grid-template-columns:1fr 1fr}.tops .bar{min-height:48px}.more{grid-template-columns:1fr}}

/* sheet base (glove.css turns it into the full-screen hold-to-confirm panel) */
.overlay{position:fixed;inset:0;background:rgba(6,12,8,.63);display:none;align-items:flex-end;justify-content:center;padding:20px;z-index:10}
.overlay.show{display:flex}
.sheet{background:#f8faf7;color:#18231c;width:min(800px,100%);border-radius:21px;padding:25px}
.handle{display:none}.sheet .eyebrow{font-size:16px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:#6b7b70}
.sheet h2{font-size:42px;line-height:.98;letter-spacing:-.06em;margin:8px 0 11px}.sheet p{margin:0;color:#617067;font-size:18px;line-height:1.4}
.effects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.effect{border:1px solid #d5ddd5;background:#fff;border-radius:11px;padding:13px}
.effect b{font-size:16px;display:block}.effect span{display:block;color:#68756c;font-size:16px;margin-top:3px}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end}.sheet button{border-radius:11px;padding:15px 18px;font-weight:900;font-size:16px}
.back{background:#fff;border:1px solid #cbd5cd;color:#324239}.confirm{background:var(--lime);border:0;color:#142217}
.toast{position:fixed;left:0;right:0;top:0;transform:none;z-index:20;background:#0f5a3a;color:#fff;padding:18px 24px;display:none;text-align:center;border-bottom:4px solid var(--lime)}
.toast.show{display:block}.toast b{display:block;font-size:24px}.toast span{font-size:18px;display:block;margin-top:4px}

/* NEXT UP: what is coming for the worker, from the same forecast. First one is live. */
.next{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:16px;align-items:center;background:var(--panel);border-radius:18px;padding:12px 24px;min-width:0}
.next .lbl{font-size:17px;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;white-space:nowrap;padding-right:8px;border-right:2px solid var(--line)}
.task{display:flex;align-items:baseline;gap:10px;min-width:0}
.task b{font-size:clamp(24px,3.2vh,32px);letter-spacing:-.04em;line-height:1;flex:0 0 auto}
.task span{font-size:clamp(17px,2.2vh,20px);text-transform:uppercase;letter-spacing:.3px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.now b{color:#ff8d6a}.task.now span{color:#fff}
.task.low b{color:var(--low)}
@media(orientation:landscape){.tops{grid-template-columns:repeat(4,minmax(0,1fr))}.band .when .peak{display:none}}
@media(orientation:portrait){.next{grid-template-columns:1fr 1fr;row-gap:10px}.next .lbl{grid-column:1/-1;border-right:0;padding:0}}

/* MACHINES AT A GLANCE: one tile per machine. Color is the state. One number each. */
.machines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mach{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--panel);border-radius:18px;padding:10px 18px 10px 12px;min-height:clamp(68px,9vh,84px);min-width:0}
.mach .st{align-self:stretch;display:grid;place-items:center;border-radius:12px;padding:0 14px;font-size:clamp(15px,2vh,18px);letter-spacing:.8px;text-transform:uppercase;background:var(--ok);color:#fff;white-space:nowrap}
.mach.held .st{background:var(--now)}.mach.clean .st{background:var(--low);color:#1a1200}
.mach .nm{font-size:clamp(19px,2.6vh,24px);letter-spacing:-.02em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mach .nm small{display:block;font-size:17px;color:var(--dim);letter-spacing:.3px;font-weight:800;text-transform:none}
@media(orientation:landscape){.mach .nm{font-size:20px}.mach{gap:10px;padding:10px 16px}.mach .k b{font-size:clamp(28px,4vh,40px)}}
.mach .k{text-align:right;white-space:nowrap}
.mach .k b{font-size:clamp(30px,4.2vh,44px);letter-spacing:-.06em;line-height:.9}
.mach .k span{display:block;font-size:16px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
/* verbs inside the alert: smaller, one row */
.alert .more{margin-top:2px}
.alert .more button{min-height:clamp(52px,7vh,64px);font-size:clamp(17px,2.3vh,20px);border-radius:12px;background:var(--bg)}
/* tighter vertical budget in landscape */
@media(orientation:landscape){
  body{gap:12px;padding:16px}
  .band{min-height:64px;padding:10px 22px}
  .tops{grid-template-columns:repeat(6,minmax(0,1fr))}.tops .bar{padding:0 12px}.tops .bar .n,.tops .bar .v{font-size:17px}
  .alert{padding:14px 20px 16px;gap:10px}.num{padding:8px 16px}.num b{font-size:clamp(36px,5.5vh,56px)}
  .go{min-height:clamp(72px,10vh,92px)}
  .next{padding:10px 20px;grid-template-columns:auto repeat(3,minmax(0,1fr))}.next .task:nth-child(5){display:none}
}
@media(orientation:portrait){
  body{gap:12px}
  .band{padding:10px 20px;min-height:0}
  .hoppers{min-height:30vh;overflow:hidden}
  .hoppers{grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .machines{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .mach{grid-template-columns:1fr auto;grid-template-rows:auto auto;padding:8px 12px 10px;min-height:0;gap:6px 10px}
  .mach .st{grid-column:1/-1;align-self:auto;padding:6px 10px;font-size:15px}
  .mach .nm{font-size:19px}.mach .nm small{display:none}
  .mach .k b{font-size:30px}.mach .k span{font-size:14px}
  .alert{padding:12px 16px 14px;gap:10px}.ahead{font-size:clamp(26px,3.4vh,36px)}.num{padding:8px 14px;flex-direction:row;align-items:baseline;gap:8px}.num b{font-size:clamp(32px,4vh,44px)}.num span{white-space:nowrap;font-size:15px}
  .nums{grid-template-columns:repeat(3,minmax(0,1fr))}
  .go{min-height:clamp(72px,8.5vh,88px)}.go .t{font-size:clamp(26px,3.8vh,36px)}
  .alert .more button{min-height:50px;font-size:16px}
  .next{padding:8px 16px}.task b{font-size:26px}
  .big .bar .m b{font-size:clamp(48px,6.5vh,72px)}
  .next{padding:10px 18px}
}

/* CALM: dark green = running / fine. Dark red = issue. The bright alert red is only for what needs attention NOW. */
.bar i{background:#0f5a3a}
.bar.low i{background:#b87a00}
.bar.now i{background:var(--now)}
.bar.now{outline:none;animation:none}
.stat i{color:#5bd39a}
.mach{background:#0f5a3a;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
.mach.held{background:#8a2410}.mach.clean{background:#7a5200}
.mach .st{display:none}
.mach .nm{font-size:clamp(20px,2.8vh,26px)}
.mach .nm small{color:rgba(255,255,255,.85)}.mach .nm small b{color:#fff;font-size:1.15em}
.mach .k span{color:rgba(255,255,255,.85)}
@media(orientation:landscape){.mach{grid-template-columns:minmax(0,1fr) auto;padding:10px 16px}.mach .nm small{display:block;font-size:17px}}
@media(orientation:portrait){.mach{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto;padding:8px 10px;gap:4px 8px}.mach .nm{font-size:17px}.mach .nm small{display:block;font-size:14px;white-space:nowrap}.mach .nm small b{font-size:1.05em}.mach .k b{font-size:26px}.mach .k span{font-size:12px}}

/* CALMER: top three at half height; alert box is quiet, one action */
.hoppers{grid-template-rows:auto minmax(0,1fr)}
.big{min-height:0}.big .bar{min-height:clamp(64px,9vh,88px);max-height:96px;padding:0 20px}
.big .bar .n{font-size:clamp(18px,2.4vh,24px)}
.big .bar .m b{font-size:clamp(34px,5vh,48px)}
.big .bar .m span{font-size:16px;margin-top:4px}
.tops .bar{min-height:34px}
.alert{border:1px solid var(--line);background:#141d18;gap:12px}
.ahead{font-size:clamp(24px,3.2vh,34px);letter-spacing:-.02em}
.ahead em{color:#fff}
.ahead i{width:14px;height:14px;box-shadow:0 0 0 5px rgba(229,64,26,.22)}
.ahead small{color:var(--dim)}
.nums{display:flex;gap:0;background:var(--bg);border-radius:14px;padding:10px 18px;align-items:baseline;flex-wrap:wrap}
.num{background:none;padding:0;border-radius:0;gap:8px;flex:1 1 auto;justify-content:flex-start}
.num b{font-size:clamp(28px,3.8vh,40px)}
.num span{font-size:16px;text-transform:none;letter-spacing:0;color:var(--dim)}
.go{box-shadow:0 5px 0 #8caf20;min-height:clamp(72px,9.5vh,92px)}
.go .t{font-size:clamp(24px,3.6vh,36px)}.go .s{font-size:17px;color:#2d3d10}
.alert .more{gap:0;display:flex;justify-content:space-between}
.alert .more button{background:none;border:0;min-height:44px;font-size:17px;color:var(--dim);text-transform:none;letter-spacing:0;font-weight:800;padding:6px 8px;text-align:center}
.alert .more button:active{color:#fff}
@media(orientation:portrait){
  .hoppers{min-height:0;grid-template-rows:auto minmax(0,1fr)}
  .big .bar{flex-direction:row;align-items:center;justify-content:space-between;padding:0 16px;min-height:clamp(64px,7vh,80px)}
  .big .bar .m{text-align:right}.big .bar .m b{font-size:clamp(34px,4.6vh,44px)}.big .bar .m span{white-space:nowrap;margin-top:2px}
  .tops .bar{min-height:40px}
  .nums{padding:8px 14px}.num{flex-direction:row;align-items:baseline}.num b{font-size:clamp(26px,3.4vh,36px)}.num span{white-space:nowrap}
  .alert .more{flex-wrap:wrap}.alert .more button{flex:1 1 30%}
}

/* toppings: name on top, number under it */
.tops .bar{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:6px 14px;min-height:56px}
.tops .bar .n{font-size:clamp(19px,2.6vh,24px);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tops .bar .v{font-size:clamp(18px,2.4vh,22px);color:rgba(255,255,255,.9)}
/* refill moment: a worker just filled it */
.bar.just{outline:4px solid var(--lime);outline-offset:-4px}
.bar.just .v,.bar.just .m span{color:var(--lime)}
.bar{cursor:pointer}
@media(orientation:portrait){.tops .bar{min-height:52px;padding:4px 12px}.tops .bar .n{font-size:19px}.tops .bar .v{font-size:18px}}
@media(orientation:landscape){.tops .bar{min-height:54px}}

/* ALERT: info left, one big button right */
.alert{display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,30%,380px);gap:16px;align-items:stretch;padding:14px 16px 14px 20px}
.aleft{display:grid;gap:10px;align-content:center;min-width:0}
.ahead{font-size:clamp(22px,3vh,30px)}
.ahead small{font-size:16px}
.nums{background:none;padding:0;gap:22px;justify-content:flex-start}
.num{flex:0 0 auto}
.num b{font-size:clamp(26px,3.4vh,34px)}
.num span{font-size:16px}
.alert .more{display:flex;gap:4px;justify-content:flex-start;flex-wrap:wrap;margin:0}
.alert .more button{padding:4px 12px 4px 0;min-height:32px;font-size:16px;text-align:left}
.alert .more button:not(:last-child){border-right:2px solid var(--line);padding-right:14px;border-radius:0}
.go{min-height:0;height:100%;display:grid;grid-template-rows:auto auto;align-content:center;justify-items:center;text-align:center;padding:14px 18px;gap:6px;position:relative}
.go .t{font-size:clamp(26px,3.6vh,36px);line-height:.95}
.go .s{font-size:16px;color:#2d3d10;margin:0}
.go .a{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:clamp(30px,4vh,40px)}
@media(orientation:portrait){
  .alert{grid-template-columns:minmax(0,1fr);gap:12px;padding:14px 16px}
  .go{height:auto;min-height:clamp(84px,9vh,100px);grid-template-columns:minmax(0,1fr);justify-items:start;text-align:left;padding:12px 60px 12px 18px}
  .go .t br{display:none}
  .nums{gap:16px}.num b{font-size:clamp(24px,3vh,30px)}.num span{white-space:nowrap}
}

/* alert: words | numbers | button */
.alert{grid-template-columns:minmax(0,1.2fr) max-content clamp(260px,30%,380px);gap:0 28px}
.nums{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:12px;row-gap:4px;align-content:center;align-items:baseline;justify-self:start;padding:0 0 0 28px;border-left:2px solid var(--line);align-self:stretch}
.num{display:contents}
.num b{font-size:clamp(26px,3.4vh,34px);text-align:right;font-variant-numeric:tabular-nums}
.num span{font-size:16px;white-space:nowrap}
@media(orientation:portrait){
  .alert{grid-template-columns:minmax(0,1fr);gap:12px}
  .nums{display:flex;gap:16px;padding:0;border-left:0;justify-self:stretch}
  .num{display:flex;align-items:baseline;gap:8px}
}

/* alert: give the words the width */
.alert{grid-template-columns:minmax(0,1fr) max-content clamp(240px,26%,320px);gap:0 22px;padding:12px 14px 12px 20px}
.ahead{font-size:clamp(22px,2.8vh,26px)}
.ahead small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aleft{gap:8px}
.alert .more{flex-wrap:nowrap}
.alert .more button{white-space:nowrap}
.nums{padding:0 0 0 22px;column-gap:10px}
.go{padding:12px 44px 12px 14px}
.go .a{right:12px}
@media(orientation:portrait){
  .aleft{display:contents}
  .ahead{order:1}.nums{order:2}.alert .more{order:3}.go{order:4}
  .alert .more{flex-wrap:wrap}
}

/* final alert sizing; portrait declared last so it wins */
.alert{grid-template-columns:minmax(0,1fr) max-content clamp(220px,24%,300px)}
.ahead{font-size:clamp(21px,2.6vh,24px)}
@media(orientation:portrait){
  .alert{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;gap:10px;padding:14px 16px}

const C=[{n:'Beans',g:'veg',l:70,b:1.5},{n:'Corn',g:'veg',l:35,b:1.6},{n:'Pico',g:'veg',l:22,b:1.9},{n:'Lettuce',g:'veg',l:48,b:1.3},{n:'Cilantro',g:'veg',l:52,b:.8},{n:'Lime',g:'veg',l:90,b:.5},{n:'Guac',g:'sau',l:15,b:1.7},{n:'Verde',g:'sau',l:73,b:.9},{n:'Chipotle',g:'sau',l:30,b:1.1},{n:'Crema',g:'sau',l:66,b:1},{n:'Cheese',g:'dai',l:80,b:1.4}];

const SCENE={
 reroute:{kind:'',head:'Quinoa under-dispensing',sub:'Bowl 02 · held 12:16 · rest running',nums:[['7','orders waiting'],['4 MIN','until late'],['12','slots open at Bowl 2']],btn:'TAP TO START REROUTE',bs:'7 orders → Chicken 2',verbs:[['tech','Send tech'],['engineering','Log + alert Eng.']],

 clear:{kind:'clear',head:'All clear',sub:'Everything running',nums:()=>{const n=ALL.filter(x=>!x.held).map(x=>({x,m:refillMin(x)})).sort((a,b)=>a.m-b.m)[0];return [[n?refillClock(n.x):'—',n?'next refill · '+n.x.n:'next refill'],[String(Math.max(0,214-Math.floor((NOW-(12*60+18))*38/10))),'orders to go'],['0','alerts']];},btn:()=>{const n=ALL.filter(x=>!x.held).map(x=>({x,m:refillMin(x)})).sort((a,b)=>a.m-b.m)[0];return n?'TAP WHEN '+n.x.n.toUpperCase()+' IS REFILLED':'ALL CLEAR';},bs:()=>{const n=ALL.filter(x=>!x.held).map(x=>({x,m:refillMin(x)})).sort((a,b)=>a.m-b.m)[0];return n?n.x.n+' · from '+(n.x.src||'the reach-in'):'';},verbs:[['engineering','Log a note']],

  <button class="go" onclick="openSheet('scene')"><div class="t">${btn}</div><div class="s">${bs}</div><div class="a">→</div></button>`;
  if(window.gloveBind) gloveBind();
}

/* pops on the clock, only when the board is clear */
function popCheck(){
  if(STEP!=='clear') return;
  if(!fired.door && NOW>=12*60+22){ fired.door=1; M[2].s='held';M[2].st='Held';M[2].sub='DOOR OPEN';M[2].k='5';M[2].l='waiting';machines(); go('door'); return; }
  if(!fired.clean && NOW>=12*60+26){ fired.clean=1; go('clean'); return; }
  if(!fired.chicken && H[0].l<22){ fired.chicken=1; go('chicken'); return; }
}
/* sheets */
let selected='';const data={
 tech:{label:'Service task',title:'Send tech to Bowl 02?',text:'The task carries the machine state, recipe, and evidence automatically.',effects:[['Task','Recalibrate quinoa dispenser'],['Timing','Before the next lunch rush']],button:'SEND TECH',done:'Tech dispatched',sub:'The calibration task is ready with the right context.'},
 engineering:{label:'Fleet learning',title:'Log it and alert Engineering?',text:'This event joins the fleet pattern without slowing service.',effects:[['Pattern','14 similar incidents across 4 sites'],['Context','Today’s event is attached automatically']],button:'LOG + ALERT',done:'Logged. Engineering alerted',sub:'This incident is now part of the fleet reliability signal.'}};
function openSheet(k){selected=k;
  if(k.startsWith('refill:')){const x=ALL.find(a=>a.n===k.slice(7));sheetLabel.textContent='Refill';sheetTitle.textContent=`Mark ${x.n} refilled?`;sheetText.textContent=`${Math.round(x.l)}% now. Hold to confirm at the hopper. Next up updates on its own.`;effects.innerHTML='<div class="effect"><b>Hopper</b><span>'+x.n+' back to 100%</span></div><div class="effect"><b>Service</b><span>Dispensing keeps running during the swap</span></div>';document.getElementById('confirm').textContent='REFILLED';overlay.classList.add('show');return;}
  const x=k==='scene'?SCENE[STEP].sheet:data[k];sheetLabel.textContent=x.label;sheetTitle.textContent=x.title;sheetText.textContent=x.text;effects.innerHTML=x.effects.map(a=>'<div class="effect"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>').join('');document.getElementById('confirm').textContent=x.button;overlay.classList.add('show')}
function closeSheet(){overlay.classList.remove('show')}
function commit(){
  if(selected.startsWith('refill:')){closeSheet();refill(ALL.find(a=>a.n===selected.slice(7)),'you');return;}
  if(selected==='scene'){closeSheet();SCENE[STEP].done();return;}
