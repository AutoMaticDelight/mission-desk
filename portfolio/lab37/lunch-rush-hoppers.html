<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab37 - Lunch Rush + Hoppers</title>
<style>
:root{--ink:#f5f8f4;--muted:#a8b7ad;--black:#101914;--black2:#17231c;--lime:#cfff3e;--lime2:#e1ff82;--orange:#ff7a1a;--line:#34483b;--panel:#ecf0eb;--green:#155e43;--shadow:0 26px 70px rgba(7,12,9,.35)}*{box-sizing:border-box}body{margin:0;background:#dfe5de;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;padding:18px;display:grid;grid-template-columns:68px 1fr;gap:18px}.rail{border-radius:19px;background:var(--black);padding:13px 10px;display:flex;align-items:center;flex-direction:column;gap:13px}.logo{width:39px;height:39px;border-radius:12px;background:var(--lime);color:#102016;font-weight:950;font-size:12px;display:grid;place-items:center;margin-bottom:18px}.rail button{height:40px;width:40px;border:0;border-radius:11px;color:#93a59a;background:transparent;font-size:16px}.rail button.active{background:#294738;color:var(--lime)}.rail div:last-child{margin-top:auto}.main{width:100%;max-width:1480px;margin:auto}.top{height:52px;display:flex;align-items:center;justify-content:space-between;color:#26382d}.location{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:750}.location b{font-size:16px;letter-spacing:-.5px}.tag{font-size:10px;letter-spacing:1px;font-weight:900;color:#496050;background:#cfd9d0;padding:6px 9px;border-radius:20px}.live{font-size:12px;font-weight:750;color:#3a7252;display:flex;align-items:center;gap:8px}.live i{height:8px;width:8px;border-radius:50%;background:#12b56b;box-shadow:0 0 0 4px #c9efda}.hero{min-height:630px;border-radius:25px;background:var(--black);position:relative;overflow:hidden;padding:42px clamp(28px,5vw,76px);box-shadow:var(--shadow);display:flex;flex-direction:column}.hero:before{content:"";position:absolute;right:-120px;top:-210px;width:570px;height:570px;border:75px solid rgba(207,255,62,.12);border-radius:50%}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:190px;background:linear-gradient(transparent,#0b120e)}.hero>*{position:relative;z-index:1}.status{color:#ffc08d;font-weight:900;text-transform:uppercase;letter-spacing:1.4px;font-size:12px;display:flex;gap:9px;align-items:center}.status i{height:10px;width:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 6px rgba(255,122,26,.14)}h1{max-width:920px;font-size:clamp(44px,6.7vw,94px);line-height:.9;letter-spacing:-.07em;margin:30px 0 17px}h1 span{color:var(--lime)}.one-line{font-size:clamp(17px,2vw,25px);line-height:1.25;color:#c7d1ca;max-width:780px;margin:0}.numbers{display:flex;gap:50px;margin:38px 0 31px}.number{min-width:152px}.number b{font-size:clamp(43px,5.2vw,71px);line-height:.8;letter-spacing:-.07em;display:block;color:#fff}.number:first-child b{color:var(--lime)}.number span{display:block;font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:1.1px;color:#94a59a;margin-top:12px}.primary{border:0;background:var(--lime);color:#112116;border-radius:15px;min-height:106px;width:min(100%,850px);padding:20px 27px;display:flex;align-items:center;justify-content:space-between;text-align:left;font-weight:950;box-shadow:0 9px 0 #8caf20,0 15px 35px rgba(186,248,40,.23);transition:.14s}.primary:hover{transform:translateY(-3px);background:var(--lime2);box-shadow:0 12px 0 #8caf20,0 22px 42px rgba(186,248,40,.28)}.primary .action{font-size:clamp(22px,3vw,35px);letter-spacing:-.05em;line-height:1}.primary .hint{font-size:13px;margin-top:7px;font-weight:750;color:#3d5b25}.primary .arrow{font-size:44px;font-weight:400;line-height:1}.safe{margin-top:26px;display:flex;align-items:center;gap:9px;color:#b5c5ba;font-size:13px;font-weight:650}.safe i{height:22px;width:22px;border-radius:50%;display:grid;place-items:center;background:#204c36;color:var(--lime);font-style:normal;font-size:13px}.bottom{margin-top:18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}.action-card{min-height:120px;background:var(--panel);color:#19251e;border:0;border-radius:16px;padding:18px;text-align:left;position:relative;transition:.15s}.action-card:hover{transform:translateY(-2px);box-shadow:0 12px 23px rgba(18,34,23,.16)}.action-card .small{font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#6b7c71}.action-card b{font-size:19px;line-height:1.04;letter-spacing:-.04em;display:block;margin-top:8px;max-width:190px}.action-card span{position:absolute;right:16px;bottom:13px;font-size:21px;color:var(--green)}.action-card.dim{background:#ced6cf;color:#344238}.action-card.dim b{font-size:16px}.overlay{position:fixed;inset:0;background:rgba(6,12,8,.63);display:none;align-items:flex-end;justify-content:center;padding:20px;z-index:10}.overlay.show{display:flex}.sheet{background:#f8faf7;color:#18231c;width:min(800px,100%);border-radius:21px;padding:25px;box-shadow:var(--shadow);animation:slide .18s ease-out}@keyframes slide{from{opacity:.2;transform:translateY(25px)}to{opacity:1;transform:none}}.handle{height:5px;width:52px;border-radius:5px;background:#d5ded6;margin:-5px auto 22px}.sheet .eyebrow{font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:#6b7b70}.sheet h2{font-size:clamp(28px,4vw,42px);line-height:.98;letter-spacing:-.06em;margin:8px 0 11px}.sheet p{margin:0;color:#617067;font-size:15px;line-height:1.4}.effects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.effect{border:1px solid #d5ddd5;background:#fff;border-radius:11px;padding:13px}.effect b{font-size:13px;display:block}.effect span{display:block;color:#68756c;font-size:12px;margin-top:3px}.sheet-actions{display:flex;gap:10px;justify-content:flex-end}.sheet button{border-radius:11px;padding:15px 18px;font-weight:900;font-size:14px}.back{background:#fff;border:1px solid #cbd5cd;color:#324239}.confirm{background:var(--lime);border:0;color:#142217}.toast{position:fixed;right:23px;bottom:23px;z-index:20;background:#143727;color:#fff;border-radius:14px;padding:17px 19px;box-shadow:var(--shadow);display:none;max-width:360px}.toast.show{display:block}.toast b{display:block;font-size:16px}.toast span{font-size:12px;color:#c6daca;display:block;margin-top:3px}@media(max-width:820px){.app{padding:10px;display:block}.rail{display:none}.top{padding:0 5px}.hero{min-height:590px;padding:31px 23px}.numbers{gap:23px;margin:34px 0}.number{min-width:0}.number:nth-child(3){display:none}.primary{min-height:118px;padding:20px}.bottom{grid-template-columns:1fr 1fr}.action-card:last-child{grid-column:span 2}.effects{grid-template-columns:1fr}.sheet-actions{margin-top:4px}.sheet-actions button{flex:1}}

/* quick view: hoppers. The bar IS the message: the fill is what's left, the grey track is what's gone. Name and number ride on top. */
.hop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.9fr);gap:8px;margin:0 0 12px}
.h{position:relative;overflow:hidden;border-radius:12px;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:72px;background:#aab6ad;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.h .f{position:absolute;inset:0;right:auto;background:#1a8a5c;transition:width .6s}
.h.low .f{background:#e08a00}.h.now .f{background:#d83a12}
.h.now{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(216,58,18,0)}50%{box-shadow:0 0 0 8px rgba(216,58,18,.3)}}
.h .n,.h .m{position:relative;z-index:1}
.h .n{font-size:clamp(15px,1.7vw,21px);font-weight:950;letter-spacing:-.03em;text-transform:uppercase;line-height:1;min-width:0;flex:0 1 auto}
.h .m{font-size:clamp(30px,3.4vw,42px);font-weight:950;letter-spacing:-.07em;line-height:.85;text-align:right;flex:0 0 auto}
.h .m small{display:block;font-size:10px;letter-spacing:.9px;font-weight:900;margin-top:4px;opacity:.95;white-space:nowrap}
.c{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:4px;align-content:stretch}
.sq{position:relative;overflow:hidden;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:11px;font-weight:950;letter-spacing:.3px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);background:#aab6ad;min-height:18px}
.sq i{position:absolute;left:0;top:0;bottom:0;background:#1a8a5c;transition:width .6s}
.sq.low i{background:#e08a00}.sq.now i{background:#d83a12}.sq.held{background:#4b5a51}.sq.held i{display:none}
.sq b,.sq em{position:relative;z-index:1;font-style:normal;font-weight:inherit}
.sq em{font-size:10px;opacity:.95}
@media(max-width:820px){.hop{grid-template-columns:1fr 1fr 1fr}.c{grid-column:1/-1}.h{min-height:64px;padding:8px 10px}.h .n{font-size:16px}.h .m{font-size:36px}}
</style>
<link rel="stylesheet" href="glove.css"></head>
<body>
<div class="app">
  <aside class="rail"><div class="logo">L37</div><button class="active">⌁</button><button>◌</button><button>⇄</button><button>◫</button><div><button>?</button></div></aside>
  <main class="main">
    <header class="top"><div class="location"><b>lab37</b><span>/ Uptown Bowl</span><span class="tag">LUNCH RUSH</span><span class="tag" id="fc">THU 12:18 · PEAK 12:30–12:50</span></div><div class="live"><i></i>LIVE</div></header>
    <section class="hop" id="hop"></section>
    <section class="hero">
      <div class="status"><i></i>Action needed now</div>
      <h1><span>7 orders.</span><br>Move them now.</h1>
      <p class="one-line">Quinoa is under-dispensing at Bowl Builder 02.</p>
      <div class="numbers"><div class="number"><b>7</b><span>Orders to protect</span></div><div class="number"><b>4 MIN</b><span>Until guests wait</span></div><div class="number"><b>12</b><span>Open slots at Bowl 2</span></div></div>
      <button class="primary" onclick="openSheet('reroute')"><div><div class="action">REROUTE TO CHICKEN BOWL 2</div><div class="hint">Protect every order · Start now</div></div><div class="arrow">→</div></button>
      <div class="safe"><i>✓</i>Other recipes are still running</div>
    </section>
    <section class="bottom">
      <button class="action-card" onclick="openSheet('tech')"><div class="small">Next best action</div><b>Send tech<br>to recalibrate</b><span>→</span></button>
      <button class="action-card" onclick="openSheet('fix')"><div class="small">At the machine</div><b>Quick<br>fix now</b><span>→</span></button>
      <button class="action-card dim" onclick="openSheet('engineering')"><div class="small">Background</div><b>Alert Engineering<br>and log event</b><span>→</span></button>
    </section>
  </main>
</div>
<div class="overlay" id="overlay"><div class="sheet"><div class="handle"></div><div class="eyebrow" id="sheetLabel"></div><h2 id="sheetTitle"></h2><p id="sheetText"></p><div class="effects" id="effects"></div><div class="sheet-actions"><button class="back" onclick="closeSheet()">BACK</button><button class="confirm" id="confirm" onclick="commit()"></button></div></div></div>
<div class="toast" id="toast"><b id="toastTitle"></b><span id="toastText"></span></div>
<script>
let selected='';const data={reroute:{label:'Protect service',title:'Move 7 orders to Chicken Bowl 2?',text:'Chicken Bowl 2 has enough capacity to take every affected order now.',effects:[['Guests','All 7 orders stay in the service window'],['Bowl Builder 02','Quinoa is held. Other recipes keep running']],button:'MOVE 7 ORDERS',done:'Orders moving now',sub:'Chicken Bowl 2 is taking the work. Guests stay on track.'},tech:{label:'Service task',title:'Send tech to recalibrate?',text:'The task includes the machine state, recipe, and evidence automatically.',effects:[['Task','Recalibrate quinoa dispenser'],['Timing','Before the next lunch rush']],button:'SEND TECH',done:'Tech dispatched',sub:'The calibration task is ready with the right context.'},fix:{label:'Safe quick fix',title:'Start the quick fix?',text:'The machine is safe. You will get two simple, on-screen steps.',effects:[['Step 1','Open the yellow quinoa panel'],['Step 2','Loosen quinoa, then run a test']],button:'START QUICK FIX',done:'Quick fix started',sub:'Bowl Builder 02 is ready for the first check.'},engineering:{label:'Fleet learning',title:'Alert Engineering?',text:'This event will be linked to the quinoa low-fill pattern without slowing service.',effects:[['Pattern','14 similar incidents across 4 sites'],['Context','Today’s event is attached automatically']],button:'ALERT ENGINEERING',done:'Engineering alerted',sub:'This incident is now part of the fleet reliability signal.'}};
function openSheet(key){selected=key;const x=data[key];sheetLabel.textContent=x.label;sheetTitle.textContent=x.title;sheetText.textContent=x.text;effects.innerHTML=x.effects.map(a=>'<div class="effect"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>').join('');document.getElementById('confirm').textContent=x.button;overlay.classList.add('show')}function closeSheet(){overlay.classList.remove('show')}function commit(){const x=data[selected];closeSheet();toastTitle.textContent=x.done;toastText.textContent=x.sub;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),4300)}

/* hoppers quick view. Level % and burn %/min at the pace right now. The forecast knows the day: Thursday lunch peaks 12:30-12:50. */
const NOW=12*60+18; // 12:18
const PEAK=[12*60+30,12*60+50];
const H=[{n:'Chicken',l:64,b:2.1},{n:'Rice',l:41,b:2.9},{n:'Beef',l:17,b:2.8}];
const C=[{n:'Quinoa',k:'QUI',held:1},{n:'Black beans',k:'BEAN',l:70,b:1.5},{n:'Corn',k:'CORN',l:35,b:1.6},{n:'Pico',k:'PICO',l:22,b:1.9},{n:'Guac',k:'GUAC',l:15,b:1.7},{n:'Cheese',k:'CHZ',l:80,b:1.4},{n:'Crema',k:'CRMA',l:66,b:1},{n:'Lettuce',k:'LETT',l:48,b:1.3},{n:'Salsa verde',k:'VERD',l:73,b:.9},{n:'Chipotle',k:'CHIP',l:30,b:1.1},{n:'Cilantro',k:'CIL',l:52,b:.8},{n:'Lime',k:'LIME',l:90,b:.5}];
/* Thursday curve: pace multiplier by clock minute. Ramps into the peak, tapers after 13:10. */
const pace=t=> t<PEAK[0]?1.0 : t<PEAK[1]?1.35 : t<13*60+10?1.0 : 0.6;
const REFILL_AT=15; // swap before the hopper is dry
function refillClock(x){ if(x.held) return null; let lvl=x.l, t=NOW; while(lvl>REFILL_AT && t<NOW+240){ lvl-=x.b*pace(t); t++; } if(lvl>REFILL_AT) return 'after 4pm'; const h=Math.floor(t/60), m=t%60; return (h>12?h-12:h)+':'+String(m).padStart(2,'0'); }
const mn=x=>Math.max(0,Math.round(x.l/x.b)), st=x=>x.held?'held':mn(x)<8?'now':mn(x)<20?'low':'ok';
function hop(){document.getElementById('hop').innerHTML=H.map(x=>`<div class="h ${st(x)}" title="${x.n}: ${mn(x)} min at this pace; refill by ${refillClock(x)} on the Thursday curve"><i class="f" style="width:${x.l}%"></i><div class="n">${x.n}</div><div class="m">${mn(x)}<small>REFILL BY ${refillClock(x)}</small></div></div>`).join('')+'<div class="c">'+C.map(x=>{const r=refillClock(x),z=st(x);return `<span class="sq ${z}" title="${x.n}${x.held?': held':': '+mn(x)+' min · refill by '+r}"><i style="width:${x.held?0:x.l}%"></i><b>${x.k}</b><em>${x.held?'HELD':z==='ok'?Math.round(x.l)+'%':r}</em></span>`;}).join('')+'</div>';}
hop();setInterval(()=>{[...H,...C].forEach(x=>{if(!x.held)x.l=Math.max(0,x.l-x.b/6)});hop()},10000);
</script>
<script src="glove.js"></script></body>
</html>
