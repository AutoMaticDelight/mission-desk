<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab37 - Lunch Rush · Hoppers</title>
<style>
:root{--ink:#19251e;--muted:#5f7066;--black:#101914;--lime:#cfff3e;--line:#c9d3cb;--panel:#f4f7f3;--page:#dfe5de;--ok:#155e43;--ok-bg:#d9f0e2;--low:#b86a00;--low-bg:#ffe7bf;--now:#c8320f;--now-bg:#ffd9cc;--held:#4b5a51;--held-bg:#d7ded8;--shadow:0 18px 50px rgba(7,12,9,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{min-height:100vh;padding:18px;display:grid;grid-template-columns:68px 1fr;gap:18px}
.rail{border-radius:19px;background:var(--black);padding:13px 10px;display:flex;align-items:center;flex-direction:column;gap:13px}
.logo{width:39px;height:39px;border-radius:12px;background:var(--lime);color:#102016;font-weight:950;font-size:12px;display:grid;place-items:center;margin-bottom:18px}
.rail button{height:40px;width:40px;border:0;border-radius:11px;color:#93a59a;background:transparent;font-size:16px}
.rail button.active{background:#294738;color:var(--lime)}
.rail div:last-child{margin-top:auto}
.main{width:100%;max-width:1600px;margin:auto;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 36px)}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;color:#26382d}
.location{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:750}
.location b{font-size:16px;letter-spacing:-.5px}
.tag{font-size:10px;letter-spacing:1px;font-weight:900;color:#496050;background:#cfd9d0;padding:6px 9px;border-radius:20px}
.live{font-size:12px;font-weight:750;color:#3a7252;display:flex;align-items:center;gap:8px}
.live i{height:8px;width:8px;border-radius:50%;background:#12b56b;box-shadow:0 0 0 4px #c9efda}
/* headline strip */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(30px,3.6vw,52px);line-height:.95;letter-spacing:-.05em}
.head h1 span{color:var(--now)}
.head .clock{font-size:clamp(16px,1.6vw,22px);font-weight:800;color:var(--muted);text-align:right}
.head .clock b{display:block;color:var(--ink);font-size:clamp(22px,2.4vw,34px);letter-spacing:-.04em}
/* big hoppers */
.big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;flex:1 1 auto}
.hopper{background:var(--panel);border-radius:22px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) 64px;grid-template-rows:auto 1fr auto;gap:10px 18px;min-height:min(40vh,440px);box-shadow:var(--shadow);border:4px solid transparent;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:transform .12s}
.hopper:hover{transform:translateY(-2px)}
.hopper.now{border-color:var(--now);background:#fff3ee}
.hopper.low{border-color:var(--low);background:#fff8ea}
.hopper.held{background:var(--held-bg)}
.hopper .name{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hopper .name b{font-size:clamp(30px,3.4vw,54px);letter-spacing:-.05em;line-height:.95}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;font-weight:950;font-size:clamp(14px,1.3vw,20px);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill i{font-style:normal;font-size:1.1em;line-height:1}
.pill.ok{background:var(--ok);color:#fff}
.pill.low{background:var(--low-bg);color:var(--low)}
.pill.now{background:var(--now);color:#fff}
.pill.held{background:var(--held);color:#fff}
.hopper .min{align-self:end}
.hopper .min b{display:block;font-size:clamp(72px,8vw,128px);line-height:.82;letter-spacing:-.08em}
.hopper .min span{display:block;margin-top:10px;font-size:clamp(13px,1.2vw,18px);font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hopper.now .min b{color:var(--now)}
.hopper.low .min b{color:var(--low)}
.hopper.held .min b{color:var(--held);font-size:clamp(44px,5vw,80px);line-height:1}
.gauge{grid-row:2/4;grid-column:2;display:flex;flex-direction:column;align-items:center;gap:8px}
.gauge .bar{flex:1;width:100%;min-height:160px;border-radius:14px;background:#cfd8d0;position:relative;overflow:hidden;border:3px solid #b7c2b9}
.gauge .fill{position:absolute;left:0;right:0;bottom:0;background:var(--ok);transition:height .6s}
.hopper.low .gauge .fill{background:var(--low)}
.hopper.now .gauge .fill{background:var(--now)}
.hopper.held .gauge .fill{background:var(--held)}
.gauge .pct{font-size:clamp(16px,1.5vw,22px);font-weight:950;letter-spacing:-.03em}
.hopper .next{grid-column:1;align-self:end;font-size:clamp(15px,1.4vw,21px);font-weight:750;color:var(--ink);line-height:1.25;border-top:3px solid var(--line);padding-top:12px}
.hopper .next small{display:block;font-size:.72em;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
/* condiments strip */
.small-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.small-head b{font-size:clamp(13px,1.1vw,16px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:900}
.small-head span{font-size:clamp(13px,1.1vw,16px);font-weight:800;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cond{background:var(--panel);border-radius:14px;padding:12px 14px 12px;display:grid;gap:8px;border:3px solid transparent;text-align:left;color:inherit;font:inherit;cursor:pointer;min-height:92px}
.cond.low{border-color:var(--low);background:#fff8ea}
.cond.now{border-color:var(--now);background:#fff3ee}
.cond.held{background:var(--held-bg)}
.cond .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cond .row b{font-size:clamp(18px,1.5vw,24px);letter-spacing:-.04em;line-height:1;flex:1 1 auto}
.cond .row span{font-size:clamp(16px,1.5vw,24px);font-weight:950;letter-spacing:-.03em;white-space:nowrap}
.cond.ok .row span{color:var(--ok)}
.cond.low .row span{color:var(--low)}
.cond.now .row span{color:var(--now)}
.cond.held .row span{color:var(--held);font-size:clamp(13px,1.1vw,16px);letter-spacing:.08em}
.cond .hbar{height:12px;border-radius:8px;background:#cfd8d0;overflow:hidden;border:2px solid #b7c2b9}
.cond .hbar i{display:block;height:100%;background:var(--ok);transition:width .6s}
.cond.low .hbar i{background:var(--low)}
.cond.now .hbar i{background:var(--now)}
.cond.held .hbar i{background:var(--held)}
/* refill queue */
.queue{background:var(--black);color:#fff;border-radius:18px;padding:16px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.queue .lbl{font-size:clamp(12px,1vw,15px);font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#93a59a}
#queue{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.queue .item{display:inline-flex;align-items:baseline;gap:10px}
.queue .item b{font-size:clamp(20px,2vw,30px);letter-spacing:-.04em}
.queue .item span{font-size:clamp(14px,1.3vw,20px);font-weight:900;color:var(--lime)}
.queue .item.now span{color:#ff8d6a}
.queue .who{margin-left:auto;font-size:clamp(13px,1.2vw,17px);font-weight:750;color:#c7d1ca}
/* sheet (glove.css takes over) */
.overlay{position:fixed;inset:0;background:rgba(6,12,8,.63);display:none;align-items:flex-end;justify-content:center;padding:20px;z-index:10}
.overlay.show{display:flex}
.sheet{background:#f8faf7;color:#18231c;width:min(800px,100%);border-radius:21px;padding:25px;box-shadow:var(--shadow)}
.handle{height:5px;width:52px;border-radius:5px;background:#d5ded6;margin:-5px auto 22px}
.sheet .eyebrow{font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:#6b7b70}
.sheet h2{font-size:clamp(28px,4vw,42px);line-height:.98;letter-spacing:-.06em;margin:8px 0 11px}
.sheet p{margin:0;color:#617067;font-size:15px;line-height:1.4}
.effects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.effect{border:1px solid #d5ddd5;background:#fff;border-radius:11px;padding:13px}
.effect b{font-size:13px;display:block}.effect span{display:block;color:#68756c;font-size:12px;margin-top:3px}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end}
.sheet button{border-radius:11px;padding:15px 18px;font-weight:900;font-size:14px}
.back{background:#fff;border:1px solid #cbd5cd;color:#324239}
.confirm{background:var(--lime);border:0;color:#142217}
.toast{position:fixed;right:23px;bottom:23px;z-index:20;background:#143727;color:#fff;border-radius:14px;padding:17px 19px;box-shadow:var(--shadow);display:none;max-width:360px}
.toast.show{display:block}.toast b{display:block;font-size:16px}.toast span{font-size:12px;color:#c6daca;display:block;margin-top:3px}
@media(max-width:1000px){.big{grid-template-columns:1fr 1fr}.hopper:first-child{grid-column:1/-1;min-height:300px}}
@media(max-width:820px){.app{padding:10px;display:block}.rail{display:none}.main{min-height:0}.big{grid-template-columns:1fr}.hopper{min-height:240px;padding:18px}.hopper:first-child{grid-column:auto}.hopper .min b{font-size:76px}.gauge .bar{min-height:110px}.strip{grid-template-columns:1fr 1fr}.queue{gap:12px 18px}.queue .who{margin-left:0;width:100%}}
</style>
<link rel="stylesheet" href="glove.css"></head>
<body>
<div class="app">
  <aside class="rail"><div class="logo">L37</div><button>⌁</button><button class="active">◌</button><button>⇄</button><button>◫</button><div><button>?</button></div></aside>
  <main class="main">
    <header class="top"><div class="location"><b>lab37</b><span>/ Uptown Bowl</span><span class="tag">LUNCH RUSH</span></div><div class="live"><i></i>LIVE</div></header>
    <div class="head">
      <h1>Hoppers.<br><span id="headline">Beef runs out in 6 minutes.</span></h1>
      <div class="clock">Rush pace<b id="pace">38 bowls / 10 min</b></div>
    </div>
    <section class="big" id="big"></section>
    <div class="small-head"><b>Toppings &amp; sauces</b><span>Minutes left at this pace · ✓ = more than 20</span></div>
    <section class="strip" id="strip"></section>
    <footer class="queue"><span class="lbl">Refill next</span><span id="queue"></span><span class="who">Maya is on hoppers · walk-in is 40 ft</span></footer>
  </main>
</div>
<div class="overlay" id="overlay"><div class="sheet"><div class="handle"></div><div class="eyebrow" id="sheetLabel"></div><h2 id="sheetTitle"></h2><p id="sheetText"></p><div class="effects" id="effects"></div><div class="sheet-actions"><button class="back" onclick="closeSheet()">BACK</button><button class="confirm" id="confirm" onclick="commit()"></button></div></div></div>
<div class="toast" id="toast"><b id="toastTitle"></b><span id="toastText"></span></div>
<script>
/* level = % full in the hopper. burn = % per minute at the current rush pace. minutes = level / burn. */
const BIG=[
  {id:'chicken',name:'Chicken',level:64,burn:2.1,refill:'2 hotel pans · reach-in 1',who:'Maya'},
  {id:'rice',   name:'Rice',   level:41,burn:2.9,refill:'1 batch · rice cooker 2 ready 12:31',who:'Maya'},
  {id:'beef',   name:'Beef',   level:17,burn:2.8,refill:'1 hotel pan · walk-in, rear left',who:'Maya'},
];
const SMALL=[
  {id:'quinoa',name:'Quinoa',level:58,burn:1.2,held:true,note:'Under-dispensing · held'},
  {id:'beans',name:'Black beans',level:70,burn:1.5},
  {id:'corn',name:'Corn',level:35,burn:1.6},
  {id:'pico',name:'Pico',level:22,burn:1.9},
  {id:'guac',name:'Guac',level:15,burn:1.7},
  {id:'cheese',name:'Cheese',level:80,burn:1.4},
  {id:'crema',name:'Crema',level:66,burn:1.0},
  {id:'lettuce',name:'Lettuce',level:48,burn:1.3},
  {id:'verde',name:'Salsa verde',level:73,burn:0.9},
  {id:'chipotle',name:'Chipotle',level:30,burn:1.1},
  {id:'cilantro',name:'Cilantro',level:52,burn:0.8},
  {id:'lime',name:'Lime',level:90,burn:0.5},
];
const ALL=[...BIG,...SMALL];
const mins=x=>Math.max(0,Math.round(x.level/x.burn));
const state=x=> x.held?'held' : mins(x)<8?'now' : mins(x)<20?'low':'ok';
const WORD={ok:['✓','OK'],low:['▲','Low'],now:['●','Refill now'],held:['■','Held']};
function pill(x){const s=state(x);return `<span class="pill ${s}"><i>${WORD[s][0]}</i>${WORD[s][1]}</span>`;}
function renderBig(){
  document.getElementById('big').innerHTML=BIG.map(x=>{const s=state(x),m=mins(x);return `<button class="hopper ${s}" onclick="openSheet('${x.id}')">
    <div class="name"><b>${x.name}</b>${pill(x)}</div>
    <div class="min"><b>${x.held?'HELD':m}</b><span>${x.held?'not dispensing':'min left'}</span></div>
    <div class="gauge"><div class="bar"><div class="fill" style="height:${x.level}%"></div></div><div class="pct">${x.level}%</div></div>
    <div class="next"><small>Refill</small>${x.refill}</div>
  </button>`;}).join('');
}
function renderSmall(){
  document.getElementById('strip').innerHTML=SMALL.map(x=>{const s=state(x),m=mins(x);return `<button class="cond ${s}" onclick="openSheet('${x.id}')">
    <div class="row"><b>${x.name}</b><span>${x.held?'HELD':s==='ok'?'✓':m+' min'}</span></div>
    <div class="hbar"><i style="width:${x.level}%"></i></div>
  </button>`;}).join('');
}
function renderQueue(){
  const q=ALL.filter(x=>!x.held).sort((a,b)=>mins(a)-mins(b)).slice(0,4);
  document.getElementById('queue').innerHTML=q.map(x=>`<span class="item ${state(x)}"><b>${x.name}</b><span>${mins(x)} min</span></span>`).join('<span style="opacity:.35">·</span>');
  const worst=q[0];document.getElementById('headline').textContent=`${worst.name} runs out in ${mins(worst)} minutes.`;
}
function render(){renderBig();renderSmall();renderQueue();}
render();
/* live: hoppers drain at the rush pace */
setInterval(()=>{ALL.forEach(x=>{if(!x.held)x.level=Math.max(0,+(x.level-x.burn/6).toFixed(1));});render();},10000);
/* sheets */
let selected='';
function openSheet(id){selected=id;const x=ALL.find(a=>a.id===id);const s=state(x);
  sheetLabel.textContent=x.held?'Machine hold':'Refill';
  sheetTitle.textContent=x.held?`Release ${x.name} after the check?`:`Refill ${x.name} now?`;
  sheetText.textContent=x.held?'Quinoa is held because three portions came in under target. A quick fix is two steps at the machine.':`${x.level}% full. About ${mins(x)} minutes at this pace. ${x.refill||'Backup is in the reach-in.'}`;
  effects.innerHTML=(x.held?[['Machine','Bowl Builder 02 stays safe. Other recipes keep running'],['Guests','7 quinoa orders rerouted to Chicken Bowl 2']]:[['Who',(x.who||'Maya')+' gets the task on the crew screen'],['Service','Hopper keeps dispensing during the swap']]).map(a=>'<div class="effect"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>').join('');
  document.getElementById('confirm').textContent=x.held?'START QUICK FIX':`SEND ${(x.who||'MAYA').toUpperCase()}`;
  overlay.classList.add('show');}
function closeSheet(){overlay.classList.remove('show')}
function commit(){const x=ALL.find(a=>a.id===selected);closeSheet();
  if(x.held){toastTitle.textContent='Quick fix started';toastText.textContent='Bowl Builder 02 is ready for the first check.';}
  else{x.level=100;render();toastTitle.textContent=`${x.name} refill sent to ${x.who||'Maya'}`;toastText.textContent='Marked full when the swap is confirmed at the hopper.';}
  toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),4300);}
</script>
<script src="glove.js"></script></body>
</html>
