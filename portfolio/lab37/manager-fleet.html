<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab37 - Manager · All Stores</title>
<style>
/* MANAGER PANEL. 20 machines, one iPad, no scroll.
   Three questions, in order: Who needs me now? What should I watch? Is everything else on plan?
   Machines are named by store, because that is what a manager says out loud. */
:root{--bg:#0b120e;--panel:#141d18;--line:#2c3a31;--ink:#fff;--dim:#c7d1ca;--ok:#0f5a3a;--okline:#1a7a4f;--warn:#7a5200;--bad:#8a2410;--now:#e5401a;--lime:#cfff3e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:800;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr);gap:14px;padding:16px;height:100vh;overflow:hidden;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
b{font-weight:950}
h2{margin:0;font-size:16px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);display:block;line-height:1.3}
h2 b{font-size:16px;color:#fff}
h2 i{width:12px;height:12px;border-radius:50%;background:var(--now);display:inline-block;margin-right:10px;vertical-align:middle}
h2.h-watch i{background:#f0a000}h2.h-fine i{background:#1a7a4f}
/* top band */
.band{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto auto;gap:14px;align-items:center;background:var(--panel);border-radius:18px;padding:10px 22px;min-height:64px;min-width:0;overflow:hidden}
.band>*{min-width:0}
.where{font-size:22px;letter-spacing:-.02em;white-space:nowrap}.where span{color:var(--lime);margin-left:10px}
.when{font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;align-items:baseline;gap:7px;white-space:nowrap;border-left:2px solid var(--line);padding-left:14px}
.stat b{font-size:clamp(28px,2.9vw,36px);letter-spacing:-.06em;line-height:.9}
.stat span{font-size:16px;letter-spacing:.4px;color:var(--dim)}
.stat.up b{color:#5bd39a}.stat.bad b{color:#ff8d6a}
/* sections */
section{display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;min-height:0}
.now{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:0;border-radius:16px;padding:14px 20px;display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:4px 20px;align-items:center;justify-items:start;text-align:left;color:#fff;font:inherit;cursor:pointer;min-width:0;background:var(--bad)}
.card .nm{grid-column:1;grid-row:1;font-size:clamp(22px,3vh,28px);letter-spacing:-.02em;line-height:1}
.card .what{grid-column:1;grid-row:2;font-size:clamp(17px,2.2vh,20px);line-height:1.25;color:rgba(255,255,255,.92);font-weight:800;justify-self:stretch}
.card .k{grid-column:2;grid-row:1/3;text-align:right;white-space:nowrap;justify-self:end}
.card .k b{display:block;font-size:clamp(40px,6vh,64px);letter-spacing:-.06em;line-height:.9}
.card .k span{font-size:16px;text-transform:uppercase;letter-spacing:.5px;opacity:.9}
.card .go{grid-column:1/-1;grid-row:3;margin-top:6px;font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:var(--lime)}
.watch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card.watch{background:var(--warn)}
.card.watch .nm{font-size:clamp(20px,2.6vh,24px)}
.card.watch .k b{font-size:clamp(30px,4.2vh,42px)}.card.watch .what{font-size:17px}.card .what .thr{display:inline-flex;margin:6px 0 0;padding:4px 10px}
/* the fine field: same because it is the same */
.fine{background:none;border-radius:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:10px;min-height:0}
.chip{display:grid;grid-template-columns:minmax(0,1fr) max-content;grid-template-rows:auto auto;align-items:baseline;column-gap:8px;row-gap:2px;background:var(--ok);border-radius:16px;padding:8px 14px 10px;min-width:0;min-height:0;overflow:hidden;align-content:center}
.chip .nm{font-size:clamp(18px,2.4vh,20px);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.chip .nm small{display:none}
.thr{grid-column:1/-1;display:flex;align-items:baseline;gap:5px;background:rgba(0,0,0,.42);border-radius:10px;padding:5px 10px;margin-top:3px;white-space:nowrap;min-width:0;overflow:hidden}
.thr b{font-size:clamp(19px,2.6vh,22px);letter-spacing:-.03em;color:#fff}
.thr em{font-style:normal;font-size:14px;color:rgba(255,255,255,.7);margin-right:12px}
.thr em:last-child{margin-right:0}
.chip .p{font-size:clamp(21px,2.8vh,24px);letter-spacing:-.04em;white-space:nowrap;color:#fff}
.chip .p.down{color:#ffd9cc}
@media(orientation:portrait){
  .band{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto auto;row-gap:6px}
  .when{grid-column:1/-1}.stat{border-left:0;padding-left:0}
  .now{grid-template-columns:1fr}
  .watch{grid-template-columns:1fr}
  .card.watch .go{display:none}
  .fine{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.chip{padding:6px 10px 8px;border-radius:12px}.chip .nm{font-size:18px}.chip .p{font-size:22px}.thr{padding:3px 8px;margin-top:2px}.thr b{font-size:18px}.thr em{font-size:13px;margin-right:8px}
  .card{padding:10px 16px;gap:2px 14px}.card .nm{font-size:24px}.card .k b{font-size:44px}.card .go{margin-top:2px;font-size:15px}
  .card.watch{padding:8px 16px}.card.watch .nm{font-size:22px}.card.watch .k b{font-size:34px}.card .what .thr{margin-top:2px}
}
@media(max-width:600px){body{height:auto;overflow:auto}.fine{grid-template-columns:1fr 1fr}.chip{min-height:48px}}
</style></head>
<body>
  <header class="band">
    <div class="where">LAB37 <span>ALL STORES</span></div>
    <div class="when">THU 12:18 · PEAK 12:30–12:50</div>
    <div class="stat"><b id="fleetPace">3,930</b><span>ORDERS / HR</span></div>
    <div class="stat up"><b id="fleetPct">+3%</b><span>VS PLAN</span></div>
    <div class="stat"><b id="toGo">3,180</b><span>TO GO</span></div>
    <div class="stat bad"><b id="needCount">2</b><span>NEED YOU</span></div>
  </header>

  <section>
    <h2><i></i>Needs you now</h2>
    <div class="now" id="now"></div>
  </section>

  <section>
    <h2 class="h-watch"><i></i>Watch · <b id="watchCount"></b> stores</h2>
    <div class="watch" id="watch"></div>
  </section>

  <section>
    <h2 class="h-fine"><i></i><b id="fineCount"></b> stores on plan · <b>% vs plan</b></h2>
    <div class="fine" id="fine"></div>
  </section>
<script>
/* 20 machines, one per store. p = bowls per 10 min now. e = plan for this store at this hour. */
const S=[
 {n:'Uptown',c:'Bowls',s:'now',what:'Quinoa under-dispensing · line held 12:16',k:7,l:'orders rerouting',go:'Reroute is ready on the store panel',href:'lunch-rush-hoppers.html',p:0,e:30},
 {n:'Airport T2',c:'Tacos',s:'now',what:'Door interlock open · line stopped',k:3,l:'orders waiting',go:'Crew has been paged · 2 min',p:0,e:52},
 {n:'Midtown',c:'Bowls',s:'watch',what:'Cleaning · back 12:24',k:6,l:'min left',p:0,e:30},
 {n:'Stadium',c:'Burgers',s:'watch',what:'Patties low · refill 12:33',k:-20,l:'% vs plan',p:44,e:55},
 {n:'Campus North',c:'Salads',s:'watch',what:'Greens low · refill 12:29',k:-17,l:'% vs plan',p:20,e:24},
 {n:'Harbor',i:'Refill 12:41',c:'Bowls',p:36,e:30},{n:'Old Town',i:'12 in queue',c:'Tacos',p:58,e:52},{n:'Riverside',i:'Greens 12:38',c:'Salads',p:27,e:24},{n:'Tech Park',i:'9 in queue',c:'Bowls',p:33,e:30},{n:'Westgate',i:'Peak in 12 min',c:'Burgers',p:59,e:55},
 {n:'Union Sq',i:'Refill 12:44',c:'Bowls',p:32,e:30},{n:'Lakeside',i:'6 in queue',c:'Salads',p:25,e:24},{n:'Eastside',i:'11 in queue',c:'Tacos',p:54,e:52},{n:'Civic',i:'On plan all day',c:'Bowls',p:30,e:30},{n:'Southpoint',i:'Cleaning 1:10',c:'Burgers',p:55,e:55},
 {n:'Hillcrest',i:'Dressing 12:35',c:'Salads',p:23,e:24},{n:'Marina',i:'Rice 12:36',c:'Bowls',p:29,e:30},{n:'Downtown',i:'Catching up',c:'Tacos',p:49,e:52},{n:'Parkway',i:'8 in queue',c:'Bowls',p:31,e:30},{n:'Northgate',i:'Patties 12:30',c:'Burgers',p:50,e:55},
];
const pct=x=>Math.round((x.p-x.e)/x.e*100);
function render(){
  const now=S.filter(x=>x.s==='now'), watch=S.filter(x=>x.s==='watch'), fine=S.filter(x=>!x.s).sort((a,b)=>pct(a)-pct(b));
  document.getElementById('now').innerHTML=now.map(x=>`<button class="card" ${x.href?`onclick="location.href='${x.href}'"`:''}>
    <div class="nm">${x.n}</div><div class="what">${x.what}</div>
    <div class="k"><b>${x.k}</b><span>${x.l}</span></div>
    <div class="go">${x.go} →</div></button>`).join('');
  document.getElementById('watch').innerHTML=watch.map(x=>`<button class="card watch">
    <div class="nm">${x.n}</div><div class="what">${x.what}${x.p?`<span class="thr"><b>${x.p*6}</b><em>/hr</em><b>:${Math.round(600/x.p)}</b><em>ea</em></span>`:''}</div>
    <div class="k"><b>${x.l.includes('vs plan')?(x.k>0?'+':'')+x.k+'%':x.k}</b><span>${x.l.replace('% ','')}</span></div></button>`).join('');
  document.getElementById('fine').innerHTML=fine.map(x=>{const d=pct(x);const hr=x.p*6, sec=Math.round(3600/hr);return `<div class="chip" title="${x.i}"><span class="nm">${x.n} <small>${x.c}</small></span><span class="p ${d<0?'down':''}">${d>0?'+':''}${d}%</span><span class="thr"><b>${hr}</b><em>/hr</em><b>:${sec}</b><em>ea</em></span></div>`;}).join('');
  document.getElementById('needCount').textContent=now.length;
  document.getElementById('watchCount').textContent=watch.length;
  document.getElementById('fineCount').textContent=fine.length;
  const run=S.filter(x=>x.p>0);const P=run.reduce((a,x)=>a+x.p,0),E=run.reduce((a,x)=>a+x.e,0);document.getElementById('fleetPace').textContent=(P*6).toLocaleString();const fp=Math.round((P-E)/E*100);const el=document.getElementById('fleetPct');el.textContent=(fp>0?'+':'')+fp+'%';el.parentElement.className='stat '+(fp>=0?'up':'bad');
}
render();
</script>
</body></html>
