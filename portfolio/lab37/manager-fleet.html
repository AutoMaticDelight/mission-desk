<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab37 - Manager · Fleet</title>
<style>
/* MANAGER PANEL. 20 machines, one iPad, no scroll. Problems sort to the top-left. Color is the state, one number per machine. Tap a machine to open its panel. */
:root{--bg:#0b120e;--panel:#17231c;--track:#3d4a42;--line:#2c3a31;--ink:#fff;--dim:#c7d1ca;--ok:#1fa36a;--low:#f0a000;--now:#e5401a;--held:#6b7a70;--lime:#cfff3e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:800;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px;padding:16px;height:100vh;overflow:hidden;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
b{font-weight:950}
.band{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto auto;gap:18px;align-items:center;background:var(--panel);border-radius:18px;padding:10px 22px;min-height:64px;min-width:0;overflow:hidden}
.band>*{min-width:0}
.where{font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em;white-space:nowrap}.where span{color:var(--lime);margin-left:10px}
.when{font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:flex;align-items:baseline;gap:8px;white-space:nowrap;border-left:2px solid var(--line);padding-left:18px}
.stat b{font-size:clamp(30px,3.2vw,42px);letter-spacing:-.06em;line-height:.9}
.stat span{font-size:17px;letter-spacing:.5px;color:var(--dim)}
.stat.bad b{color:#ff8d6a}.stat.warn b{color:var(--low)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:12px;min-height:0}
/* Tile ground is the state. Running = green. Held = red. Cleaning = amber. Nothing else on the tile carries color except the delta. */
.m{position:relative;overflow:hidden;border-radius:16px;padding:12px 14px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;min-height:0;border:0;color:#fff;font:inherit;text-align:left;cursor:pointer;background:#0f5a3a}
.m.held{background:#8a2410;animation:pulse 1.6s ease-in-out infinite}
.m.clean{background:#7a5200}
.m.off{background:#2c3a31;color:var(--dim)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(229,64,26,.35)}}
.m .top{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;min-width:0}
.m .nm{font-size:clamp(19px,2.6vh,24px);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .st{font-size:15px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;line-height:1;opacity:.9}
.m.run .st{display:none}
.m .k{display:flex;align-items:baseline;gap:8px;align-self:center;flex-wrap:wrap;min-width:0}
.m .k b{font-size:clamp(34px,5.2vh,56px);letter-spacing:-.06em;line-height:.9}
.m .k span{font-size:16px;letter-spacing:.4px;text-transform:uppercase;opacity:.85}
.m .d{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:17px;letter-spacing:.2px;background:rgba(0,0,0,.28);color:#fff;white-space:nowrap;justify-self:start}
.m .d.up{color:var(--lime)}.m .d.down{color:#ffb39e}
.m .why{font-size:16px;line-height:1.2;opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.m .foot{display:grid;gap:6px}
@media(orientation:portrait){
  .band{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;row-gap:6px}
  .when{grid-column:1/-1}.stat{border-left:0;padding-left:0}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr))}
  .m{padding:10px 12px;gap:4px}.m .k b{font-size:clamp(30px,4vh,44px)}.m .d{font-size:15px;padding:3px 8px}
}
@media(max-width:600px){body{height:auto;overflow:auto}.grid{grid-template-columns:1fr 1fr;grid-template-rows:auto}.m{min-height:120px}}
</style></head>
<body>
  <header class="band">
    <div class="where">UPTOWN <span>ALL MACHINES</span></div>
    <div class="when">THU 12:18 · PEAK 12:30–12:50</div>
    <div class="stat" id="sRun"><b>17</b><span>RUNNING</span></div>
    <div class="stat bad" id="sHeld"><b>2</b><span>HELD</span></div>
    <div class="stat warn" id="sClean"><b>1</b><span>CLEANING</span></div>
    <div class="stat"><b id="sBowls">612</b><span>BOWLS / 10 MIN</span></div>
  </header>
  <main class="grid" id="grid"></main>
<script>
/* 20 machines. s: run | held | clean | off. k: the one number. h: hopper health (chicken, rice, beef) as % */
const M=[
 {n:'Bowl 02',s:'held',k:7,l:'rerouting',why:'Quinoa under-dispensing · held 12:16',p:0,e:30,href:'lunch-rush-hoppers.html'},
 {n:'Bowl 11',s:'held',k:3,l:'waiting',why:'Door interlock open · needs a hand',p:0,e:30},
 {n:'Bowl 07',s:'clean',k:6,l:'min left',why:'Sanitation cycle · back 12:24',p:0,e:30},
 {n:'Bowl 01',s:'run',q:14,why:'',p:34,e:30},
 {n:'Chicken 2',s:'run',q:8,why:'Taking the Bowl 02 reroute · 12 slots open',p:38,e:34},
 {n:'Bowl 03',s:'run',q:9,why:'',p:31,e:30},
 {n:'Bowl 04',s:'run',q:11,why:'Beef low · refill 12:31',p:27,e:30},
 {n:'Bowl 05',s:'run',q:8,why:'',p:33,e:30},
 {n:'Bowl 06',s:'run',q:13,why:'',p:29,e:30},
 {n:'Bowl 08',s:'run',q:10,why:'Rice low · refill 12:29',p:25,e:30},
 {n:'Bowl 09',s:'run',q:7,why:'',p:32,e:30},
 {n:'Bowl 10',s:'run',q:15,why:'',p:36,e:30},
 {n:'Bowl 12',s:'run',q:6,why:'',p:30,e:30},
 {n:'Bowl 13',s:'run',q:12,why:'',p:28,e:30},
 {n:'Bowl 14',s:'run',q:9,why:'',p:31,e:30},
 {n:'Bowl 15',s:'run',q:11,why:'',p:30,e:30},
 {n:'Bowl 16',s:'run',q:8,why:'Chicken low · refill 12:33',p:24,e:30},
 {n:'Bowl 17',s:'run',q:10,why:'',p:35,e:30},
 {n:'Bowl 18',s:'run',q:13,why:'',p:29,e:30},
 {n:'Bowl 19',s:'run',q:5,why:'',p:33,e:30},
];
const ST={run:'Running',held:'Held',clean:'Cleaning',off:'Off'};
const order={held:0,clean:1,run:2,off:3};
function delta(m){const d=m.p-m.e;const c=d>0?'up':d<0?'down':'';const t=(d>0?'+':'')+d+' vs expected';return `<span class="d ${c}">${d>0?'▲':d<0?'▼':'●'} ${t}</span>`;}
function render(){
  const list=[...M].sort((a,b)=>order[a.s]-order[b.s]||(a.s==='run'?(b.p-b.e)-(a.p-a.e):0));
  document.getElementById('grid').innerHTML=list.map(m=>`<button class="m ${m.s}" ${m.href?`onclick="location.href='${m.href}'"`:''}>
    <div class="top"><span class="nm">${m.n}</span><span class="st">${ST[m.s]}</span></div>
    ${m.s==='run'?`<div class="k"><b>${m.p}</b><span>/ 10 min</span></div>`:`<div class="k"><b>${m.k}</b><span>${m.l}</span></div>`}
    <div class="foot">${m.s==='run'?delta(m):''}<div class="why">${m.s==='run'?[m.q+' in queue',m.why].filter(Boolean).join(' · '):m.why}</div></div>
  </button>`).join('');
  const c=s=>M.filter(m=>m.s===s).length;
  sRun.querySelector('b').textContent=c('run');sHeld.querySelector('b').textContent=c('held');sClean.querySelector('b').textContent=c('clean');
  const tot=M.reduce((a,m)=>a+m.p,0);document.getElementById('sBowls').textContent=tot;
}
render();
</script>
</body></html>
