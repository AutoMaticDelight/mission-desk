<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baba Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --surface-2:#eeeeeb; --surface-3:#e6e6e2;
  --ink:#15171b; --ink-2:#585f6a; --ink-3:#8a909a;
  --line:rgba(21,23,27,.09); --line-2:rgba(21,23,27,.16);
  --blue:#0b5fd7; --blue-2:#0a4fb3; --blue-bg:#e7effc;
  --green:#187744; --green-bg:#e3f3e9;
  --orange:#b2600a; --orange-bg:#fbeddb;
  --red:#c02e3c; --red-bg:#fbe6e8;
  --num:'Manrope',-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --body:'Instrument Sans',-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --rail:232px; --drawer:440px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-family:var(--num);font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}
b,strong{font-weight:700}
::selection{background:var(--blue-bg)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--line);background:#fbfbfa;padding:22px 14px 18px;display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;font:800 18px/1 var(--num);letter-spacing:-.03em}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800}
.brand small{display:block;font:500 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.nav{display:grid;gap:2px}
.nav a{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--ink-2);text-decoration:none}
.nav a .k{font:700 12px var(--num);color:var(--ink-3)}
.nav a .t{font-weight:600;font-size:14px;color:var(--ink);line-height:1.2}
.nav a .s{display:block;font-size:12px;color:var(--ink-3);font-weight:400;margin-top:2px}
.nav a .c{font:700 12px var(--num);color:var(--ink-3);background:var(--surface-2);padding:3px 8px;border-radius:99px;min-width:28px;text-align:center}
.nav a:hover{background:#fff}
.nav a.active{background:#fff;box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(21,23,27,.05)}
.nav a.active .k{color:var(--blue)}
.nav a.attn .c{background:var(--blue-bg);color:var(--blue)}
.rail-foot{margin-top:auto;display:grid;gap:10px;font-size:12px;color:var(--ink-3);padding:0 8px}
.rail-foot .who{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px}
.rail-foot .who i{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font:700 11px var(--num);color:var(--ink-2);font-style:normal}
.rail-foot kbd{font:600 11px var(--num);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;color:var(--ink-2);background:#fff}
.rail-foot button{border:0;background:none;padding:0;color:var(--ink-3);text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.main{min-width:0}
.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 40px;border-bottom:1px solid var(--line);background:rgba(246,246,244,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumb{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;width:300px;max-width:40vw;height:36px;border:1px solid var(--line-2);border-radius:9px;padding:0 10px;background:#fff;color:var(--ink-3);font-size:13px;cursor:text}
.search svg{flex:none} .search>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.search kbd{margin-left:auto;font:600 11px var(--num);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.page{padding:34px 40px 100px;max-width:1260px}

/* ---------- buttons ---------- */
.btn{font:600 14px var(--body);height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-2);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-2);border-color:var(--blue-2)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:#fff;border-color:var(--line-2)}
.btn.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.btn[disabled]{opacity:.5;cursor:default}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip-good{background:var(--green-bg);color:var(--green)}
.chip-blue{background:var(--blue-bg);color:var(--blue)}
.chip-warn{background:var(--orange-bg);color:var(--orange)}
.chip-bad{background:var(--red-bg);color:var(--red)}
.chip-neutral{background:var(--surface-2);color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- layer A: hero ---------- */
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .sep{color:var(--line-2)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:44px;align-items:start;padding-bottom:36px;border-bottom:1px solid var(--line)}
.hero h1{font:700 38px/1.05 var(--num);letter-spacing:-.025em;margin:0 0 10px;text-wrap:balance}
.hero h1 .tk{font-weight:600;color:var(--ink-3);font-size:20px;margin-left:10px;letter-spacing:0;vertical-align:middle}
.meta{color:var(--ink-2);font-size:14px;display:flex;gap:6px 16px;flex-wrap:wrap}
.thesis{font-size:18px;line-height:1.45;max-width:58ch;margin:18px 0 28px;color:var(--ink);font-weight:500}
.pairs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.changed{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:baseline;font-size:14px;color:var(--ink-2)}
.changed .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.changed b{color:var(--ink);font-weight:600}
.changed em{font-style:normal;color:var(--ink-3);white-space:nowrap}
.pairs.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pair{min-width:0;overflow:hidden}
.pair-label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);line-height:1.3;min-height:2.6em;display:flex;align-items:flex-end}
.pair-vals{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;margin-top:8px}
.pair-vals>*{white-space:nowrap}
.pair-main{font:700 clamp(24px,2.1vw,32px)/1 var(--num);letter-spacing:-.03em;font-feature-settings:"tnum" 1}
.pair-comp{font:500 14px var(--num);color:var(--ink-3);font-feature-settings:"tnum" 1}
.pair-track{position:relative;height:4px;background:var(--surface-3);border-radius:2px;margin-top:12px}
.pair-track i{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:var(--ink);max-width:100%}
.pair-track em{position:absolute;top:-4px;width:2px;height:12px;background:var(--ink-3);margin-left:-1px;border-radius:1px}
.pair-note{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.35;overflow-wrap:anywhere}
.tone-good .pair-main,.tone-good .pair-note{color:var(--green)} .tone-good .pair-track i{background:var(--green)}
.tone-warn .pair-main,.tone-warn .pair-note{color:var(--orange)} .tone-warn .pair-track i{background:var(--orange)}
.tone-bad .pair-main,.tone-bad .pair-note{color:var(--red)} .tone-bad .pair-track i{background:var(--red)}
.tone-blue .pair-main,.tone-blue .pair-note{color:var(--blue)} .tone-blue .pair-track i{background:var(--blue)}

.decide{border-radius:16px;padding:20px 20px 18px;background:var(--blue);color:#fff;display:grid;gap:12px;box-shadow:0 12px 30px rgba(11,95,215,.18)}
.decide.warn{background:var(--orange);box-shadow:0 12px 30px rgba(178,96,10,.18)}
.decide.good{background:var(--green);box-shadow:0 12px 30px rgba(24,119,68,.18)}
.decide.bad{background:var(--red);box-shadow:0 12px 30px rgba(192,46,60,.18)}
.decide.neutral{background:#fff;color:var(--ink);border:1px solid var(--line-2);box-shadow:none}
.decide-eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.82;font-weight:600}
.decide-verb{font:800 42px/1 var(--num);letter-spacing:-.03em}
.decide-sub{font-size:15px;opacity:.92;margin-top:-6px;line-height:1.4}
.decide .btn-fill{height:48px;border-radius:11px;background:#fff;border:0;color:var(--ink);font-weight:700;font-size:15px;width:100%}
.decide.neutral .btn-fill{background:var(--ink);color:#fff}
.decide .btn-fill:hover{background:#f2f2ef}
.decide.neutral .btn-fill:hover{background:#2a2d33}
.decide-why{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:8px;font-size:14px;line-height:1.35}
.decide-why li{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:start}
.decide-why li::before{content:"✓";font-weight:800;opacity:.9}
.decide-why li.x::before{content:"×";opacity:.7}
.decide-alt{display:flex;gap:8px;border-top:1px solid rgba(255,255,255,.28);padding-top:14px}
.decide.neutral .decide-alt{border-top-color:var(--line)}
.decide-alt button{flex:1;background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;height:36px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer}
.decide-alt button:hover{background:rgba(255,255,255,.14)}
.decide.neutral .decide-alt button{border-color:var(--line-2);color:var(--ink)}
.decide.neutral .decide-alt button:hover{background:var(--surface-2)}

/* ---------- layer B: scan ---------- */
.section{margin-top:36px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font:700 20px/1.2 var(--num);letter-spacing:-.015em;margin:0}
.section-head span{font-size:13px;color:var(--ink-3)}
.rows{border-top:1px solid var(--line)}
.rowhead,.row{display:grid;gap:16px;align-items:center}
.rowhead{padding:9px 12px 9px 14px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--line)}
.row{padding:14px 12px 14px 12px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2px solid transparent;transition:background .12s}
.row:hover{background:#fff}
.row.selected{background:#fff;border-left-color:var(--blue)}
.row.done{opacity:.55}
.rank{font:700 18px var(--num);color:var(--ink-3);text-align:center}
.row.selected .rank{color:var(--blue)}
.who{min-width:0}
.who b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{white-space:nowrap;min-width:0}
.mini b{font:700 18px var(--num);letter-spacing:-.02em;font-feature-settings:"tnum" 1}
.mini span{font:500 13px var(--num);color:var(--ink-3);margin-left:4px}
.mini.good b{color:var(--green)} .mini.warn b{color:var(--orange)} .mini.bad b{color:var(--red)} .mini.blue b{color:var(--blue)}
.mini .bar{position:relative;height:3px;background:var(--surface-3);border-radius:2px;margin-top:6px;width:88px}
.mini .bar i{position:absolute;left:0;top:0;height:100%;background:var(--ink);border-radius:2px;max-width:100%}
.mini .bar em{position:absolute;top:-3px;width:2px;height:9px;background:var(--ink-3);margin-left:-1px}
.mini.good .bar i{background:var(--green)} .mini.warn .bar i{background:var(--orange)} .mini.bad .bar i{background:var(--red)} .mini.blue .bar i{background:var(--blue)}
.cols-u{grid-template-columns:32px minmax(200px,1.5fr) minmax(96px,.7fr) minmax(96px,.7fr) minmax(96px,.7fr) 104px 96px}
.cols-p{grid-template-columns:32px minmax(200px,1.5fr) minmax(96px,.7fr) minmax(96px,.7fr) minmax(96px,.7fr) 104px 96px}
.cols-a{grid-template-columns:32px minmax(200px,1.5fr) minmax(96px,.7fr) minmax(96px,.7fr) minmax(96px,.7fr) 118px 110px}
.cols-b{grid-template-columns:32px minmax(200px,1.5fr) minmax(96px,.7fr) minmax(96px,.7fr) minmax(96px,.7fr) 118px 96px}
.cols-f{grid-template-columns:32px minmax(200px,1.5fr) minmax(96px,.7fr) minmax(96px,.7fr) minmax(96px,.7fr) 104px 96px}
.rowact{text-align:right}

.change{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:22px 24px;background:#fff;border:1px solid var(--line-2);border-radius:14px}
.change.done{border-style:dashed}
.change-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.fromto{font:700 30px/1 var(--num);letter-spacing:-.03em;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.fromto .from{color:var(--ink-3);font-weight:600;font-size:24px}
.fromto .arrow{color:var(--ink-3);font-weight:500;font-size:22px}
.fromto .delta{font-size:16px;color:var(--green);font-weight:700}
.change p{margin:10px 0 0;color:var(--ink-2);font-size:14px;max-width:62ch}
.change-side{display:grid;gap:10px;justify-items:end;text-align:right}
.change-side .impact{font:700 22px/1 var(--num);letter-spacing:-.02em}
.change-side .impact small{display:block;font:500 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.change-side .acts{display:flex;gap:8px}
.list{display:grid;gap:0;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.li b{font-weight:600;font-size:15px;display:block}
.li span{font-size:13px;color:var(--ink-2);display:block}
.li .r{display:flex;align-items:center;gap:12px;white-space:nowrap}
.li .r .v{font:700 17px var(--num);letter-spacing:-.02em}
.li .r .v small{font:500 13px var(--num);color:var(--ink-3);margin-left:4px}
.triggers{display:grid;gap:0;border-top:1px solid var(--line)}
.trig{display:grid;grid-template-columns:24px minmax(0,1fr) 200px 96px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.trig .st{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.trig .st.met{background:var(--green-bg);color:var(--green)} .trig .st.no{background:var(--surface-2);color:var(--ink-3)}
.trig b{display:block;font-weight:600} .trig span{font-size:13px;color:var(--ink-2)}
.trig .tv{font:700 18px var(--num);letter-spacing:-.02em;white-space:nowrap} .trig .tv small{font:500 13px var(--num);color:var(--ink-3);margin-left:6px}
.trig .bar{position:relative;height:4px;background:var(--surface-3);border-radius:2px;margin-top:6px}
.trig .bar i{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:var(--ink);max-width:100%}
.trig .bar em{position:absolute;top:-4px;width:2px;height:12px;background:var(--ink-3);margin-left:-1px}
.trig.met .bar i{background:var(--green)}
.trig .tag{text-align:right}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.checks{border-top:1px solid var(--line)}
.check{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.check .conf{font:700 22px/1 var(--num);letter-spacing:-.02em}
.check .conf.good{color:var(--green)} .check .conf.warn{color:var(--orange)} .check .conf.bad{color:var(--red)}
.check b{display:block;font-weight:600} .check span{font-size:13px;color:var(--ink-2)}
.scen{width:100%;border-collapse:collapse;font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}
.scen th,.scen td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.scen th:first-child,.scen td:first-child{text-align:left;padding-left:0}
.scen th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.scen td{font-family:var(--num);font-weight:600;font-size:15px}
.scen td.lead{font-weight:700;font-size:17px}
.scen td.good{color:var(--green)} .scen td.bad{color:var(--red)} .scen td.q{color:var(--ink-3);font-weight:500}
.scen td:first-child{font-family:var(--body);font-weight:600}
.scen .sub td:first-child{color:var(--ink-2);font-weight:400}

/* ---------- layer C: detail ---------- */
.detail{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;margin-top:44px;padding-top:26px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.detail.three{grid-template-columns:1fr 1fr 1fr}
.detail h3{font:600 12px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
.detail ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.detail li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:baseline}
.detail li em{font-style:normal;color:var(--ink-3);font-size:12.5px;text-align:right;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-family:var(--num);font-feature-settings:"tnum" 1}
.detail li .src{color:var(--ink-3);display:block;font-size:13px}
.detail p{margin:0 0 10px;line-height:1.55}
.detail .fresh{color:var(--green)} .detail .stale{color:var(--orange)}
.detail table{width:100%;border-collapse:collapse;font-feature-settings:"tnum" 1;font-variant-numeric:tabular-nums}
.detail th,.detail td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--num)}
.detail th:first-child,.detail td:first-child{text-align:left;padding-left:0;font-family:var(--body)}
.detail th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.detail td{color:var(--ink);font-weight:500;font-size:14px}
.detail td.lead{font-weight:700}
.detail td.good{color:var(--green)} .detail td.bad{color:var(--red)}
.detail .sub td{color:var(--ink-2);font-weight:400}
.detail .sub td:first-child{padding-left:12px}
.detail .tblwrap{overflow-x:auto}
.detail .more{margin-top:12px}
.hint{font-size:13px;color:var(--ink-3);margin-top:16px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(21,23,27,.16);opacity:0;pointer-events:none;transition:opacity .2s;z-index:19}
.scrim.show{opacity:1;pointer-events:auto}

.drawer ul.ev a{color:var(--blue);text-decoration:none;font-weight:600}

/* ---------- derived decisions ---------- */
function uDecide(c){
  const r=RULES.universe;
  if(c.status==='promoted') return {k:'promoted',label:'Promoted',chip:'chip-blue',verb:'Promoted',sub:'now in Prospect',tone:'neutral'};
  if(c.status==='held') return {k:'hold',label:'Hold',chip:'chip-neutral',verb:'Hold',sub:'re-screen next Monday',tone:'neutral'};
  if(c.status==='killed') return {k:'kill',label:'Killed',chip:'chip-bad',verb:'Killed',sub:'out of this cycle',tone:'neutral'};
  const s=c.score>=r.bar, v=c.cov>=r.covReq, t=c.cat<=r.window;
  if(s&&v&&t) return {k:'promote',label:'Promote',chip:'chip-good',verb:'Promote',sub:'to Prospect · start the 16-hour time box',tone:'blue'};
  if(s&&!v) return {k:'fixdata',label:'Fix data',chip:'chip-warn',verb:'Fix data',sub:'coverage is short; refresh before promoting',tone:'warn'};
  if(s&&!t) return {k:'hold',label:'Hold',chip:'chip-neutral',verb:'Hold',sub:'catalyst outside the 30-day window',tone:'neutral'};
  if(c.score>=r.bar-10) return {k:'hold',label:'Hold',chip:'chip-neutral',verb:'Hold',sub:'below the bar; keep in the screen',tone:'neutral'};
  return {k:'kill',label:'Kill',chip:'chip-bad',verb:'Kill',sub:'remove from this cycle',tone:'bad'};
}
function pDecide(p){
  const r=RULES.prospect, left=r.budget-p.hours;
  if(p.status==='advanced') return {k:'advanced',label:'Advanced',chip:'chip-blue',verb:'Advanced',sub:'now in Active Research',tone:'neutral'};
  if(p.status==='killed') return {k:'killed',label:'Killed',chip:'chip-bad',verb:'Killed',sub:'work preserved on the Bench',tone:'neutral'};
  const failed=p.checklist.some(c=>c.s==='failed');
  if(failed||(p.upside<r.hurdle&&left<=2)) return {k:'kill',label:'Kill',chip:'chip-bad',verb:'Kill',sub:'upside misses the hurdle with the budget spent',tone:'bad'};
  if(p.upside>=r.hurdle&&p.met>=r.criteria-1&&left<=6) return {k:'advance',label:'Advance',chip:'chip-good',verb:'Advance',sub:'to Active Research · carry the open proof as a question',tone:'blue'};
  return {k:'work',label:'Keep working',chip:'chip-neutral',verb:'Keep working',sub:left+'h left in the time box',tone:'neutral'};
}
function aDecide(a){
  if(a.pending&&a.pending.status==='proposed') return {k:'review',label:'Review change',chip:'chip-blue',verb:'Review',sub:'agent proposal: '+a.pending.field+' '+a.pending.pct+' · target +$'+(a.pending.targetTo-a.target),tone:'blue'};
  const stale=a.changes.some(c=>c.s==='due');
  if(stale&&a.reviewed.includes('d')) return {k:'refresh',label:'Refresh data',chip:'chip-warn',verb:'Refresh',sub:'a core source is stale; underwriting view is downgraded',tone:'warn'};
  return {k:'maintain',label:'Maintain',chip:'chip-good',verb:'Maintain',sub:'underwriting holds · target $'+a.target,tone:'neutral'};
}
function bDecide(b){
  const met=b.triggers.filter(t=>t.met).length, n=b.triggers.length;
  if(b.status==='reopened') return {k:'reopened',label:'Re-opened',chip:'chip-blue',verb:'Re-opened',sub:'now in Prospect',tone:'neutral'};
  if(b.status==='retired') return {k:'retired',label:'Retired',chip:'chip-neutral',verb:'Retired',sub:'archived',tone:'neutral'};
  if(met>=Math.ceil(n*0.6)) return {k:'reopen',label:'Re-open',chip:'chip-good',verb:'Re-open',sub:met+' of '+n+' triggers met · send back to Prospect',tone:'blue'};
  if(b.days>=180&&met===0) return {k:'retire',label:'Retire',chip:'chip-neutral',verb:'Retire',sub:b.days+' days benched, no trigger moving',tone:'neutral'};
  return {k:'stay',label:'Stay benched',chip:'chip-neutral',verb:'Stay benched',sub:met+' of '+n+' triggers met · agent keeps watching',tone:'neutral'};
}
function fDecide(f){
  if(f.status) return {k:'recorded',label:f.status,chip:'chip-blue',verb:f.status,sub:'recorded today',tone:'neutral'};
  if(f.weight>f.max) return {k:'trim',label:'Trim',chip:'chip-warn',verb:'Trim',sub:'to '+(f.max-0.5).toFixed(1)+'% · weight is over the '+f.max.toFixed(1)+'% cap',tone:'warn'};
  if(f.health<f.line) return {k:'trim',label:'Trim',chip:'chip-bad',verb:'Trim',sub:'thesis health is under the '+f.line+' trim line',tone:'bad'};
  if(f.up>=15&&f.health>=80&&f.weight<=f.max-1.5) return {k:'add',label:'Add',chip:'chip-good',verb:'Add',sub:'to '+(f.weight+1).toFixed(1)+'% · upside and health both clear',tone:'good'};
  if(f.health-f.line<=3||f.up<8) return {k:'hold',label:'Hold · watch',chip:'chip-neutral',verb:'Hold',sub:'watch: health near the trim line, upside thin',tone:'neutral'};
  return {k:'hold',label:'Hold',chip:'chip-neutral',verb:'Hold',sub:'inside sizing limits; nothing has changed',tone:'neutral'};
}
const URGENCY={review:0,refresh:1,trim:0,add:1,reopen:0,retire:2,advance:0,kill:1,promote:0,fixdata:1,work:2,hold:3,stay:3,maintain:3,promoted:9,advanced:9,killed:9,reopened:9,retired:9,recorded:9};

/* ---------- components ---------- */
function pair(o){
  const tone=o.tone?' tone-'+o.tone:'';
  const track=o.pct!=null?`<div class="pair-track"><i style="width:${Math.max(0,Math.min(100,o.pct))}%"></i>${o.mark!=null?`<em style="left:${Math.max(0,Math.min(100,o.mark))}%"></em>`:''}</div>`:'';
  return `<div class="pair${tone}"><div class="pair-label">${o.label}</div><div class="pair-vals"><b class="pair-main">${o.value}</b><span class="pair-comp">${o.comp||''}</span></div>${track}<div class="pair-note">${o.note||''}</div></div>`;
}
function mini(v,comp,tone,pct,mark){
  const t=tone?' '+tone:'';
  const bar=pct!=null?`<div class="bar"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i>${mark!=null?`<em style="left:${mark}%"></em>`:''}</div>`:'';
  return `<div class="mini${t}"><b>${v}</b>${comp?`<span>${comp}</span>`:''}${bar}</div>`;
}
function decidePanel(o){
  const alts=(o.alts||[]).map(a=>`<button type="button" data-action="${a.action}" data-id="${o.id}" ${a.arg?`data-arg="${a.arg}"`:''}>${a.label}</button>`).join('');
  const why=(o.why||[]).map(w=>`<li${w.startsWith('!')?' class="x"':''}>${w.replace(/^!/,'')}</li>`).join('');
  return `<aside class="decide ${o.tone||'blue'}" data-layer="A" data-layer-label="A · Decision">
    <div class="decide-eyebrow">${o.eyebrow||'Decision · now'}</div>
    <div class="decide-verb">${o.verb}</div>
    <div class="decide-sub">${o.sub||''}</div>
    ${o.primary?`<button type="button" class="btn-fill" data-action="${o.primary.action}" data-id="${o.id}" ${o.primary.arg?`data-arg="${o.primary.arg}"`:''}>${o.primary.label}</button>`:''}
    ${why?`<ul class="decide-why">${why}</ul>`:''}
    ${alts?`<div class="decide-alt">${alts}</div>`:''}
  </aside>`;
}
function changed(x){return x.delta?`<div class="changed"><span class="k">Changed</span><span><b>${x.delta[0]}</b> <em>${x.delta[1]}</em></span></div>`:'';}
function chip(d){return `<span class="chip ${d.chip}">${d.label}</span>`;}
function pct(v,max){return Math.round(v/max*100);}
function money(n){return '$'+n.toFixed(2).replace(/\.00$/,'');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sortBy(list,dec){return [...list].sort((a,b)=>URGENCY[dec(a).k]-URGENCY[dec(b).k]);}
function selected(phase,list,dec){
  const id=ui.sel[phase];
  const found=id&&list.find(x=>x.id===id);
  return found||sortBy(list,dec)[0];
}

        ${pair({label:'Score vs bar',value:c.score,comp:'/ '+r.bar+' bar',tone:c.score>=r.bar?'good':'bad',pct:c.score,mark:r.bar,note:(c.score>=r.bar?'+':'')+(c.score-r.bar)+' vs bar'})}

        ${pair({label:'Catalyst vs window',value:c.cat+'d',comp:'/ '+r.window+'d',tone:c.cat<=r.window?'good':'warn',pct:Math.min(100,pct(c.cat,60)),mark:pct(r.window,60),note:c.catName})}

      <div class="rowhead cols-u"><div>#</div><div>Name · signal</div><div>Score / ${r.bar}</div><div>Coverage / ${r.covReq}%</div><div>Catalyst / ${r.window}d</div><div>Decision</div><div></div></div>
      ${list.map((x,i)=>{const dx=uDecide(x);return `<div class="row cols-u${x.id===c.id?' selected':''}${x.status?' done':''}" data-select="universe:${x.id}" tabindex="0">
        <div class="rank">${i+1}</div>
        <div class="who"><b>${x.name} <span style="display:inline;color:var(--ink-3);font-weight:500">${x.tk}</span></b><span>${x.sector} · ${x.signal}</span></div>
        <div class="minis">
          ${mini(x.score,'',x.score>=r.bar?'good':'bad',x.score,r.bar)}
          ${mini(x.cov+'%','',x.cov>=r.covReq?'':'warn',x.cov,r.covReq)}
          ${mini(x.cat+'d','',x.cat<=r.window?'':'warn',Math.min(100,pct(x.cat,60)),pct(r.window,60))}
        </div>
        ${chip(dx)}
        <div class="rowact">${x.status?'':dx.k==='promote'?`<button type="button" class="btn btn-sm btn-primary" data-action="promote" data-id="${x.id}">Promote</button>`:dx.k==='fixdata'?`<button type="button" class="btn btn-sm" data-action="refresh" data-id="${x.id}">Refresh</button>`:dx.k==='kill'?`<button type="button" class="btn btn-sm" data-action="kill" data-id="${x.id}">Kill</button>`:`<button type="button" class="btn btn-sm" data-action="hold" data-id="${x.id}">Hold</button>`}</div>
      </div>`;}).join('')}

  <section class="detail" data-layer="C" data-layer-label="C · Detail">
    <div><h3>Why ${c.name} ranks ${rank === 1 ? 'first' : '#'+rank}</h3><ul>${c.why.map(w=>`<li><span>${w}</span></li>`).join('')}</ul></div>
    <div><h3>Screen provenance</h3><ul>${c.sources.map(s=>`<li><span>${s[0]}</span><em class="${s[1]==='missing'?'stale':''}">${s[1]}</em></li>`).join('')}<li><span>Screen run</span><em>Sep 14 · 6:00 ET</em></li><li><span>Universe</span><em>Russell 2000 + internal</em></li><li><span>Scoring model v3.2</span><em>edge × freshness × readiness</em></li></ul></div>
  </section>`;
}

/* ---------- PROSPECT ---------- */
function renderProspect(){
  const r=RULES.prospect, list=sortBy(S.prospect,pDecide);
  if(!list.length) return empty('Prospect','No names in the time box. Promote one from the Universe.');
  const p=selected('prospect',list,pDecide), d=pDecide(p), left=r.budget-p.hours;
  const open=p.checklist.filter(c=>c.s!=='verified');
  const why=[
    `${p.upside>=r.hurdle?'':'!'}Upside ${p.upside}% ${p.upside>=r.hurdle?'clears':'misses'} the ${r.hurdle}% hurdle`,
    `${p.met>=r.criteria-1?'':'!'}${p.met} of ${r.criteria} criteria met`,
    `${left>0?'':'!'}${left}h left of the ${r.budget}h time box`,
    `${open.length?'!':''}${open.length?open.length+' open proof: '+open[0].t:'All proofs verified'}`];
  const primary = p.status?null: d.k==='advance'?{label:'Advance to Active Research',action:'advance'}: d.k==='kill'?{label:'Kill and bench the work',action:'pkill'}:{label:'Log work',action:'logwork'};
  const alts = p.status?[]: d.k==='advance'?[{label:'Kill',action:'pkill'},{label:'Extend 4h',action:'extend'}]: d.k==='kill'?[{label:'Extend 4h',action:'extend'},{label:'Advance anyway',action:'advance'}]:[{label:'Advance early',action:'advance'},{label:'Kill',action:'pkill'}];
  const proofTone=p.checklist.find(c=>c.s==='failed')?'bad':open.length?'warn':'good';
  return `
  <div class="eyebrow">Prospect <span class="sep">/</span> ${list.filter(x=>!x.status).length} names in the time box <span class="sep">/</span> Started ${p.started} · decision due ${p.due}</div>
  <section class="hero" data-layer="A" data-layer-label="A · Discover + act">
    <div>
      <h1>${p.name}<span class="tk">${p.tk}</span></h1>
      <div class="meta"><span>${p.sector}</span><span>${p.cap}</span><span>${p.px}</span><span>${p.hours}h of ${r.budget}h used</span></div>
      <p class="thesis">${p.thesis}</p>
      <div class="pairs">
        ${pair({label:'Upside vs hurdle',value:'+'+p.upside+'%',comp:'/ '+r.hurdle+'%',tone:p.upside>=r.hurdle?'good':'bad',pct:pct(p.upside,40),mark:pct(r.hurdle,40),note:(p.upside>=r.hurdle?'+':'')+(p.upside-r.hurdle)+' pts vs hurdle'})}
        ${pair({label:'Time spent vs budget',value:p.hours+'h',comp:'/ '+r.budget+'h',tone:left<=2?'warn':'',pct:pct(p.hours,r.budget),mark:100,note:left+'h left'})}
        ${pair({label:'Criteria met',value:p.met+'/'+r.criteria,comp:'need '+r.criteria,tone:p.met>=r.criteria?'good':p.met>=r.criteria-1?'':'warn',pct:pct(p.met,r.criteria),note:open.length+' open'})}
        ${pair({label:'Open proof',value:p.proof.now,comp:'vs '+p.proof.line,tone:proofTone,note:p.proof.t})}
      </div>
      ${changed(p)}
    </div>
    ${decidePanel({id:p.id,tone:d.tone,verb:d.verb,sub:d.sub,primary,why,alts})}
  </section>

  <section class="section" data-layer="B" data-layer-label="B · Scan">
    <div class="split">
      <div>
        <div class="section-head"><h2>What must be true</h2><span>confidence · status</span></div>
        <div class="checks">${p.checklist.map(c=>`<div class="check"><div class="conf ${c.conf>=75?'good':c.conf>=55?'warn':'bad'}">${c.conf}%</div><div><b>${c.t}</b><span>${c.n}</span></div>${c.s==='verified'?'<span class="chip chip-good">Verified</span>':c.s==='failed'?'<span class="chip chip-bad">Failed</span>':'<span class="chip chip-warn">Open</span>'}</div>`).join('')}</div>
      </div>
      <div>
        <div class="section-head"><h2>Disconfirming signals</h2><span>${p.disconfirming.length} open</span></div>
        <div class="list">${p.disconfirming.map(x=>`<div class="li"><div><b>${x[0]}</b><span>${x[1]}</span></div><div class="r"><span class="chip chip-warn">Resolve</span></div></div>`).join('')}</div>
        <div class="section-head" style="margin-top:28px"><h2>Time box</h2><span>${p.name}</span></div>
        <div class="list">${p.log.map(x=>`<div class="li"><div><b>${x[0]}</b></div><div class="r"><span style="font-size:13px;color:var(--ink-3)">${x[1]}</span></div></div>`).join('')}</div>
      </div>
    </div>
  </section>

  <section class="section" data-layer="B" data-layer-label="B · Scan">
    <div class="section-head"><h2>All prospects</h2><span>hurdle ${r.hurdle}% · budget ${r.budget}h</span></div>
    <div class="rows">
      <div class="rowhead cols-p"><div>#</div><div>Name</div><div>Upside / ${r.hurdle}%</div><div>Hours / ${r.budget}h</div><div>Criteria</div><div>Decision</div><div></div></div>
      ${list.map((x,i)=>{const dx=pDecide(x);const l=r.budget-x.hours;return `<div class="row cols-p${x.id===p.id?' selected':''}${x.status?' done':''}" data-select="prospect:${x.id}" tabindex="0">
        <div class="rank">${i+1}</div>
        <div class="who"><b>${x.name} <span style="display:inline;color:var(--ink-3);font-weight:500">${x.tk}</span></b><span>${x.sector} · due ${x.due}</span></div>
        <div class="minis">${mini('+'+x.upside+'%','',x.upside>=r.hurdle?'good':'bad',pct(x.upside,40),pct(r.hurdle,40))}${mini(x.hours+'h',l+'h left',l<=2?'warn':'',pct(x.hours,r.budget),100)}${mini(x.met+'/'+r.criteria,'',x.met>=r.criteria-1?'':'warn',pct(x.met,r.criteria))}</div>
        ${chip(dx)}
        <div class="rowact">${x.status?'':dx.k==='advance'?`<button type="button" class="btn btn-sm btn-primary" data-action="advance" data-id="${x.id}">Advance</button>`:dx.k==='kill'?`<button type="button" class="btn btn-sm" data-action="pkill" data-id="${x.id}">Kill</button>`:`<button type="button" class="btn btn-sm" data-action="logwork" data-id="${x.id}">Log work</button>`}</div>
      </div>`;}).join('')}
    </div>
  </section>

  <section class="detail" data-layer="C" data-layer-label="C · Detail">
    <div><h3>Open proof</h3><p><b style="color:var(--ink)">${p.proof.t}.</b>${QUESTIONS.find(x=>x.cid===p.id)?` <a href="#" data-action="openq" data-id="${QUESTIONS.find(x=>x.cid===p.id).id}" style="color:var(--blue);font-weight:600;text-decoration:none">See evidence ↗</a>`:''} Current ${p.proof.now} against a line of ${p.proof.line}. ${p.proof.note}.</p><p>Prospect stays time-boxed: at ${r.budget}h the name advances, is killed, or gets one explicit extension with a reason.</p></div>
    <div><h3>Evidence set</h3><ul><li><span>Channel checks</span><em>3 merchants · Sep 10</em></li><li><span>Cohort pull</span><em>Sep 12</em></li><li><span>Model bridge v2</span><em>Sep 12</em></li><li><span>Street estimates</span><em>FactSet · today</em></li></ul></div>
  </section>`;
}

/* ---------- ACTIVE RESEARCH ---------- */
function renderActive(){
  const list=sortBy(S.active,aDecide);
  if(!list.length) return empty('Active Research','No names under active research.');
  const a=selected('active',list,aDecide), d=aDecide(a);
  const up=(a.target/a.px-1)*100, pend=a.pending;
  const pendingUp=pend&&pend.status==='proposed'?(pend.targetTo/a.px-1)*100:null;
  const why=[
    `Target ${money(a.target)} vs ${money(a.px)}: +${up.toFixed(1)}% upside`,
    `FY27 margin ${a.margin}% vs ${a.street}% Street`,
    a.churn!=null?`${a.churn<a.churnLine?'':'!'}Churn ${a.churn}% vs ${a.churnLine}% break line`:`Catalyst in ${a.catDays} days`,
    pend&&pend.status==='proposed'?`!Agent proposal not yet canonical: ${pend.field} ${pend.pct}`:`${a.openQ} open questions · ${a.closedQ} closed`];
  const primary = d.k==='review'?{label:'Review proposed change',action:'openreview'}: d.k==='refresh'?{label:'Request source refresh',action:'request'}:{label:'Request agent update',action:'request'};
  const alts = d.k==='review'?[{label:'Accept',action:'accept'},{label:'Dismiss',action:'dismiss'}]:[{label:'Add note',action:'note'},{label:'Move to Bench',action:'tobench'}];
  return `
  <div class="eyebrow">Active Research <span class="sep">/</span> ${list.length} names <span class="sep">/</span> Owner ${a.owner} <span class="sep">/</span> Reviewed ${a.reviewed}</div>
  <section class="hero" data-layer="A" data-layer-label="A · Discover + act">
    <div>
      <h1>${a.name}<span class="tk">${a.tk}</span></h1>
      <div class="meta"><span>${a.sector}</span><span>${a.cap}</span><span>Last ${money(a.px)}</span><span>${a.catalyst}</span></div>
      <p class="thesis">${a.thesis}</p>
      <div class="pairs">
        ${pair({label:'Target vs current',value:money(a.target),comp:'/ '+money(a.px),tone:'good',pct:pct(a.px,a.target*1.1),mark:pct(a.target,a.target*1.1),note:'+'+up.toFixed(1)+'% upside'+(pendingUp?', +'+pendingUp.toFixed(1)+'% if the proposal is accepted':'')})}
        ${pair({label:'FY27 margin vs Street',value:a.margin+'%',comp:'/ '+a.street+'%',tone:a.margin>a.street?'good':'bad',pct:pct(a.margin,a.margin+2),mark:pct(a.street,a.margin+2),note:'+'+Math.round((a.margin-a.street)*100)+' bps vs Street'})}
        ${a.churn!=null?pair({label:'Churn vs break line',value:a.churn+'%',comp:'/ '+a.churnLine+'%',tone:a.churn<a.churnLine-0.2?'warn':'bad',pct:pct(a.churn,a.churnLine*1.2),mark:pct(a.churnLine,a.churnLine*1.2),note:((a.churnLine-a.churn)*100).toFixed(0)+' bps of buffer'}):pair({label:'Open vs closed questions',value:a.openQ,comp:'/ '+a.closedQ+' closed',pct:pct(a.closedQ,a.openQ+a.closedQ),note:'Underwriting '+Math.round(a.closedQ/(a.openQ+a.closedQ)*100)+'% resolved'})}
        ${pair({label:'Next catalyst',value:a.catDays+'d',comp:a.catalyst.split(' · ')[1]||'',tone:'blue',pct:100-pct(a.catDays,90),note:a.catalyst.split(' · ')[0]})}
      </div>
      ${changed(a)}
    </div>
    ${decidePanel({id:a.id,tone:d.tone,verb:d.verb,sub:d.sub,primary,why,alts})}
  </section>

  <section class="section" data-layer="B" data-layer-label="B · Scan">
    <div class="section-head"><h2>Most material change</h2><span>${pend?(pend.status==='proposed'?'needs analyst review':pend.status==='accepted'?'accepted into base case':'dismissed'):'nothing proposed'}</span></div>
    ${pend?`<div class="change${pend.status!=='proposed'?' done':''}">
      <div>
        <div class="change-top">${pend.status==='proposed'?'<span class="chip chip-blue"><i class="dot"></i>Agent proposed</span>':pend.status==='accepted'?'<span class="chip chip-good">Canonical</span>':'<span class="chip chip-neutral">Dismissed</span>'}<span>${pend.agent} · ${pend.age}</span></div>
        <div class="fromto"><span>${pend.field}</span><span class="from">${pend.from}</span><span class="arrow">→</span><span>${pend.to}</span><span class="delta">${pend.pct}</span></div>
        <p>${pend.driver}</p>
      </div>
      <div class="change-side">
        <div class="impact"><small>Target impact</small>${money(pend.status==='accepted'?a.target:a.target)} → ${money(pend.targetTo)}</div>
        ${pend.status==='proposed'?`<div class="acts"><button type="button" class="btn btn-sm btn-primary" data-action="accept" data-id="${a.id}">Accept</button><button type="button" class="btn btn-sm" data-action="openreview" data-id="${a.id}">Review diff</button><button type="button" class="btn btn-sm btn-quiet" data-action="dismiss" data-id="${a.id}">Dismiss</button></div>`:`<div class="acts"><span style="font-size:13px;color:var(--ink-3)">${pend.status==='accepted'?'Recorded in the audit trail':'Kept in history, not applied'}</span></div>`}
      </div>
    </div>`:`<div class="list"><div class="li"><div><b>No agent proposals waiting</b><span>The base case is fully analyst-confirmed.</span></div><div class="r"><span class="chip chip-good">Canonical</span></div></div></div>`}
    <div class="section-head" style="margin-top:28px"><h2>Other changes</h2><span>${a.changes.filter(c=>c.s==='due').length} need attention</span></div>
    <div class="list">${a.changes.map(c=>`<div class="li"><div><b>${c.t}</b><span>${c.n} · ${c.who} · ${c.when}</span></div><div class="r">${c.s==='canonical'?'<span class="chip chip-good">Canonical</span>':c.s==='due'?'<span class="chip chip-warn">Refresh due</span>':'<span class="chip chip-neutral">'+c.s+'</span>'}</div></div>`).join('')}</div>
  </section>

  <section class="section" data-layer="B" data-layer-label="B · Scan">
    <div class="section-head"><h2>All active names</h2><span>ordered by what needs a decision</span></div>
    <div class="rows">
      <div class="rowhead cols-a"><div>#</div><div>Name</div><div>Target / price</div><div>Margin / Street</div><div>Questions</div><div>Decision</div><div></div></div>
      ${list.map((x,i)=>{const dx=aDecide(x);const u=(x.target/x.px-1)*100;return `<div class="row cols-a${x.id===a.id?' selected':''}" data-select="active:${x.id}" tabindex="0">
        <div class="rank">${i+1}</div>
        <div class="who"><b>${x.name} <span style="display:inline;color:var(--ink-3);font-weight:500">${x.tk}</span></b><span>${x.sector} · ${x.catalyst}</span></div>
        <div class="minis">${mini(money(x.target),'+'+u.toFixed(0)+'%','good',pct(x.px,x.target*1.1),pct(x.target,x.target*1.1))}${mini(x.margin+'%','/ '+x.street,x.margin>x.street?'good':'bad')}${mini(x.openQ,'open / '+x.closedQ,'')}</div>
        ${chip(dx)}
        <div class="rowact">${dx.k==='review'?`<button type="button" class="btn btn-sm btn-primary" data-action="openreview" data-id="${x.id}">Review</button>`:dx.k==='refresh'?`<button type="button" class="btn btn-sm" data-action="request" data-id="${x.id}">Refresh</button>`:`<button type="button" class="btn btn-sm" data-action="note" data-id="${x.id}">Add note</button>`}</div>
      </div>`;}).join('')}
    </div>
  </section>

  <section class="detail three" data-layer="C" data-layer-label="C · Detail">
    <div style="grid-column:span 2"><h3>Underwriting model · USD millions</h3><div class="tblwrap"><table><thead><tr><th></th><th>FY25A</th><th>FY26E</th><th>FY27E</th><th>vs Street</th></tr></thead><tbody>${a.model.map(m=>`<tr class="${m[6]?'sub':''}"><td>${m[0]}</td><td>${m[1]}</td><td>${m[2]}</td><td class="lead">${m[3]}</td><td class="${m[5]||''}">${m[4]}</td></tr>`).join('')}</tbody></table></div>
      <h3 style="margin-top:22px">Open questions <span style="font-weight:400;text-transform:none;letter-spacing:0">· click one to see its evidence</span></h3><ul>${a.questions.slice(0,Math.max(a.openQ,0)).map((q,i)=>{const qq=QUESTIONS.filter(x=>x.cid===a.id&&!x.resolved)[i];return `<li><span>${qq?`<a href="#" data-action="openq" data-id="${qq.id}" style="color:var(--blue);text-decoration:none;font-weight:600">${q[0]} ↗</a>`:q[0]}</span><em>${q[1]}</em></li>`;}).join('')}</ul></div>
    <div><h3>Provenance</h3><ul>${a.provenance.map(p=>`<li><span>${p[0]}</span><em>${p[1]}</em></li>`).join('')}</ul>
      <h3 style="margin-top:22px">History</h3><ul>${a.history.map(h=>`<li><span>${h[0]}</span><em>${h[1]}</em></li>`).join('')}${a.audit.map(h=>`<li><span>${h[0]}</span><em>${h[1]}</em></li>`).join('')}</ul></div>
  </section>`;
}

/* ---------- BENCH ---------- */
function renderBench(){
  const list=sortBy(S.bench,bDecide);
  if(!list.length) return empty('Bench','Nothing on the bench.');
  const b=selected('bench',list,bDecide), d=bDecide(b);
  const met=b.triggers.filter(t=>t.met).length, n=b.triggers.length;
  const why=b.triggers.map(t=>`${t.met?'':'!'}${t.t}: ${t.now} vs ${t.line}`);
  const primary = b.status?null: d.k==='reopen'?{label:'Re-open in Prospect',action:'reopen'}: d.k==='retire'?{label:'Retire and archive',action:'retire'}:{label:'Keep monitoring',action:'keep'};
  const alts = b.status?[]: d.k==='reopen'?[{label:'Keep benched',action:'keep'},{label:'Snooze 30d',action:'snooze'}]:[{label:'Re-open anyway',action:'reopen'},{label:'Edit triggers',action:'edittrig'}];
  return `
  <div class="eyebrow">Bench <span class="sep">/</span> ${list.filter(x=>!x.status).length} names preserved <span class="sep">/</span> Benched ${b.on} · ${b.days} days <span class="sep">/</span> Watch: ${b.owner} · every ${b.check}</div>
  <section class="hero" data-layer="A" data-layer-label="A · Discover + act">
    <div>
      <h1>${b.name}<span class="tk">${b.tk}</span></h1>
      <div class="meta"><span>${b.sector}</span><span>${b.cap}</span><span>Last ${money(b.px)}</span></div>
      <p class="thesis"><span style="color:var(--ink-3);font-weight:600">Benched because</span> ${b.why}</p>
      <div class="pairs">
        ${pair({label:'Triggers met',value:met+'/'+n,comp:'need '+Math.ceil(n*0.6),tone:met>=Math.ceil(n*0.6)?'good':'',pct:pct(met,n),mark:pct(Math.ceil(n*0.6),n),note:met>=Math.ceil(n*0.6)?'Re-open threshold reached':'Below re-open threshold'})}
        ${b.triggers.slice(0,3).map(t=>pair({label:t.t,value:t.now,comp:'vs '+t.line,tone:t.met?'good':'',pct:t.pct,mark:100,note:t.met?'Trigger met':'Not yet'})).join('')}
      </div>
      ${changed(b)}
    </div>
    ${decidePanel({id:b.id,tone:d.tone,verb:d.verb,sub:d.sub,primary,why,alts})}
  </section>

  <section class="section" data-layer="B" data-layer-label="B · Scan">
    <div class="section-head"><h2>What would re-open it</h2><span>trigger vs current state</span></div>

        ${pair({label:'Upside vs downside',value:'+'+f.up+'%',comp:'/ '+f.down+'%',tone:f.up>=Math.abs(f.down)?'good':'bad',pct:pct(f.up,f.up+Math.abs(f.down)),mark:50,note:(f.up/Math.abs(f.down)).toFixed(1)+'× reward to risk'})}

        ${pair({label:'Since initiation',value:'+'+f.since+'%',comp:'from '+money(f.cost),tone:'good',note:'Initiated '+f.initiated})}

  <section class="detail" data-layer="C" data-layer-label="C · Detail">
    <div><h3>Position rules</h3><p>Trim when weight breaches the cap or thesis health falls under the line. Add only when upside clears 15%, health is above 80, and there is at least 1.5 points of room. Everything else holds and says why.</p></div>

/* ---------- actions ---------- */
let toastTimer, undoStack=[];
function toast(msg,undoable){const t=document.getElementById('toast');document.getElementById('toastText').textContent=msg;document.getElementById('undoBtn').hidden=!undoable;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),undoable?5200:2600);}
function snapshot(){undoStack.push(JSON.stringify({S,sel:ui.sel,phase:ui.phase}));if(undoStack.length>20)undoStack.shift();}
function undo(){const last=undoStack.pop();if(!last)return;const o=JSON.parse(last);S=o.S;ui.sel=o.sel;ui.phase=o.phase;closeDrawer();persist();render();toast('Undone.');}
function persist(){try{localStorage.setItem('baba-proto',JSON.stringify({S,sel:ui.sel}));}catch(e){}}
function restore(){try{const raw=localStorage.getItem('baba-proto');if(!raw)return;const o=JSON.parse(raw);if(o&&o.S&&o.S.universe){S=o.S;ui.sel=o.sel||{};}}catch(e){}}
function find(phase,id){return S[phase].find(x=>x.id===id);}
function removeFrom(phase,id){const i=S[phase].findIndex(x=>x.id===id);if(i>-1)S[phase].splice(i,1);}

function promote(id){
  const c=find('universe',id); if(!c) return;
  snapshot();
  c.status='promoted';
  S.prospect.unshift({id:c.id,name:c.name,tk:c.tk,sector:c.sector,cap:c.cap,px:c.px,upside:Math.round(c.score/4),hours:0,met:0,started:'Today',due:'Sep 29',
    thesis:c.thesis,proof:{t:'Differentiated view survives first model pass',now:'Not started',line:'Verified',note:'Time box opens today'},
    checklist:[{t:'Unit economics improve with mix',s:'open',n:'Not yet tested',conf:50},{t:'Key KPI holds through the catalyst',s:'open',n:'Not yet tested',conf:50},{t:'Variant view is differentiated',s:'open',n:'Compare to Street model',conf:55},{t:'Balance sheet supports the case',s:'open',n:'Check latest 10-Q',conf:50},{t:'No regulatory overhang',s:'open',n:'Scan filings',conf:50}],

    model:[['Revenue','—','—','—','—',''],['EBITDA','—','—','—','—',''],['EBITDA margin','—','—','—','—','',true]],
    questions:p.checklist.filter(c=>c.s!=='verified').map(c=>[c.t,'Carried from Prospect']),provenance:[['Artifacts','carried from Prospect'],['Latest primary source','today']],history:[['Advanced to Active Research','Today']],audit:[],delta:['Advanced from Prospect with '+p.hours+'h of 16h used','Today']});

function pkill(id){

  p.status='killed';
  S.bench.push({id:p.id,name:p.name,tk:p.tk,sector:p.sector,cap:p.cap,px:parseFloat(String(p.px).replace(/[$,]/g,''))||50,days:0,on:'Today',owner:'Agent only',check:'7d',why:'Killed in Prospect: upside missed the hurdle with the budget spent.',prior:'Re-open if upside clears 20% or the failed proof reverses.',
    triggers:[{t:'Upside clears 20%',sub:'On Street resets or price',now:'+'+p.upside+'%',line:'20%',met:false,pct:pct(p.upside,20)},{t:'Failed proof reverses',sub:p.proof.t,now:p.proof.now,line:p.proof.line,met:false,pct:40}],changed:[['Moved to Bench','Today','neutral']],history:[['Killed in Prospect','Today']]});

function extend(id){const p=find('prospect',id); if(!p) return; RULES.prospect.budget; p.hours=Math.max(0,p.hours-4); p.log.push(['Extended 4h with reason','Today']); toast('Time box extended 4 hours. Reason logged.'); render();}
function logwork(id){const p=find('prospect',id); if(!p) return; p.hours=Math.min(16,p.hours+2); p.log.push(['Work logged','Today · 2h']); toast('2 hours logged against '+p.name+'.'); render();}
function accept(id){
  const a=find('active',id); if(!a||!a.pending) return;
  snapshot();

function retire(id){const b=find('bench',id); if(!b) return; snapshot(); b.status='retired'; toast(b.name+' retired and archived.',true); render();}

function recordSize(id,kind,to,why){
  const f=find('portfolio',id); if(!f) return;
  snapshot();
  const label={trim:'Trimmed',add:'Added',hold:'Held',exit:'Exited'}[kind];
  const prev=f.weight;
  if(kind==='exit') f.weight=0; else if(kind!=='hold') f.weight=to;
  f.status=label; f.log.unshift([label+(kind==='hold'?' at '+prev.toFixed(1)+'%':' '+prev.toFixed(1)+'% → '+f.weight.toFixed(1)+'%')+(why?' · '+why:''),'Today']);
  ui.sel.portfolio=f.id; closeDrawer(); toast(label+' '+f.name+(kind==='hold'?'.':' to '+f.weight.toFixed(1)+'%.'),true); render();

/* ---------- drawer ---------- */
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim');

    <h4>Evidence</h4><ul class="ev">${p.evidence.map(e=>`<li><a href="#" onclick="return false">${e[0]} ↗</a><em>${e[1]}</em></li>`).join('')}</ul>
    <h4>Impact if accepted</h4><div class="imp"><div><span>Base-case target</span><b>${money(a.target)} → ${money(p.targetTo)}</b></div><div><span>Implied upside</span><b>+${((a.target/a.px-1)*100).toFixed(1)}% → +${((p.targetTo/a.px-1)*100).toFixed(1)}%</b></div><div><span>FY27 EBITDA margin</span><b>${p.marginBps}</b></div><div><span>Related open question</span><b>SMB cohort durability</b></div></div>
    ${p.status==='proposed'?`<div class="foot"><button type="button" class="btn btn-primary" data-action="accept" data-id="${a.id}">Accept into base case</button><div style="display:flex;gap:8px"><button type="button" class="btn" style="flex:1" data-action="closedrawer">Edit first</button><button type="button" class="btn btn-quiet" style="flex:1" data-action="dismiss" data-id="${a.id}">Dismiss</button></div></div><div class="note">Acceptance records the reviewer, time, previous value, new value, source evidence and rationale in the audit trail. Nothing an agent proposes becomes truth without this step.</div>`:`<div class="note">This proposal is ${p.status}. See the history in the detail layer.</div>`}`);
}
function sizeDrawer(id,kind){
  const f=find('portfolio',id); if(!f) return;
  const to = kind==='trim'?(f.max-0.5):kind==='add'?(f.weight+1):kind==='exit'?0:f.weight;
  const title={trim:'Trim position',add:'Add to position',hold:'Record hold',exit:'Exit position'}[kind];
  openDrawer(`<div class="drawer-head"><div><div class="eyebrow" style="margin:0">Record decision</div><h2>${title} · ${f.name}</h2></div><button type="button" class="close" data-action="closedrawer" aria-label="Close">×</button></div>
    <div class="summary">
      ${pair({label:'Weight vs max',value:f.weight.toFixed(1)+'%',comp:'/ '+f.max.toFixed(1)+'%',tone:f.weight>f.max?'warn':''})}
      ${pair({label:'Upside vs downside',value:'+'+f.up+'%',comp:'/ '+f.down+'%',tone:f.up>=Math.abs(f.down)?'good':'bad'})}
      ${pair({label:'Health vs trim line',value:f.health,comp:'/ '+f.line,tone:f.health>=f.line+10?'good':f.health>=f.line?'warn':'bad'})}
      ${pair({label:'Since initiation',value:'+'+f.since+'%',comp:money(f.cost),tone:'good'})}
    </div>
    ${kind!=='hold'?`<div class="field"><label for="sizeTo">New weight</label><div class="sizer"><input id="sizeTo" type="number" step="0.1" min="0" max="10" value="${to.toFixed(1)}"><span>% of portfolio · from ${f.weight.toFixed(1)}%</span></div></div>`:''}
    <div class="field" style="margin-top:14px"><label for="sizeWhy">Rationale</label><textarea id="sizeWhy" placeholder="One line the next reviewer can act on…">${kind==='trim'&&f.weight>f.max?'Weight ran through the '+f.max.toFixed(1)+'% cap on price, not new conviction.':kind==='add'?'Upside and thesis health both clear; position is under-sized vs conviction.':''}</textarea></div>
    <div class="foot"><button type="button" class="btn btn-primary" data-action="confirmsize" data-id="${f.id}" data-arg="${kind}">Confirm ${kind}</button><button type="button" class="btn" data-action="closedrawer">Cancel</button></div>
    <div class="note">Every sizing action points back to a dated thesis, model version, evidence set and accountable reviewer.</div>`);
}
function questionDrawer(qid){
  const q=QUESTIONS.find(x=>x.id===qid); if(!q) return;
  const c=S[q.phase].find(x=>x.id===q.cid); const ph=PHASES.find(p=>p.id===q.phase);
  const forN=q.evidence.filter(e=>e[3]==='for').length, agN=q.evidence.length-forN;
  const tone=q.tone==='good'?'var(--green)':q.tone==='warn'?'var(--orange)':q.tone==='bad'?'var(--red)':'var(--ink)';
  openDrawer(`<div class="drawer-head"><div><div class="eyebrow" style="margin:0">Question · ${c?c.name:''} · ${ph.n}</div><h2>${q.t}</h2></div><button type="button" class="close" data-action="closedrawer" aria-label="Close">×</button></div>
    <div class="big num"><span style="color:${tone}">${q.now}</span><span class="arrow">vs</span><span class="from">${q.line}</span></div>
    <div class="srcline">Owner ${q.owner} · refreshed ${q.refreshed}${q.stale?' · <span style="color:var(--orange);font-weight:600">stale</span>':''}${q.resolved?' · <span style="color:var(--green);font-weight:600">resolved</span>':''}</div>
    <h4>Evidence · ${forN} for, ${agN} against</h4>
    <ul class="ev">${q.evidence.map(e=>`<li><span><span class="chip ${e[3]==='for'?'chip-good':'chip-bad'}" style="height:20px;font-size:11px;margin-right:6px">${e[3]==='for'?'For':'Against'}</span>${e[0]}<span style="display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px">${e[1]}</span></span><em>${e[2]}</em></li>`).join('')}</ul>
    <h4>Where it lands in the model</h4>
    <div class="imp"><div><span>Model input</span><b>${q.input}</b></div><div><span>Feeds</span><b>${q.feeds}</b></div><div><span>Current vs line</span><b>${q.now} vs ${q.line}</b></div></div>
    <div class="foot">
      ${q.resolved?'':`<button type="button" class="btn btn-primary" data-action="resolveq" data-id="${q.id}">Mark resolved · ${q.now} holds</button>`}
      <div style="display:flex;gap:8px"><button type="button" class="btn" style="flex:1" data-action="refreshq" data-id="${q.id}">Request refresh</button><button type="button" class="btn" style="flex:1" data-action="noteq" data-id="${q.id}">Add evidence</button></div>
    </div>
    <div class="note">A question is answered by evidence, not by a number changing. Resolving it records the answer, the evidence set and the reviewer, and closes it on the ${ph.n} screen.</div>`);
}
function noteDrawer(id){
  const a=find('active',id); if(!a) return;
  openDrawer(`<div class="drawer-head"><div><div class="eyebrow" style="margin:0">Analyst note</div><h2>${a.name}</h2></div><button type="button" class="close" data-action="closedrawer" aria-label="Close">×</button></div>
    <div class="field"><label for="noteText">Note</label><textarea id="noteText" placeholder="What did you learn, and what does it change?"></textarea></div>
    <div class="foot"><button type="button" class="btn btn-primary" data-action="savenote" data-id="${a.id}">Save note</button><button type="button" class="btn" data-action="closedrawer">Cancel</button></div>`);
}

/* ---------- palette ---------- */
const pal=document.getElementById('palette'), palInput=document.getElementById('palInput'), palRes=document.getElementById('palRes');
let palHi=0;
function allEntities(){
  const out=[];
  PHASES.forEach(p=>S[p.id].forEach(x=>out.push({phase:p.id,phaseName:p.n,id:x.id,name:x.name,tk:x.tk,sub:x.sector||''})));
  QUESTIONS.forEach(q=>{const c=S[q.phase].find(x=>x.id===q.cid);const cname=c?c.name:'';
    out.push({phase:q.phase,phaseName:'Question',id:null,q:q.id,name:q.t,tk:'',sub:cname+' · '+q.now+' vs '+q.line});
    q.evidence.forEach(e=>out.push({phase:q.phase,phaseName:'Source',id:null,q:q.id,name:e[1],tk:'',sub:e[0]+' · '+cname+' · '+e[2]}));});
  PHASES.forEach(p=>out.push({phase:p.id,phaseName:'Phase',id:null,name:p.n,tk:'',sub:p.q}));
  return out;
}
function openPalette(){pal.classList.add('open');palInput.value='';palHi=0;renderPal();setTimeout(()=>palInput.focus(),10);}
function closePalette(){pal.classList.remove('open');}
function renderPal(){
  const q=palInput.value.trim().toLowerCase();
  const items=allEntities().filter(e=>!q||(e.name+' '+e.tk+' '+e.sub+' '+e.phaseName).toLowerCase().includes(q)).slice(0,9);
  palRes.innerHTML=items.length?items.map((e,i)=>`<button type="button" class="${i===palHi?'hi':''}" data-jump="${e.phase}:${e.id||''}:${e.q||''}"><span><b>${e.name}${e.tk?' <span style="color:var(--ink-3);font-weight:500">'+e.tk+'</span>':''}</b><span>${e.sub}</span></span><em>${e.phaseName}</em></button>`).join(''):'<div class="empty">No matches.</div>';
}
palInput.addEventListener('input',()=>{palHi=0;renderPal();});
palInput.addEventListener('keydown',e=>{
  const btns=[...palRes.querySelectorAll('button')];
  if(e.key==='ArrowDown'){e.preventDefault();palHi=Math.min(btns.length-1,palHi+1);renderPal();}
  else if(e.key==='ArrowUp'){e.preventDefault();palHi=Math.max(0,palHi-1);renderPal();}
  else if(e.key==='Enter'){const b=btns[palHi];if(b){jump(b.dataset.jump);}}
  else if(e.key==='Escape'){closePalette();}
});
function jump(v){const [phase,id,q]=v.split(':');closePalette();if(q){const qq=QUESTIONS.find(x=>x.id===q);go(phase,qq?qq.cid:null);setTimeout(()=>questionDrawer(q),250);}else go(phase,id||null);}
pal.addEventListener('click',e=>{const b=e.target.closest('[data-jump]');if(b)jump(b.dataset.jump);else if(e.target===pal)closePalette();});

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('a[data-action]')) e.preventDefault();
  const sel=e.target.closest('[data-select]');
  if(sel&&!e.target.closest('button')){const [phase,id]=sel.dataset.select.split(':');ui.sel[phase]=id;render();return;}
  const b=e.target.closest('[data-action]'); if(!b) return;
  const act=b.dataset.action, id=b.dataset.id, arg=b.dataset.arg;
  switch(act){
    case 'promote': promote(id); break;
    case 'hold': {const c=find('universe',id); if(c){snapshot();c.status='held';toast(c.name+' held. Re-screens next Monday.',true);render();} break;}
    case 'kill': {const c=find('universe',id); if(c){snapshot();c.status='killed';toast(c.name+' killed for this cycle.',true);render();} break;}
    case 'refresh': {const c=find('universe',id); if(c){c.cov=Math.max(c.cov,88);c.sources=c.sources.map(s=>s[1]==='missing'?[s[0],'refreshed today']:s);toast('Coverage refresh requested for '+c.name+'. Coverage now '+c.cov+'%.');render();} break;}
    case 'advance': advance(id); break;
    case 'pkill': pkill(id); break;
    case 'extend': extend(id); break;
    case 'logwork': logwork(id); break;
    case 'openreview': reviewDrawer(id); break;
    case 'accept': accept(id); break;
    case 'dismiss': dismiss(id); break;
    case 'note': noteDrawer(id); break;
    case 'savenote': {const a=find('active',id);const t=document.getElementById('noteText');if(a&&t&&t.value.trim()){a.audit.unshift(['Note: '+esc(t.value.trim()).slice(0,120),'Today']);}closeDrawer();toast('Note saved to '+(a?a.name:'the record')+'.');render();break;}
    case 'tobench': tobench(id); break;
    case 'request': toast('Agent update requested. New evidence will arrive as a proposal, never as a silent change.'); break;
    case 'reopen': reopen(id); break;
    case 'retire': retire(id); break;
    case 'keep': keep(id); break;
    case 'snooze': snooze(id); break;
    case 'edittrig': toast('Trigger editing is out of scope for this prototype.'); break;
    case 'size': sizeDrawer(id,arg); break;
    case 'confirmsize': {const to=parseFloat((document.getElementById('sizeTo')||{}).value);const why=(document.getElementById('sizeWhy')||{}).value||'';recordSize(id,arg,isNaN(to)?undefined:to,esc(why.trim()));break;}
    case 'openq': questionDrawer(id); break;
    case 'resolveq': {const q=QUESTIONS.find(x=>x.id===id); if(!q||q.resolved) break; snapshot(); q.resolved=true; q.refreshed='just now';
      const c=S[q.phase].find(x=>x.id===q.cid);
      if(c&&c.openQ!=null){c.openQ=Math.max(0,c.openQ-1);c.closedQ=(c.closedQ||0)+1;c.audit=c.audit||[];c.audit.unshift(['Resolved: '+q.t+' · '+q.now+' vs '+q.line+' · '+q.evidence.length+' sources · Riley Chen','Today']);c.questions=(c.questions||[]).filter(x=>x[0]!==q.short&&!q.t.toLowerCase().includes((x[0]||'').toLowerCase().split(' ').slice(0,2).join(' ')));}
      if(c&&c.checklist){const item=c.checklist.find(x=>x.s==='open');if(item){item.s='verified';item.conf=Math.max(item.conf,75);c.met=Math.min(5,c.met+1);}}
      closeDrawer(); toast('Question resolved and recorded with its evidence.',true); render(); break;}
    case 'refreshq': {const q=QUESTIONS.find(x=>x.id===id); if(q){q.stale=false;q.refreshed='requested just now';} toast('Refresh requested. New evidence arrives as a proposal.'); questionDrawer(id); break;}
    case 'noteq': toast('Evidence capture is out of scope for this prototype.'); break;
    case 'closedrawer': closeDrawer(); break;
    case 'reset': S=seed(); ui.sel={}; undoStack=[]; closeDrawer(); try{localStorage.removeItem('baba-proto');}catch(e){} toast('Demo data reset.'); render(); break;
    case 'undo': undo(); break;
  }
});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.classList.contains('open')?closePalette():openPalette();return;}
  if(e.key==='Escape'){closeDrawer();closePalette();return;}
  if(typing) return;
  if(e.key.toLowerCase()==='h'){toggleLayers();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  const ph=PHASES.find(p=>p.k===e.key); if(ph){go(ph.id);}
  if(e.key==='Enter'&&document.activeElement.dataset&&document.activeElement.dataset.select){const [phase,id]=document.activeElement.dataset.select.split(':');ui.sel[phase]=id;render();}
});
document.getElementById('searchBtn').addEventListener('click',openPalette);
document.getElementById('searchBtn').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPalette();}});
scrim.addEventListener('click',closeDrawer);
function toggleLayers(){ui.layers=!ui.layers;document.body.classList.toggle('layers',ui.layers);document.getElementById('layersBtn').classList.toggle('on',ui.layers);}
document.getElementById('layersBtn').addEventListener('click',toggleLayers);
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('[data-phase]');if(a){e.preventDefault();go(a.dataset.phase);}});
window.addEventListener('hashchange',()=>{const h=location.hash.replace('#','');if(PHASES.some(p=>p.id===h)&&h!==ui.phase){ui.phase=h;render();}});

/* ---------- boot ---------- */
(function(){
  restore();
  const h=location.hash.replace('#','');
  if(PHASES.some(p=>p.id===h)) ui.phase=h;
  render();
})();
</script>
</body>
